// ============================================================
// INFOLD — ネイティブ Android ニュースアプリ（Jetpack Compose）
// ============================================================
// WebView / TWA は一切使用しない。すべての画面は Compose の
// ネイティブ UI で実装し、データは INFOLD API（Cloudflare
// Worker / D1）から取得する。
//
// 署名について:
//   android/keystore.properties（Git にコミットしない）があれば
//   Release ビルドをその鍵で署名する。無ければ debug 鍵で署名する
//   （実機テスト用）。
//
//   keystore.properties の形式（storeFile は android/ からの相対パス）:
//     storeFile=infold-release.keystore
//     storePassword=...
//     keyAlias=infold
//     keyPassword=...
//
// Firebase Cloud Messaging（プッシュ通知）:
//   app/google-services.json を配置すると google-services プラグインが
//   適用され FCM が有効になる。無い場合は FCM 無効のままビルド・実行
//   できる（アプリは通知なしで動作する）。
// ============================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// google-services プラグインは google-services.json が存在する場合のみ適用
def hasGoogleServices = file('google-services.json').exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'jp.infold.news'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.infold.news'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0.1'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 署名鍵があれば release 鍵、無ければ debug 鍵で署名
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
            ]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // ---- Jetpack Compose ----
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ---- AndroidX / lifecycle / navigation ----
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.9'

    // ---- Network / serialization / image ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // SVG サムネイル（R2 未設定時の data URI 形式）の描画に必要
    implementation 'io.coil-kt:coil-svg:2.7.0'

    // ---- Firebase Cloud Messaging（google-services.json なしでも動作） ----
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
