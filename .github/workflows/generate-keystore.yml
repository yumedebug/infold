# ============================================================
# Release 署名用 keystore の生成ワークフロー
# ------------------------------------------------------------
# ローカルに Android Studio / JDK がなくても、このワークフローを
# GitHub Actions 画面から手動実行するだけで、Release 署名用の
# keystore を生成して Artifact としてダウンロードできる。
#
# 使い方:
#   1. Actions タブ →「Generate release keystore」→ Run workflow
#   2. 完了後、Artifact「infold-release-keystore」をダウンロード
#      - infold-release.keystore  … 署名鍵本体
#      - keystore-password.txt    … パスワード（鍵と同一）
#   3. ログに表示される SHA256 フィンガープリントを控える
#      （.well-known/assetlinks.json に記載する値）
#   4. keystore を base64 エンコードして GitHub Secrets に設定:
#      - ANDROID_KEYSTORE_BASE64   … base64 文字列
#      - ANDROID_KEYSTORE_PASSWORD … keystore-password.txt の内容
#      - ANDROID_KEY_ALIAS         … infold
# ============================================================

name: Generate release keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java (Temurin JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          # ランダムなパスワードを生成
          PW=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 20)
          keytool -genkeypair -v \
            -keystore infold-release.keystore \
            -alias infold \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=INFOLD, OU=INFOLD, O=INFOLD, L=Tokyo, ST=Tokyo, C=JP"
          echo "$PW" > keystore-password.txt

          echo "=============================================="
          echo "署名フィンガープリント"
          echo "（.well-known/assetlinks.json の sha256_cert_fingerprints に記載する値）"
          echo "=============================================="
          keytool -list -v -keystore infold-release.keystore \
            -storepass "$PW" -alias infold | grep -A1 'SHA256:' | head -2

          echo ""
          echo "パスワードは keystore-password.txt（Artifact 内）に保存されています。"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: infold-release-keystore
          path: |
            infold-release.keystore
            keystore-password.txt
          retention-days: 7
