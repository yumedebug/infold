# ============================================================
# INFOLD Android アプリ ビルドワークフロー
# ------------------------------------------------------------
# ローカルの PC に Android Studio / Android SDK がなくても、
# GitHub 上（ubuntu-latest）で以下をビルドして Artifact として保存する。
#   - Debug APK
#   - Release APK
#   - Release AAB（Google Play 提出用）
#
# トリガー:
#   - main ブランチへの push（android/ または本ファイルの変更時）
#   - GitHub Actions 画面からの手動実行（workflow_dispatch）
#
# 署名について:
#   GitHub Secrets に下記を設定すると、Release 署名付き APK/AAB を生成する。
#     ANDROID_KEYSTORE_BASE64    keystore ファイルを base64 エンコードした文字列
#     ANDROID_KEYSTORE_PASSWORD  keystore / 鍵のパスワード
#     ANDROID_KEY_ALIAS          鍵のエイリアス（例: infold）
#   Secrets が無い場合は debug 鍵で署名した APK/AAB を生成する
#   （実機テスト用。Google Play に提出する場合は署名鍵が必要）。
#   署名鍵はリポジトリにコミットせず、必ず Secrets で管理する。
#
#   keystore の生成は「Generate release keystore」ワークフロー
#   （.github/workflows/generate-keystore.yml）で行える。
# ============================================================

name: Build INFOLD Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Secrets をジョブ全体で使えるようにする（未設定なら空文字）
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

jobs:
  build-apk:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 1. Java 環境 ----
      - name: Set up Java (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---- 2. Android SDK ----
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ---- 3. Gradle（キャッシュ付き） ----
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---- 4. Release 署名鍵（Secrets がある場合のみ） ----
      - name: Write release keystore from secrets
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/infold-release.keystore
          # パスワードに特殊文字が含まれても安全なよう printf で書き出す
          printf 'storeFile=infold-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" \
            > android/keystore.properties
          echo "::group::Release keystore"
          keytool -list -v -keystore android/infold-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            2>/dev/null | grep -A1 'SHA256:' | head -2
          echo "::endgroup::"

      # ---- 5. Gradle ビルド（Debug APK / Release APK / Release AAB） ----
      - name: Build APKs and AAB
        working-directory: android
        run: |
          # Windows 環境で git add された場合に実行権限が失われることがあるため明示的に付与
          chmod +x gradlew
          # ログをファイルにも残す（失敗時の原因調査用）
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # ---- 失敗時にビルドログを Artifact として保存（原因調査用） ----
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log
          if-no-files-found: ignore
          retention-days: 7

      # ---- 署名フィンガープリントの表示 ----
      - name: Print signing fingerprint
        if: always()
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "署名フィンガープリント:"
            keytool -printcert -jarfile "$APK" 2>/dev/null | grep -A1 'SHA256:' | head -2 || true
          fi

      # ---- 6. ビルド成果物を Artifact として保存 ----
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infold-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infold-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # ---- 7. GitHub Releases にも公開（ダウンロードしやすくするため） ----
      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1)
          ASSETS="$APK"
          if [ -n "$AAB" ]; then ASSETS="$ASSETS $AAB"; fi
          gh release create \
            "v2.0.1-${{ github.run_number }}" \
            $ASSETS \
            --title "INFOLD ネイティブアプリ (ビルド #${{ github.run_number }})" \
            --notes "GitHub Actions で自動ビルドされた INFOLD ネイティブ Android アプリ（APK / AAB）。" \
            --repo "${{ github.repository }}"
