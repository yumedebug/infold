.container.article-page, .container.page, .container.search-page {
  padding-left: calc(var(--gutter) + env(safe-area-inset-left));
  padding-right: calc(var(--gutter) + env(safe-area-inset-right));
}
.article-page { padding-top: var(--sp-6); }

.article-hero > img { background: var(--bg-soft); }

/* ---------- 7. ボタン / チップ / 入力（高さを固定） ---------- */
.btn { height: 44px; padding: 0 20px; font-size: 11px; letter-spacing: .1em; }
.btn-sm { height: 34px; padding: 0 13px; font-size: 10.5px; }
.btn-ghost { border-color: var(--border); }
.chip, .filter-pill { height: 38px; padding: 0 var(--sp-4); font-size: 10.5px; }
.search-input, .input, select.input { height: 44px; padding: 0 14px; font-size: 14px; }
textarea.input { height: auto; min-height: 120px; padding: 12px 14px; }
.search-page .search-input, .search-page .search-form .input, .search-page .search-form .btn { height: 52px; }
.field { margin-bottom: var(--sp-4); }
.form-actions, .form-main, .form-side { gap: var(--sp-4); }

/* ---------- 8. 記事詳細のリズム ---------- */
.article-page { padding: 0 0 var(--sp-9); }
.article-head { margin: var(--sp-6) auto 0; }
.article-head .badges { margin: 0 0 var(--sp-4); }
.article-head h1 { margin: 0 0 var(--sp-4); }
.article-head .meta { padding: var(--sp-3) 0; gap: var(--sp-3); }
.prose { margin: var(--sp-6) auto 0; font-size: 17px; line-height: 1.9; }
.prose p { margin: 0 0 1.5em; }
.source-box { margin: var(--sp-6) auto 0; }
.points-note { margin: var(--sp-4) auto 0; }

/* ---------- 9. 一覧 / 管理 / ポイント等のシェル ---------- */
.page-head { padding: var(--sp-7) 0 var(--sp-5); margin: 0 0 var(--sp-6); }
.page-sub { margin: var(--sp-3) 0 0; max-width: 720px; }
.filter-pills { margin-top: var(--sp-5); }
.result-count { margin: var(--sp-5) 0 var(--sp-4); }
.load-more-wrap { margin-top: var(--sp-6); }
.pts-wrap, .notice-page { gap: 1px; }
.pts-hero { padding: var(--sp-6) var(--sp-6); }
.pts-card, .panel, .notice-card, .ai-preview { padding: var(--sp-5) var(--sp-5); }
.pts-card h2, .panel h2, .notice-card h2 { margin: 0 0 var(--sp-4); font-size: 16px; }
.pts-plan { padding: var(--sp-5); gap: var(--sp-2); }
.stat-card { padding: var(--sp-5); }
.stat-card .stat-num { font-size: 30px; }
.admin-head { margin: 0 0 var(--sp-5); gap: var(--sp-3); }
.ai-config-grid { gap: var(--sp-4); }
.login-card { padding: var(--sp-6); }

/* ---------- 10. フッター / トースト ---------- */
.site-footer { padding: var(--sp-8) 0 var(--sp-5); }
.footer-grid { grid-template-columns: 1.6fr .8fr .8fr; gap: var(--sp-7); padding: 0 0 var(--sp-6); }
.footer-col li { margin-bottom: var(--sp-2); }
.footer-bottom { padding-top: var(--sp-4); }
.toast-root { top: calc(var(--header-h) + var(--sp-3)); right: var(--gutter); }

/* ---------- 11. レスポンシブ（同じスケールを縮めるだけ） ---------- */
@media (max-width: 1240px) {
  :root { --maxw: 1160px; }
  .grid-4, .auto-grid, .cat-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1080px) {
  :root { --section-pad: var(--sp-7); --header-h: 96px; --fs-display: clamp(34px, 5.4vw, 48px); }
  .hero-main { grid-template-columns: 1fr; }
  .hero-main-card { min-height: 420px; }
  .hero-side-list { grid-template-rows: none; }
  .latest-layout, .category-layout { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .latest-lead { grid-column: 1 / -1; }
  .latest-list { grid-template-rows: none; }
  .grid-2, .grid-3, .grid-4, .auto-grid, .cat-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  :root { --section-pad: 44px; --gutter: 16px; --fs-h1: 30px; --fs-h2: 26px; --header-h: 72px; }
  .hero-main-card { min-height: 340px; }
  .hero-main-body { padding: var(--sp-4); }
  .hero-main-body h1 { font-size: clamp(26px, 7.4vw, 34px); }
  .hero-side-item { grid-template-columns: 84px minmax(0, 1fr); padding: var(--sp-3); }
  .hero-side-thumb { width: 84px; }
  .latest-layout, .category-layout, .grid-2, .grid-3, .grid-4, .auto-grid, .cat-rail, .notice-grid, .pts-grid { grid-template-columns: 1fr; }
  .latest-item { grid-template-columns: 22px minmax(0, 1fr) 84px; padding: var(--sp-3); }
  .latest-item .thumb { width: 84px; }
  .card-body { padding: var(--sp-4); }
  .section-head, .category-head { flex-direction: column; align-items: flex-start; gap: var(--sp-2); margin-bottom: var(--sp-4); }
  .article-hero { aspect-ratio: 16 / 9; }
  .prose { font-size: 16px; line-height: 1.9; }
  .footer-grid { grid-template-columns: 1fr; gap: var(--sp-6); }
  .pts-hero { padding: var(--sp-5); }
}

/* ============================================================
   4.0h おすすめは 1記事だけを大きく（TOP STORY）
   − 最新ニュースの先頭記事を全幅の 1 枚で見せる
   − サイドの小リストは廃止（続きは「最新ニュース」で見せる）
   ============================================================ */
.home-hero > .container { padding-top: var(--sp-6); }
.hero-feature {
  position: relative;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  isolation: isolate;
  min-height: clamp(430px, 46vw, 680px);
  border: 1px solid var(--border);
  background: #0E1013;
  color: #fff;
  text-decoration: none;
}
.hero-feature > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.001);
  transition: transform .9s cubic-bezier(.2, .7, .2, 1);
}
.hero-feature:hover > img { transform: scale(1.035); }
.hero-feature > img.img-fail { opacity: 0; }
.hero-feature .hero-shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg, rgba(10, 11, 13, .1) 0%, rgba(10, 11, 13, .45) 42%, rgba(10, 11, 13, .93) 100%),
    linear-gradient(90deg, rgba(10, 11, 13, .78) 0%, rgba(10, 11, 13, .1) 62%);
}
.hero-feature-body {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: clamp(24px, 3.4vw, 56px);
}
.hero-feature-kicker {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin: 0 0 var(--sp-4);
  font-size: var(--fs-label);
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #C8CCD2;
}
.hero-feature-kicker .hero-pick {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  background: var(--primary);
  color: var(--on-primary);
  letter-spacing: .12em;
}
.hero-feature-kicker .hero-dot { color: var(--faint); }
.hero-feature-body h1 {
  margin: 0 0 var(--sp-4);
  max-width: 1040px;
  font-size: clamp(30px, 4.35vw, 66px);
  line-height: 1.04;
  letter-spacing: -.035em;
  font-weight: 900;
  text-wrap: balance;
}
.hero-feature-body p {
  margin: 0 0 var(--sp-6);
  max-width: 740px;
  color: #D3D7DD;
  font-size: clamp(14px, 1.05vw, 16.5px);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hero-feature-foot {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
}
.hero-feature-foot time {
  color: #A6ABB2;
  font-size: var(--fs-label);
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.hero-feature:hover .btn-primary { background: var(--primary-2); }
.hero-feature:has(img.img-fail) { min-height: 360px; }
.skeleton.sk-hero { min-height: clamp(430px, 46vw, 680px); border-radius: 0; }

@media (max-width: 1080px) {
  .hero-feature { min-height: 420px; }
  .hero-feature-body h1 { font-size: clamp(28px, 4.6vw, 48px); }
}
@media (max-width: 768px) {
  .hero-feature { min-height: 380px; }
  .hero-feature-body { padding: var(--sp-5) var(--sp-4) var(--sp-5); }
  .hero-feature-body h1 { font-size: clamp(25px, 7.2vw, 33px); margin-bottom: var(--sp-3); }
  .hero-feature-body p { -webkit-line-clamp: 2; margin-bottom: var(--sp-5); }
  .hero-feature-foot .btn { height: 40px; }
}
/* 4.0h */

/* ============================================================
   5.0 管理画面 / 通知画面の統一
   ------------------------------------------------------------
   公開サイトと同じリズム（kicker → h1 → 説明 → 右アクション）に揃え、
   面は panel 1種類・情報は info-item の行で出す。
   ============================================================ */

/* ---- シェル ---- */
.admin-layout { grid-template-columns: 248px minmax(0, 1fr); gap: 0; padding: 0; border-top: 1px solid var(--border); }
.admin-side { display: flex; flex-direction: column; padding: 22px 0 18px; border: 0; border-right: 1px solid var(--border); border-radius: 0; background: var(--bg-soft); }
.admin-content { padding: var(--sp-7) var(--gutter) var(--sp-8); }

/* ---- サイドナビ ---- */

.admin-nav { display: flex; flex-direction: column; padding: 8px 0; }
.admin-nav-item { gap: 11px; padding: 11px 20px; border-left: 2px solid transparent; }

.admin-nav-item.active { border-left-color: var(--primary); background: var(--card); color: var(--primary); }

.admin-side-foot { display: flex; flex-direction: column; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }

/* ---- 見出し（管理 / 通知で共通） ---- */
.admin-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--sp-4); flex-wrap: wrap;
  margin: 0 0 var(--sp-5); padding: 0 0 var(--sp-4); border-bottom: 1px solid var(--border);
}
.admin-head-main { min-width: 0; }
.admin-head h1 { margin: 0; font-size: var(--fs-h1); line-height: 1.08; letter-spacing: -.03em; }
.admin-head .category-kicker { margin-bottom: 6px; color: var(--primary); }
.admin-head-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
/* 通知ページ: 公開サイトの page-head に管理画面と同じ右寄せレイアウトを足す */
.page-head-split { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; padding-bottom: var(--sp-4); border-bottom: 1px solid var(--border); }
.page-head-split .category-kicker { margin-bottom: 6px; color: var(--primary); }
.page-head-split h1 { margin: 0; font-size: var(--fs-h1); line-height: 1.08; letter-spacing: -.03em; }
.page-head-split .page-sub { margin: var(--sp-3) 0 0; }

/* ---- パネル ---- */
.panel { padding: 0; }
.panel > :not(.panel-head):not(.table-wrap) { padding-left: var(--sp-5); padding-right: var(--sp-5); }
.panel > :first-child:not(.panel-head) { padding-top: var(--sp-5); }
.panel > :last-child:not(.panel-head) { padding-bottom: var(--sp-5); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: 18px var(--sp-5); border-bottom: 1px solid var(--border); }
.panel-head h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.panel-head-sub { margin-top: var(--sp-5); padding-left: 0; padding-right: 0; border-bottom: 0; }
.panel > .table-wrap { border-width: 1px 0 0; }
.panel-actions { display: flex; align-items: center; justify-content: flex-end; padding-top: var(--sp-4); }

/* ---- 統計カード ---- */
.stat-card { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-5); }
.stat-card .stat-ic { color: var(--primary); line-height: 0; }
.stat-card .stat-ic svg { width: 18px; height: 18px; }
.stat-card .stat-num { font-size: 34px; }
.stat-card .stat-text { font-size: 13px; font-weight: 700; line-height: 1.5; letter-spacing: 0; word-break: break-all; }
.stat-card .stat-label { margin-top: auto; }

/* ---- 一覧ツールバー ---- */
.admin-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; margin: 0 0 var(--sp-4); }
.admin-toolbar .filter-pills { margin: 0; }
.admin-search { max-width: 280px; height: 38px; }

/* ステータスチップは角丸0！（旧レイヤの pill を打ち消す） */
.status-chip { border-radius: 0; white-space: nowrap; }

/* 破壊的操作は控えめな枠線ボタンに */
.btn-quiet-danger { background: transparent; border-color: color-mix(in srgb, var(--danger) 36%, var(--border)); color: var(--danger); }
.btn-quiet-danger:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); border-color: var(--danger); color: var(--danger); }

.info-list { display: block; background: none; }
.panel .info-list .info-item { background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 13px 0; }
.panel .info-list > .info-item:last-child { border-bottom: 0; padding-bottom: 0; }

/* ---- 通知 ---- */
.notice-page { max-width: none; margin: 0; padding: var(--sp-7) 0 var(--sp-8); }
.notice-grid { gap: 1px; border: 1px solid var(--border); background: var(--border); margin-bottom: 1px; }
.notice-grid .panel { border: 0; }
.notice-panel { margin-bottom: 1px; }
.notice-list li { padding: 12px 0; }

/* 管理画面では AIChat の FAB が表に重なるので隠す */
html[data-admin] .aichat-fab { display: none !important; }

/* ---- レスポンシブ ---- */
@media (max-width: 1080px) {
  .admin-layout { grid-template-columns: 1fr; }
  .admin-side { border-right: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 12px 0; }
  .admin-side .side-user { display: none; }
  .admin-nav { flex-direction: row; overflow-x: auto; padding: 0; }
  .admin-nav-item { white-space: nowrap; border-left-width: 0; border-bottom: 2px solid transparent; padding: 10px 14px; }
  .admin-nav-item.active { border-left-width: 0; border-bottom-color: var(--primary); background: transparent; }
  .admin-side-foot { flex-direction: row; margin-top: 0; padding-top: 4px; border-top: 0; }
  .admin-content { padding-top: var(--sp-5); }
}
@media (max-width: 720px) {
  .admin-head { align-items: flex-start; flex-direction: column; }

  .page-head-split { align-items: flex-start; }

  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .admin-nav { flex-wrap: wrap; overflow-x: visible; }
  .admin-nav-item { padding: 9px 12px; }
  .admin-toolbar { align-items: stretch; }
  .admin-toolbar .filter-pills { width: 100%; overflow-x: auto; }
  .admin-search { max-width: none; width: 100%; }
  .panel > :not(.panel-head):not(.table-wrap) { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .panel-head { padding: 14px var(--sp-4); }
}

/* ---------------- api ---------------- */
const api = {
  async request(method, path, body) {
    let res;
    try {
      const opts = { method, headers: { 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'include' };
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      res = await fetch(path, opts);
    } catch (err) {
      state.backendDown = true;
      updateOfflineBanner();
      const e = new Error('network');
      e.isNetwork = true;
      throw e;
    }
    if (!res) throw new Error('no response');
    let data = null;
    try { data = await res.json(); } catch (_) { /* ignore */ }
    if (!res.ok) {
      const e = new Error((data && data.error) || 'HTTP ' + res.status);
      e.status = res.status;
      e.data = data || {};
      throw e;
    }
    state.backendDown = false;
    updateOfflineBanner();
    return data;
  },
  get: (p) => api.request('GET', p),
  post: (p, b) => api.request('POST', p, b),
  put: (p, b) => api.request('PUT', p, b),
  del: (p) => api.request('DELETE', p),
  async upload(file) {
    const data = await fileToBase64(file);
    return api.post('/api/admin/upload', { fileName: file.name, contentType: file.type || 'application/octet-stream', data });
  },
};
function updateOfflineBanner() {
  const el = $('#offline-banner');
  if (!el) return;
  el.classList.toggle('show', state.backendDown);
  $('#offline-msg').textContent = t('common.offline');
}

/* ---------------- navigation ---------------- */
let useHash = location.protocol === 'file:';
function currentPath() {
  if (useHash) return location.hash.replace(/^#/, '') || '/';
  const p = location.pathname;
  return p.startsWith('/') ? p : '/' + p;
}
function navigate(path) {
  if (useHash) {
    location.hash = '#' + path;
  } else {
    if (location.pathname + location.search === path || (location.pathname === path && !location.search)) {
      render();
    } else {
      history.pushState({}, '', path);
      render();
    }
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function parsePath() {
  const full = currentPath();
  const qi = full.indexOf('?');
  const path = qi === -1 ? full : full.slice(0, qi);
  const query = new URLSearchParams(qi === -1 ? '' : full.slice(qi + 1));
  return { path: path === '' ? '/' : path, query };
}

function confirmDialog(opts) {
  return new Promise((resolve) => {
    const root = $('#modal-root');
    root.innerHTML = `
    <div class="modal-backdrop" data-modal-close>
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opts.title)}">
        <h3 class="modal-title">${esc(opts.title)}</h3>
        <p class="modal-message">${esc(opts.message || '')}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-modal-cancel>${esc(t('common.cancel'))}</button>
          <button class="btn ${opts.danger === false ? 'btn-primary' : 'btn-danger'}" data-modal-ok>${esc(opts.confirmText || t('common.confirm'))}</button>
        </div>
      </div>
    </div>`;
    root.classList.add('open');
    const close = (val) => { root.classList.remove('open'); root.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(val); };
    const onKey = (e) => { if (e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    $('[data-modal-ok]', root).onclick = () => close(true);
    $('[data-modal-cancel]', root).onclick = () => close(false);
    $('[data-modal-close]', root).onclick = (e) => { if (e.target === e.currentTarget) close(false); };
    $('[data-modal-ok]', root).focus();
  });
}

/* ---------------- content renderer (sanitized) ---------------- */
const URL_RE = /(https?:\/\/[^\s<>"']+)/gi;
function inlineFormat(s) {
  let out = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // NOTE: input is already HTML-escaped (renderContent escapes first), and
  // URL_RE excludes quotes/<>/whitespace, so inserting the matched URL
  // directly into href is safe and avoids double-escaping (& -> &amp;amp;).
  out = out.replace(URL_RE, (m, url) => {
    const safeUrl2 = safeUrl(url);
    if (!safeUrl2) return m;
    const trimmed = safeUrl2.replace(/[.,;:!?。、）)]+$/, '');
    const tail = safeUrl2.slice(trimmed.length);
    return '<a href="' + trimmed + '" target="_blank" rel="noopener noreferrer">' + trimmed + '</a>' + tail;
  });
  return out;
}
function renderContent(text) {
  const safe = esc(text || '');
  const lines = safe.split(/\n/);
  const blocks = [];
  let cur = [];
  for (const line of lines) {
    if (line.trim() === '') {
      if (cur.length) { blocks.push(cur); cur = []; }
      continue;
    }
    cur.push(line);
  }
  if (cur.length) blocks.push(cur);
  const parts = blocks.map((block) => {
    const first = block[0];
    if (first.startsWith('## ')) {
      return '<h2>' + inlineFormat(first.slice(3)) + '</h2>' + block.slice(1).map((p) => '<p>' + inlineFormat(p) + '</p>').join('');
    }
    if (block.every((l) => l.startsWith('- ') || l.startsWith('* '))) {
      return '<ul>' + block.map((l) => '<li>' + inlineFormat(l.replace(/^[-*] /, '')) + '</li>').join('') + '</ul>';
    }
    // A single line that is just a URL -> OGP link card
    if (block.length === 1 && /^https?:\/\/\S+$/i.test(first.trim())) {
      return linkCard(first.trim());
    }
    return '<p>' + block.map(inlineFormat).join('<br>') + '</p>';
  });
  return withAdSlots(parts);
}

/* ---------------- in-article ads (meax) ---------------- */
const MEAX_SRC = 'https://maa-sdk.dstk.jp/tag/v1.js';
const MEAX_APP = 'app-c2b1dcceb0d4';
const MEAX_UNIT = 'unit-42ba5ed414cc';

/* placeholder div (実際の広告タグは injectMeax() で差し込む) */
function adSlotHtml() {
  return '<div class="ad-meax-slot"></div>';
}

/* 本文のブロック(段落・見出し)の間に広告を 1〜2 回配置する。
   6ブロック以上: 1/3 と 2/3 の位置に2回 / 2〜5ブロック: 中央に1回 / 1ブロック以下: 広告なし */
function withAdSlots(parts) {
  const n = parts.length;
  if (!n) return '';
  const at = [];
  if (n >= 6) at.push(Math.floor(n / 3), Math.floor((2 * n) / 3));
  else if (n >= 2) at.push(Math.floor((n - 1) / 2));
  if (!at.length) return parts.join('');
  let html = '';
  parts.forEach((part, i) => {
    html += part;
    if (at.indexOf(i) !== -1) html += adSlotHtml();
  });
  return html;
}

/* innerHTML で挿入した <script> は実行されないため、
   プレースホルダを meax の広告タグに置き換えてから SDK を読み込む */
let meaxSdkLoading = false;
function loadMeaxSdk() {
  if (meaxSdkLoading) return;
  meaxSdkLoading = true;
  const s = document.createElement('script');
  s.src = MEAX_SRC;
  s.async = true;
  // 読み込み後にフラグを戻し、SPA遷移後の再描画でも広告枠を走査させる
  s.onload = () => { meaxSdkLoading = false; };
  s.onerror = () => { meaxSdkLoading = false; };
  document.head.appendChild(s);
}
function injectMeax(root) {
  // 広告なしモード中は広告枠ごと挿入しない（空きスペースも残さない）
  if (document.documentElement.dataset.adfree === '1') return;
  const slots = $$('.ad-meax-slot', root);
  if (!slots.length) return;
  slots.forEach((slot) => {
    const wrap = document.createElement('div');
    wrap.className = 'ad-in-article ad-meax';
    const ad = document.createElement('div');
    ad.className = 'meax-ad';
    ad.setAttribute('data-meax-app', MEAX_APP);
    ad.setAttribute('data-meax-unit', MEAX_UNIT);
    ad.setAttribute('data-meax-size', 'article');
    ad.setAttribute('data-meax-layout', 'card');
    wrap.appendChild(ad);
    slot.replaceWith(wrap);
  });
  loadMeaxSdk();
}
function linkCard(url) {
  // url is already HTML-escaped here (renderContent escapes the whole text),
  // so insert it directly into attributes/display to avoid double-escaping.
  const clean = url.replace(/[.,;:!?。、）)]+$/, '');
  return `<div class="link-card" data-ogp-url="${clean}">
    <a href="${safeUrl(clean)}" target="_blank" rel="noopener noreferrer">
      <span class="link-card-thumb"></span>
      <span class="link-card-body">
        <span class="link-card-host">${hostName(clean)}</span>
        <span class="link-card-title">${clean}</span>
        <span class="link-card-desc">${esc(t('article.linkLoading'))}</span>
      </span>
    </a>
  </div>`;
}
async function hydrateLinkCards(root) {
  const cards = Array.from((root || document).querySelectorAll('.link-card[data-ogp-url]'));
  for (const card of cards) {
    const url = card.getAttribute('data-ogp-url');
    if (!url) continue;
    try {
      const res = await api.get('/api/ogp?url=' + encodeURIComponent(url));
      const img = res.image && safeUrl(res.image) ? res.image : '';
      card.querySelector('.link-card-title').textContent = res.title || url;
      card.querySelector('.link-card-desc').textContent = res.description || '';
      if (img) {
        const cssSafe = img.replace(/["\\()]/g, ''); // CSS url() context — strip dangerous chars
        card.querySelector('.link-card-thumb').style.backgroundImage = 'url("' + cssSafe + '")';
        card.classList.add('has-img');
      }
      card.querySelector('a').href = safeUrl(url);
    } catch (_) {
      card.querySelector('.link-card-desc').textContent = '';
    }
  }
}
function hostName(u) {

function setDocMeta(title, desc, image, canonicalPath) {
  document.title = title;
  // OGP は property=、twitter は name= で読まれる（取り違えるとカードが出ない）
  const setMeta = (key, content) => {
    const attr = key.startsWith('og:') ? 'property' : 'name';
    let el = document.querySelector('meta[' + attr + '="' + key + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute('content', content || '');
  };
  setMeta('description', desc || '');
  setMeta('og:title', title);
  setMeta('og:description', desc || '');
  setMeta('og:type', canonicalPath && canonicalPath.startsWith('/article/') ? 'article' : 'website');
  const img = thumbSrc(image);
  // 記事画像が無い / data URI のときは共通の OGP 画像を使う
  const ogImg = /^https?:/i.test(img) ? absUrl(img) : SITE_OG_IMAGE;
  setMeta('og:image', ogImg);
  if (ogImg === SITE_OG_IMAGE) {
    setMeta('og:image:width', '1200');
    setMeta('og:image:height', '630');
  }
  setMeta('og:image:alt', title);
  setMeta('twitter:image', ogImg);
  setMeta('twitter:title', title);
  setMeta('twitter:description', desc || '');
  if (location.protocol !== 'file:') {
    const url = absUrl(canonicalPath || '/');
    let link = document.querySelector('link[rel="canonical"]');
    if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
    link.href = url;
    setMeta('og:url', url);
  }
}

/* Auto-translate the article body when the UI language is English. */
async function maybeTranslateArticle(app, a) {
  if (state.lang !== 'en' || !a || !a.content) return;
  const key = 'infold_tr_' + a.id + '_en';
  const cached = sessionStorage.getItem(key);
  let translated = cached;
  if (!translated) {
    const prose = $('.prose', app);
    if (!prose) return;
    const original = prose.innerHTML;
    prose.innerHTML = '<p style="opacity:.6">Translating…</p>';
    try {
      const res = await api.post('/api/translate', { text: a.content, target: 'en' });
      translated = res && res.translated ? res.translated : null;
      if (translated) sessionStorage.setItem(key, translated);
    } catch (_) {
      translated = null;
    }
    if (!translated) { prose.innerHTML = original; return; }
  }
  const prose = $('.prose', app);
  if (prose) prose.innerHTML = renderContent(translated);
  // Re-hydrate any OGP link cards created by the translated text.
  hydrateLinkCards(app);
  injectMeax(app);
  // Keep the original Japanese reachable via a small toggle (per article view).
  const head = $('.article-head', app);
  if (head && !head.querySelector('.tr-toggle')) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-ghost btn-sm tr-toggle';
    btn.style.marginTop = '14px';
    btn.textContent = '日本語の原文を表示';
    btn.onclick = () => {
      const p = $('.prose', app);
      if (p) p.innerHTML = renderContent(a.content);
      injectMeax(p);
      btn.remove();
    };
    head.appendChild(btn);
  }
}

/* ---------------- notifications ----------------
   Web 版に存在する範囲だけを正直に表示する:
   - ブラウザ通知権限の取得と端末内通知（Notification API）
   - 新着記事（通知の対象になる最新記事）
   - この端末で表示した通知の履歴（localStorage）
   サーバー主導のプッシュ配信は既存の Android アプリ（FCM）が担う。*/
const NOTIFY_LOG_KEY = 'infold_notify_log';
function notifySupported() { return typeof Notification !== 'undefined'; }
function notifyPermission() {
  if (!notifySupported()) return 'unsupported';
  return Notification.permission;
}
function notifyPermissionLabel(perm) {
  if (perm === 'granted') return t('notifications.granted');
  if (perm === 'denied') return t('notifications.denied');
  if (perm === 'unsupported') return t('notifications.unsupported');
  return t('notifications.default');
}
function readNotifyLog() {
  try {
    const raw = localStorage.getItem(NOTIFY_LOG_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.slice(0, 20) : [];
  } catch (_) { return []; }
}
function writeNotifyLog(entry) {
  try {
    const arr = readNotifyLog();
    arr.unshift(entry);
    localStorage.setItem(NOTIFY_LOG_KEY, JSON.stringify(arr.slice(0, 20)));
  } catch (_) { /* storage unavailable: skip silently */ }
}
function showLocalNotification(title, body, url) {
  if (notifyPermission() !== 'granted') return false;
  try {
    const n = new Notification(title, { body: body || '', icon: '/icons/icon-192.png', tag: 'infold-' + Date.now() });
    n.onclick = () => { try { window.focus(); } catch (_) {} if (url) navigate(url); n.close(); };
    writeNotifyLog({ title: title, body: body || '', url: url || '/', at: new Date().toISOString() });
    return true;
  } catch (_) { return false; }
}
function noticeListItems(rows, withSource) {
  return rows.map((a) => {
    const url = a.url || ('/article/' + a.id);
    const when = fmtDate(a.at || a.published_at || a.created_at, true);
    const src = withSource && a.source_name ? ' · ' + a.source_name : '';
    return '<li><a data-nav="' + esc(url) + '">' + esc(a.title || '') + '</a><time>' + esc(when + src) + '</time></li>';
  }).join('');
}

let adFreeTimer = null;
function setAdFree(active) {
  state.adFree = !!active;
  if (active) document.documentElement.setAttribute('data-adfree', '1');
  else document.documentElement.removeAttribute('data-adfree');
}
async function refreshAdFree() {
  if (!state.reader) { setAdFree(false); return; }
  try {
    const res = await api.get('/api/points/ad-free');
    setAdFree(!!(res && res.active));
    if (res && res.active && res.expiresAt) scheduleAdFreeRefresh(res.expiresAt);
  } catch (_) { setAdFree(false); }
}
function scheduleAdFreeRefresh(expiresAt) {
  clearTimeout(adFreeTimer);
  const wait = new Date(expiresAt).getTime() - Date.now() + 1000;
  adFreeTimer = setTimeout(() => { refreshAdFree(); }, Math.max(0, Math.min(wait, 2147483647)));
}
async function refreshReaderState() {
  try {
    const res = await api.get('/api/auth/me');
    state.reader = res.user || null;
  } catch (_) {
    state.reader = null;
  }
  await refreshAdFree();
  renderHeader(); renderFooter();
}
function fmtRemaining(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return t('points.remainingFmt', { h, m });
}

async function useAdFreePlan(planPoints, currentBalance) {
  const durKey = { 10: 'points.dur6h', 30: 'points.dur24h', 70: 'points.dur7d' }[planPoints];
  if (!durKey) return;
  const ok = await confirmDialog({
    title: t('points.confirmTitle', { duration: t(durKey) }),
    message: t('points.confirmPoints', { points: Number(planPoints).toLocaleString() }) + '\n' + t('points.confirmBalance', { points: Number(currentBalance).toLocaleString() }),
    confirmText: t('points.confirmOk'),
    danger: false,
  });
  if (!ok) return;
  try {
    const res = await api.post('/api/points/ad-free', { plan: planPoints });
    toast(t('points.used'), 'success');
    setAdFree(true);
    if (res.expiresAt) scheduleAdFreeRefresh(res.expiresAt);
    renderPoints($('#app'));
  } catch (err) {
    if (err.status === 409 || (err.data && err.data.error === 'insufficient_points')) toast(t('points.insufficient'), 'error');
    else toast(t('toast.error'), 'error');
  }
}

/* 記事読了 +1 POINT 通知（控えめな表示） */
let readNoticeTimer = null;
function showReadNotice(earned, nextAt) {
  let el = $('#read-notice');
  if (!el) { el = document.createElement('div'); el.id = 'read-notice'; el.className = 'read-notice'; document.body.appendChild(el); }
  let msg;
  if (earned) {
    msg = '<span>✓</span><span>' + esc(t('points.readToast')) + '</span><span class="rn-plus">+1 POINT</span>';
  } else if (nextAt) {
    const h = Math.max(1, Math.ceil((new Date(nextAt).getTime() - Date.now()) / 3600000));
    msg = '<span>🕒</span><span>' + esc(t('points.reclaimIn', { time: h })) + '</span>';
  } else {
    msg = '<span>🕒</span><span>' + esc(t('points.alreadyEarned')) + '</span>';
  }
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(readNoticeTimer);
  readNoticeTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

/* 記事読了検知: 30秒経過 + 本文80%スクロール → サーバーに読了を報告 */
const reading = { articleId: null, startedAt: 0, submitted: false };
function startReadingTracking(id) {
  reading.articleId = id;
  reading.startedAt = Date.now();
  reading.submitted = false;
}
function checkReading() {
  if (!reading.articleId || reading.submitted || !state.reader) return;
  if (Date.now() - reading.startedAt < 30000) return;
  const prose = $('.prose');
  if (!prose || !document.body.contains(prose)) return;
  const rect = prose.getBoundingClientRect();
  const readPx = window.scrollY + window.innerHeight - rect.top;
  if (readPx / Math.max(1, rect.height) < 0.8) return;
  reading.submitted = true;
  api.post('/api/articles/' + reading.articleId + '/complete')
    .then((res) => {
      if (res && res.awarded) showReadNotice(true);
      else if (res && res.nextAvailableAt) showReadNotice(false, res.nextAvailableAt);
      else reading.submitted = false;
    })
    .catch(() => { reading.submitted = false; });
}
setInterval(checkReading, 1000);

function bindArticleForm(id, isEdit) {
  const form = $('#article-form');
  // upload
  const zone = $('#drop-zone');
  const fileInput = $('#thumb-file');
  const thumbInput = form.querySelector('input[name=thumbnail]');
  const thumbBox = $('#thumb-box');
  const setThumb = (url) => {
    thumbInput.value = url;
    thumbBox.innerHTML = url ? '<img src="' + esc(url) + '" alt="" onerror="this.classList.add(\'img-fail\')">' : '<div class="thumb-ph">INFOLD</div>';
  };
  zone.addEventListener('click', () => fileInput.click());
  zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('drag'); if (e.dataTransfer.files.length) uploadThumb(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadThumb(fileInput.files[0]); fileInput.value = ''; });
  thumbInput.addEventListener('input', () => {
    thumbBox.innerHTML = thumbInput.value ? '<img src="' + esc(thumbInput.value) + '" alt="" onerror="this.classList.add(\'img-fail\')">' : '<div class="thumb-ph">INFOLD</div>';
  });
  async function uploadThumb(file) {
    if (!file.type.startsWith('image/')) { toast(t('toast.uploadFailed'), 'error'); return; }
    if (file.size > 5 * 1024 * 1024) { toast(t('toast.uploadFailed') + ' (5MB)', 'error'); return; }
    zone.textContent = t('admin.articleForm.uploading') + '…';
    try {
      const res = await api.upload(file);
      setThumb(res.url);
      toast(t('toast.uploaded'), 'success');
    } catch (err) {
      toast(t('toast.uploadFailed'), 'error');
    } finally {
      zone.textContent = t('admin.articleForm.dragDrop');
    }
  }
  // submit
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = {
      title: String(fd.get('title') || '').trim(),
      description: String(fd.get('description') || '').trim(),
      content: String(fd.get('content') || ''),
      category: String(fd.get('category') || 'other'),
      status: fd.get('status') === 'published' ? 'published' : 'draft',
      featured: fd.get('featured') === 'on',
      thumbnail: String(fd.get('thumbnail') || '').trim(),
      publishedAt: String(fd.get('publishedAt') || '') ? new Date(String(fd.get('publishedAt'))).toISOString() : null,
      sourceUrl: String(fd.get('sourceUrl') || '').trim() || null,
      sourceName: String(fd.get('sourceName') || '').trim() || null,
    };
    if (!payload.title) { toast(t('toast.required'), 'warn'); form.querySelector('input[name=title]').focus(); return; }
    const btn = $('#article-submit');
    btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = '<span class="spin"></span>' + esc(isEdit ? t('admin.articleForm.update') : t('admin.articleForm.create'));
    try {
      if (isEdit) await api.put('/api/admin/articles/' + id, payload);
      else await api.post('/api/admin/articles', payload);
      toast(t('toast.saved'), 'success');
      navigate('/admin/articles');
    } catch (err) {
      btn.disabled = false; btn.classList.remove('loading');
      btn.innerHTML = esc(isEdit ? t('admin.articleForm.update') : t('admin.articleForm.create'));
      toast(err.isNetwork ? t('toast.network') : (err.data && err.data.error === 'title_required' ? t('err.titleRequired') : t('toast.error')), 'error');
    }
  });
}

function aiStatusChip(status) {
  const map = {
    draft: ['draft', 'admin.status.draft'],
    published: ['published', 'admin.status.published'],
    failed: ['failed', 'admin.status.failed'],
    needs_review: ['retrying', 'admin.aiReview'],
  };
  const entry = map[status] || ['pending', 'admin.status.pending'];
  return '<span class="status-chip status-' + entry[0] + '"><span class="sdot"></span>' + esc(t(entry[1])) + '</span>';
}
function aiErrorText(err) {
  const code = (err && err.data && err.data.error) || '';
  const detail = (err && err.data && err.data.message) || '';
  if (err && err.isNetwork) return t('toast.network');
  if (code === 'rate_limited') return t('admin.aiRateLimited');
  if (code === 'daily_limit_reached') return t('admin.aiDailyReached');
  if (code === 'not_configured') return t('admin.aiNotConfiguredMsg');
  if (code === 'needs_review') return t('admin.aiNeedsReview');
  if (code === 'free_model_required' || code === 'not_free_model') return t('admin.aiFreeOnly');
  if (code === 'model_unavailable') return t('admin.aiTestFail') + (detail ? ' — ' + detail : '');
  return detail || t('toast.error');
}

  };
  const loadHistory = async () => {

  async function runGenerate(newsItemId, force, btn) {
    const publishEl = $('#ai-auto-publish');
    const autoPublish = !!(publishEl && publishEl.checked);
    if (force) {
      const ok = await confirmDialog({ title: t('admin.aiRegenerate'), message: t('admin.aiConfirmRegenerate'), confirmText: t('admin.aiRegenerate'), danger: false });
      if (!ok) return;
    }
    const original = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = t('admin.aiGenerating'); }
    try {
      const res = await api.post('/api/admin/ai/generate', { newsItemId: newsItemId, force: force, autoPublish: autoPublish });
      toast(t('admin.aiGenerated') + (res && res.status === 'published' ? ' · ' + t('admin.aiPublished') : ''), 'success');
      if (res && res.editorialNotes) toast(t('admin.aiNeedsReview'), 'warn');
      await loadStatus();
      await loadNews();
      await loadHistory();
    } catch (err) {
      toast(aiErrorText(err), err && err.data && err.data.error === 'needs_review' ? 'warn' : 'error');
      loadStatus().catch(() => {});
      loadNews().catch(() => {});
      loadHistory().catch(() => {});

      if (btn) { btn.disabled = false; btn.textContent = original; }

  $('#ai-save').onclick = async () => {

    const model = $('#ai-model').value.trim();
    btn.disabled = true;
    box.style.display = '';
    box.className = 'ai-test-result';
    box.textContent = t('common.loading');
    try {
      const res = await api.post('/api/admin/ai/test', model ? { model: model } : {});
      if (res && res.ok) {
        box.className = 'ai-test-result ok';
        box.textContent = t('admin.aiTestOk') + ' — ' + (res.model || '') + (res.warning ? ' (' + t('admin.aiRateLimited') + ')' : '');
      } else {
        box.className = 'ai-test-result err';
        box.textContent = t('admin.aiTestFail') + (res && res.message ? ' — ' + res.message : '');
      }
    } catch (err) {
      box.className = 'ai-test-result err';
      box.textContent = aiErrorText(err);
    } finally { btn.disabled = false; }
  };

  $('#ai-refresh-news').onclick = async () => {
    const btn = $('#ai-refresh-news');
    btn.disabled = true;
    try {
      const list = await loadNews(true);
      toast(t('admin.aiNews') + ': ' + list.length, 'success');
    } catch (err) {
      toast(aiErrorText(err), 'error');

/* ---------------- device detection ----------------
   Classify the device (phone / tablet / desktop) from the user agent and
   the actual viewport width, then expose it as data attributes so CSS can
   deliver width-appropriate sizing on every model. */
function detectDevice() {
  const d = document.documentElement;
  const w = innerWidth;
  const ua = navigator.userAgent;
  const isPhoneUA = /iPhone|Android.*Mobile|Windows Phone|Mobile\b|webOS|IEMobile/i.test(ua);
  const isTabletUA = /iPad|Android(?!.*Mobile)|Tablet/i.test(ua) || (isPhoneUA && w >= 700);
  let device = 'desktop';
  if (w <= 480 || (isPhoneUA && w <= 920)) device = 'phone';
  else if (w <= 920 || isTabletUA) device = 'tablet';
  d.dataset.device = device;
}
detectDevice();
window.addEventListener('resize', () => { detectDevice(); });
window.addEventListener('orientationchange', () => setTimeout(detectDevice, 200));

/* ============================================================
   AIChat (WebLLM) — ブラウザ内で動くAIチャット
   ============================================================ */
const AICHAT_CDN = 'https://esm.run/@mlc-ai/web-llm@0.2.84';
const AICHAT_DL_KEY = 'infold_aichat_ready';
const AICHAT_MODELS = {
  '1.5b': { id: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', label: '標準版 1.5B' },
  '0.5b': { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: '軽量版 0.5B' },
};
const AICHAT_DEFAULT_MODEL = '1.5b';
const aichat = {
  webllm: null,
  engine: null,
  modelKey: AICHAT_DEFAULT_MODEL,
  ready: false,
  busy: false,
  loading: false,
  msgs: [{ role: 'system', content: 'あなたはニュースメディア「INFOLD」のAIアシスタント「AIChat」です。質問には日本語で簡潔かつ丁寧に答えてください。' }],
};
function aichatUI() {
  return {
    root: $('#aichat-root'), fab: $('#aichat-fab'), close: $('#aichat-close'),
    msgs: $('#aichat-msgs'), dl: $('#aichat-dl'),
    status: $('#aichat-status'), progWrap: $('#aichat-progress'), progBar: $('#aichat-progress-bar'),
    form: $('#aichat-form'), input: $('#aichat-input'), send: $('#aichat-send'),
    dlYes: $('#aichat-dl-yes'), dlNo: $('#aichat-dl-no'),

function aichatStatus(label, pct) {
  const ui = aichatUI();
  if (label) {
    ui.status.textContent = label;
    ui.status.classList.toggle('is-ready', /完了|準備完了/.test(label));
  }
  if (pct == null) ui.progWrap.style.display = 'none';
  else { ui.progWrap.style.display = 'block'; ui.progBar.style.width = Math.max(2, Math.min(100, pct)) + '%'; }
}
/* 軽量マークダウン風レンダリング（モデル出力を安全に表示） */
function chatMd(text) {
  let s = esc(text || '');
  s = s.replace(/```([\s\S]*?)```/g, (m, code) => '<pre>' + esc(code).replace(/\n/g, '<br>') + '</pre>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const lines = s.split('\n');
  let out = '', inList = false;
  for (const ln of lines) {
    const t = ln.trim();
    if (!t) continue;
    if (/^[-*•]\s+/.test(t)) {
      if (!inList) { out += '<ul>'; inList = true; }
      out += '<li>' + t.replace(/^[-*•]\s+/, '') + '</li>';
      continue;
    }
    if (inList) { out += '</ul>'; inList = false; }
    out += (out ? '<br>' : '') + ln;
  }
  if (inList) out += '</ul>';
  return out;
}
function aichatAppend(role, html) {
  const ui = aichatUI();
  const wrap = document.createElement('div');
  wrap.className = 'aichat-msg ' + (role === 'user' ? 'is-user' : 'is-ai');
  const bub = document.createElement('div');
  bub.className = 'aichat-bubble';
  bub.innerHTML = html;
  wrap.appendChild(bub);
  ui.msgs.appendChild(wrap);
  ui.msgs.scrollTop = ui.msgs.scrollHeight;
  return bub;
}
function aichatTyping(on) {
  const ui = aichatUI();
  let el = ui.msgs.querySelector('.aichat-typing');
  if (on && !el) {
    el = document.createElement('div');
    el.className = 'aichat-msg is-ai aichat-typing';
    el.innerHTML = '<div class="aichat-bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    ui.msgs.appendChild(el);
    ui.msgs.scrollTop = ui.msgs.scrollHeight;
  } else if (!on && el) el.remove();
}
function aichatSetInput(dis) {
  const ui = aichatUI();
  ui.input.disabled = dis;
  ui.send.disabled = dis;
}
function aichatOpen() {
  const ui = aichatUI();
  if (ui.root.classList.contains('open')) return;
  ui.root.classList.add('open');
  ui.root.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  if (!ui.msgs.children.length) aichatAppend('ai', chatMd('こんにちは！AIChatです 🤖\nテクノロジーやニュースのこと、その他なんでも気軽に質問してください。'));
  if (!aichat.ready && !aichat.engine) {
    // どれかのモデルをダウンロード済みなら直接読み込み、未ダウンロードなら確認を表示
    const saved = Object.keys(AICHAT_MODELS).find((k) => localStorage.getItem(AICHAT_DL_KEY + '_' + k) === '1');
    if (saved) aichatLoadModel(AICHAT_MODELS[saved].id);
    else ui.dl.classList.add('show');
  } else if (aichat.ready) {
    aichatStatus('準備完了 ✓（' + AICHAT_MODELS[aichat.modelKey].label + '）');
    aichatSetInput(false);
  }
}
function aichatClose() {
  const ui = aichatUI();
  if (!ui.root.classList.contains('open')) return;
  ui.root.classList.remove('open');
  ui.root.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
async function aichatLoadModel(modelId) {
  const ui = aichatUI();
  ui.dl.classList.remove('show');
  if (aichat.loading) return;
  if (!navigator.gpu) {
    aichatStatus('WebGPU非対応のブラウザです');
    aichatAppend('ai', chatMd('お使いのブラウザは **WebGPU** に対応していないため、ブラウザ内AIを利用できません。\n最新の **Google Chrome**（PC / Android）や **Safari** などWebGPU対応ブラウザをご利用ください。'));
    return;
  }
  aichat.loading = true;
  aichatStatus('モデルを準備中…', 2);
  aichatSetInput(true);
  ui.modelSel.disabled = true;
  try {
    const webllm = aichat.webllm || (aichat.webllm = await import(AICHAT_CDN));
    if (!aichat.engine) {
      aichat.engine = new webllm.MLCEngine({
        useWebWorker: false,
        initProgressCallback: (p) => {
          const frac = (p && typeof p.progress === 'number') ? p.progress : 0;
          if (frac >= 1) aichatStatus('モデル読み込み完了', 100);
          else if (frac > 0) aichatStatus('モデルをダウンロード中 ' + Math.floor(frac * 100) + '%', Math.floor(frac * 100));
          else aichatStatus('モデルを準備中…', 2);
        },
      });
    }
    await aichat.engine.reload(modelId);
    aichat.modelKey = Object.keys(AICHAT_MODELS).find((k) => AICHAT_MODELS[k].id === modelId) || AICHAT_DEFAULT_MODEL;
    aichat.ready = true;
    try { localStorage.setItem(AICHAT_DL_KEY + '_' + aichat.modelKey, '1'); } catch (_) {}
    aichatStatus('準備完了 ✓（' + AICHAT_MODELS[aichat.modelKey].label + '）');
    aichatSetInput(false);
    ui.modelSel.value = aichat.modelKey;
    ui.modelSel.disabled = false;
    aichatAppend('ai', chatMd('✅ モデルの準備ができました！\n何でも質問してください。'));
  } catch (err) {
    console.error('AIChat load failed:', err);
    aichat.ready = false;
    aichatStatus('モデルの読み込みに失敗しました');
    aichatAppend('ai', chatMd('モデルの読み込みに失敗しました。\n通信環境を確認してもう一度お試しください（ダウンロードは再開できます）。'));
    aichatSetInput(true);
    ui.modelSel.disabled = false;
  }
  aichat.loading = false;
}
async function aichatSend(raw) {
  const text = (raw || '').trim();
  if (!text || aichat.busy || aichat.loading || !aichat.ready || !aichat.engine) return;
  aichat.busy = true;
  aichatSetInput(true);
  aichatAppend('user', chatMd(text));
  aichat.msgs.push({ role: 'user', content: text });
  aichatTyping(true);
  let bub = null;
  try {
    const chunks = await aichat.engine.chat.completions.create({
      messages: aichat.msgs,
      temperature: 0.7,
      stream: true,
    });
    let reply = '';
    for await (const chunk of chunks) {
      const delta = chunk.choices && chunk.choices[0] ? chunk.choices[0].delta : null;
      if (delta && delta.content) reply += delta.content;
      if (!bub) { aichatTyping(false); bub = aichatAppend('ai', ''); }
      bub.innerHTML = chatMd(reply);
      aichatUI().msgs.scrollTop = aichatUI().msgs.scrollHeight;
    }
    if (!bub) { aichatTyping(false); bub = aichatAppend('ai', chatMd('（返信がありませんでした）')); }
    aichat.msgs.push({ role: 'assistant', content: reply });
    if (aichat.msgs.length > 30) aichat.msgs.splice(1, aichat.msgs.length - 30); // 会話履歴を直近に制限
  } catch (err) {
    console.error('AIChat send failed:', err);
    aichatTyping(false);
    if (!bub) bub = aichatAppend('ai', '');
    bub.innerHTML = chatMd('エラーが発生しました。もう一度お試しください。');
  }
  aichat.busy = false;
  aichatSetInput(!aichat.ready);
}
function initAIChat() {
  const ui = aichatUI();
  ui.fab.addEventListener('click', () => {
    if (ui.root.classList.contains('open')) aichatClose();
    else aichatOpen();
  });
  ui.close.addEventListener('click', aichatClose);
  ui.root.querySelector('.aichat-backdrop').addEventListener('click', aichatClose);
  ui.dlYes.addEventListener('click', () => {
    const checked = ui.root.querySelector('#aichat-model-pills input:checked');
    if (checked) aichat.modelKey = checked.value;
    aichatLoadModel(AICHAT_MODELS[aichat.modelKey].id);
  });
  ui.dlNo.addEventListener('click', () => {
    ui.dl.classList.remove('show');
    aichatStatus('モデル未ダウンロード');
  });
  // モデル切替（読み込み後・ヘッダーのセレクト）
  ui.modelSel.addEventListener('change', () => {
    if (aichat.loading || ui.modelSel.value === aichat.modelKey) return;
    aichatAppend('ai', chatMd('モデルを **' + AICHAT_MODELS[ui.modelSel.value].label + '** に切り替えています…'));
    aichatLoadModel(AICHAT_MODELS[ui.modelSel.value].id);
  });
  ui.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = ui.input.value;
    ui.input.value = '';
    ui.input.style.height = 'auto';
    aichatSend(v);
  });
  ui.input.addEventListener('input', () => {
    ui.input.style.height = 'auto';
    ui.input.style.height = Math.min(ui.input.scrollHeight, 140) + 'px';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ui.root.classList.contains('open')) aichatClose();
  });
}
initAIChat();
