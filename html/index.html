<style>
/* ============================================================
   INFOLD — design system (light / dark)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
html[data-theme="light"] { color-scheme: light; }
html[data-theme="dark"]  { color-scheme: dark; }

:root {
  --font: "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, -apple-system, sans-serif;
  --serif: Georgia, "Hiragino Mincho ProN", "Noto Serif JP", serif;
  --mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
  --maxw: 1320px;
  --gutter: clamp(24px, 3.5vw, 40px); /* fluid side gutter: fits every screen width */
  --content-maxw: calc(var(--maxw) - 2 * var(--gutter)); /* = header content width: logo-left edge to lock-icon right edge */
  --header-h: 64px;
  --radius: 16px;
  --radius-sm: 11px;
  --transition: .25s cubic-bezier(.22,.68,0,1);
  /* shared neon accents (used by both themes) */
  --neon-cyan: #00e0ff;
  --neon-violet: #8b5cff;
  --neon-pink: #ff3d9a;
  --neon-green: #3dffb8;
}

html[data-theme="light"] {
  --bg: #f4f8ff;
  --bg-soft: #e9f0fd;
  --card: rgba(255, 255, 255, .6);
  --card-hover: rgba(255, 255, 255, .78);
  --text: #101828;
  --muted: #56648a;
  --faint: #8b97b8;
  --border: #dbe6f7;
  --primary: #0d8bff;
  --primary-2: #6a4dff;
  --primary-soft: rgba(13, 139, 255, .10);
  --on-primary: #ffffff;
  --accent: #ff3d9a;
  --accent-soft: rgba(255, 61, 154, .10);
  --ok: #0a9e6d;
  --ok-soft: rgba(10, 158, 109, .10);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, .12);
  --danger: #e11d48;
  --danger-soft: rgba(225, 29, 72, .09);
  --header-bg: rgba(244, 248, 255, .78);
  --footer-bg: #070b1a;
  --footer-text: #aeb6d4;
  --shadow: 0 6px 22px rgba(16, 24, 40, .08);
  --shadow-lg: 0 24px 60px rgba(16, 24, 40, .16);
  --glow: 0 0 0 1px rgba(13, 139, 255, .18), 0 8px 30px rgba(13, 139, 255, .14);
  --hero-grad: linear-gradient(135deg, #0d8bff 0%, #6a4dff 55%, #a03bff 100%);
  --skeleton-from: rgba(16, 24, 40, .05);
  --skeleton-to: rgba(16, 24, 40, .10);
  --glass: rgba(255, 255, 255, .55);
  --glass-border: rgba(16, 24, 40, .1);
  --glass-hi: rgba(255, 255, 255, .42);
}

html[data-theme="dark"] {
  --bg: #05070f;
  --bg-soft: #0c1122;
  --card: rgba(14, 20, 38, .5);
  --card-hover: rgba(21, 30, 56, .72);
  --text: #e6ecff;
  --muted: #9aa7cf;
  --faint: #6a77a3;
  --border: rgba(120, 150, 255, .14);
  --primary: #00c8ff;
  --primary-2: #8b5cff;
  --primary-soft: rgba(0, 200, 255, .14);
  --on-primary: #03101c;
  --accent: #ff3d9a;
  --accent-soft: rgba(255, 61, 154, .13);
  --ok: #3dffb8;
  --ok-soft: rgba(61, 255, 184, .12);
  --warn: #ffc94d;
  --warn-soft: rgba(255, 201, 77, .12);
  --danger: #ff5c7a;
  --danger-soft: rgba(255, 92, 122, .12);
  --header-bg: rgba(5, 7, 15, .68);
  --footer-bg: #04060d;
  --footer-text: #8f9bc4;
  --shadow: 0 10px 34px rgba(0, 0, 0, .5);
  --shadow-lg: 0 28px 80px rgba(0, 0, 0, .65);
  --glow: 0 0 0 1px rgba(0, 200, 255, .25), 0 0 24px rgba(0, 200, 255, .18), 0 10px 40px rgba(139, 92, 255, .12);
  --hero-grad: linear-gradient(135deg, #0aa8e8 0%, #6a4dff 55%, #c026d3 100%);
  --skeleton-from: rgba(230, 236, 255, .05);
  --skeleton-to: rgba(230, 236, 255, .11);
  --glass: rgba(10, 15, 30, .5);
  --glass-border: rgba(255, 255, 255, .12);
  --glass-hi: rgba(255, 255, 255, .09);
}

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 15.5px;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image:
    radial-gradient(1100px 520px at 12% -8%, var(--primary-soft), transparent 60%),
    radial-gradient(900px 480px at 108% 12%, var(--accent-soft), transparent 55%),
    radial-gradient(700px 500px at 50% 120%, rgba(139, 92, 255, .07), transparent 60%);
  background-attachment: fixed;
}
a { color: var(--primary); text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 14.5px; color: var(--text); }
::selection { background: var(--primary); color: var(--on-primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }
::-webkit-scrollbar-track { background: transparent; }

.container { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: 0 0 10px 0; font-weight: 600;
}
.skip-link:focus { left: 0; }

/* ============ header ============ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-hi);
}
.site-header::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
  opacity: .7; pointer-events: none;
}
.header-inner { display: flex; align-items: center; gap: 18px; height: var(--header-h); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); flex-shrink: 0; }
.brand svg { display: block; filter: drop-shadow(0 0 8px var(--primary-soft)); }
.brand-name {
  font-size: 20px; font-weight: 800; letter-spacing: .16em; color: var(--text);
  background: linear-gradient(90deg, var(--text), var(--primary));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  transition: opacity var(--transition);
}
.main-nav { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
.nav-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 10px;
  color: var(--muted); font-weight: 600; font-size: 14.5px;
  border: none; background: none;
  transition: background var(--transition), color var(--transition), box-shadow var(--transition);
}
.nav-link:hover { background: var(--primary-soft); color: var(--primary); box-shadow: inset 0 -2px 0 var(--primary); }
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 11px;
  border: 1px solid var(--glass-border); background: var(--card);
  color: var(--text); font-size: 17px;
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  transition: transform var(--transition), background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
}
.icon-btn:hover { transform: translateY(-1px); border-color: var(--primary); color: var(--primary); box-shadow: var(--glow); }
.icon-btn:active { transform: scale(.94); }
.lang-switch {
  display: inline-flex; align-items: center; gap: 2px;
  border: 1px solid var(--glass-border); border-radius: 11px; padding: 3px; background: var(--card);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
}
.lang-switch button {
  border: none; background: none; color: var(--muted);
  font-size: 12.5px; font-weight: 700; padding: 5px 9px; border-radius: 8px;
  transition: background var(--transition), color var(--transition);
}
.lang-switch button.active { background: var(--primary); color: var(--on-primary); }
.lang-switch .sep { color: var(--faint); font-size: 12px; }
.hamburger { display: none; }

.search-bar {
  display: none; padding: 12px 0 16px; border-top: 1px solid var(--border);
}
.search-bar.open { display: block; animation: fadeDown .25s ease; }
.search-form { display: flex; gap: 10px; }
.search-input {
  flex: 1; padding: 11px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

/* dropdown (categories) */
.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; top: calc(100% + 8px); left: 0; min-width: 220px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-lg); padding: 8px; opacity: 0; visibility: hidden;
  transform: translateY(-6px); transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
  z-index: 120;
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
}
.dropdown.open .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
.dropdown-menu a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 12px; border-radius: 9px; color: var(--text); font-size: 14px; font-weight: 600;
  transition: background var(--transition), color var(--transition);
}
.dropdown-menu a:hover { background: var(--primary-soft); color: var(--primary); }
.dropdown-menu a .cnt { color: var(--faint); font-size: 12px; font-weight: 500; }

/* mobile menu */
.mobile-menu {
  display: none; border-top: 1px solid var(--glass-border); background: var(--header-bg);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  padding: 12px 22px 20px;
}
.mobile-menu.open { display: block; animation: fadeDown .25s ease; }
.mobile-menu .nav-link { width: 100%; justify-content: flex-start; padding: 12px 14px; font-size: 15px; }
.mobile-menu .mm-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mm-search { display: flex; gap: 8px; margin-bottom: 4px; }
.mm-search .search-input { flex: 1; }

/* offline banner */
.offline-banner {
  display: none; align-items: center; gap: 10px;
  background: var(--warn-soft); color: var(--warn);
  border-bottom: 1px solid var(--border);
  padding: 10px 22px; font-size: 13.5px; font-weight: 600;
}
.offline-banner.show { display: flex; }
.offline-banner .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; flex-shrink: 0; }

/* ============ buttons / badges ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 700; font-size: 14.5px; line-height: 1.3;
  transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition), color var(--transition);
  user-select: none;
}
.btn:active { transform: scale(.97); }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: var(--on-primary);
  box-shadow: 0 6px 18px var(--primary-soft), 0 0 0 1px rgba(255,255,255,.06) inset;
}
.btn-primary:hover { box-shadow: 0 10px 30px var(--primary-soft), 0 0 20px var(--primary-soft); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
.btn-ghost:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); box-shadow: var(--glow); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { box-shadow: 0 8px 22px var(--danger-soft); transform: translateY(-1px); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; }
.btn .spin { display: none; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.btn.loading .spin { display: inline-block; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em;
  white-space: nowrap;
}
.badge-it { --c: #369ef6; --b: rgba(54, 158, 246, .13); }
.badge-ai { --c: #7c3aed; --b: rgba(124, 58, 237, .13); }
.badge-windows { --c: #0284c7; --b: rgba(2, 132, 199, .13); }
.badge-android { --c: #16a34a; --b: rgba(22, 163, 74, .13); }
.badge-apple { --c: #64748b; --b: rgba(100, 116, 139, .16); }
.badge-web { --c: #db2777; --b: rgba(219, 39, 119, .13); }
.badge-programming { --c: #ea580c; --b: rgba(234, 88, 12, .13); }
.badge-other { --c: #475569; --b: rgba(71, 85, 105, .16); }
.badge[class*="badge-"] { background: var(--b); color: var(--c); }
.badge-primary { background: var(--accent-soft); color: var(--accent); }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-neutral { background: var(--glass); color: var(--muted); }

/* liquid-glass badges: translucent pills with a soft glass edge
   (backdrop blur is smartphone-only — see the ≤768px block — to keep
   dozens of badges per page cheap on PC and low-end phones) */
.badge {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
  border: 1px solid var(--glass-border);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
}

/* ============ cards & grids ============ */
.article-card {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--card); border: 1px solid var(--glass-border); border-radius: 16px;
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 6px rgba(16, 24, 40, .05);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
  height: 100%;
}
.article-card:hover {
  transform: translateY(-5px); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glow); border-color: var(--primary);
  background: var(--card-hover);
}
.article-card::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 2px; border-radius: 16px 16px 0 0;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  opacity: 0; transition: opacity var(--transition); z-index: 2;
}
.article-card:hover::before { opacity: .8; }
.thumb {
  position: relative; aspect-ratio: 21 / 9; overflow: hidden; flex-shrink: 0;
  background: var(--hero-grad);
}
.thumb::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 40%);
  z-index: 1;
}
.thumb::after {
  content: 'INFOLD'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; letter-spacing: .4em; text-indent: .4em;
  color: rgba(255, 255, 255, .35); z-index: 2;
}
.thumb img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  transition: transform .5s cubic-bezier(.2,.7,.2,1);
  z-index: 3; /* sit above the INFOLDNEWS placeholder text */
}
.article-card:hover .thumb img { transform: scale(1.06); }
.thumb img.img-fail { opacity: 0; }
.card-body { display: flex; flex-direction: column; gap: 9px; padding: 16px 18px 18px; flex: 1; }
.card-title {
  margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.5; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  transition: color var(--transition);
}
.article-card:hover .card-title { color: var(--primary); }
.card-desc {
  margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.65;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; color: var(--faint); font-size: 12.5px; font-weight: 600; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }

.grid { display: grid; gap: 22px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.auto-grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.grid-2 > *:last-child:nth-child(odd) { grid-column: 1 / -1; }

/* section heading */
.section { margin-top: 46px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.section-title {
  display: inline-flex; align-items: center; gap: 12px;
  margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em;
}
.section-title::before {
  content: ''; width: 6px; height: 24px; border-radius: 3px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  box-shadow: 0 0 12px var(--primary-soft);
}
.view-all { font-size: 13.5px; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; transition: gap var(--transition); }
.view-all:hover { gap: 8px; }

/* ============ hero ============ */
.hero { margin-top: 26px; }
.hero-grid { display: grid; grid-template-columns: 1.75fr 1fr; gap: 22px; }
.hero-card {
  position: relative; display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 380px; border-radius: 22px; overflow: hidden;
  background: var(--hero-grad); border: 1px solid rgba(255,255,255,.1);
  color: #fff; text-decoration: none;
  box-shadow: 0 10px 40px var(--primary-soft);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}
.hero-card:hover { transform: translateY(-5px); box-shadow: var(--glow); border-color: var(--primary); }
.hero-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.14) 45%, transparent 60%);
  transform: translateX(-100%); transition: transform .8s ease;
}
.hero-card:hover::after { transform: translateX(100%); }
.hero-card .hero-bg {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}
.hero-card:hover .hero-bg { transform: scale(1.05); }
.hero-card .hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(5, 7, 15, 0) 20%, rgba(5, 7, 15, .9) 100%);
}
.hero-body { position: relative; padding: 30px 32px 28px; display: flex; flex-direction: column; gap: 12px; }
.hero-badges { display: flex; gap: 8px; align-items: center; }
.hero-badges .badge { background: rgba(255,255,255,.16); color: #fff; }
.hero-card h2 { margin: 0; font-size: clamp(24px, 3vw, 34px); line-height: 1.4; font-weight: 800; letter-spacing: -.01em; }
.hero-card p { margin: 0; font-size: 15px; line-height: 1.75; color: rgba(255,255,255,.82); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hero-meta { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 600; }
.hero-meta .dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.5); }

.hero-side { display: flex; flex-direction: column; gap: 14px; }
.hero-side-title { margin: 0 2px 2px; font-size: 15px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.mini-card {
  display: flex; gap: 14px; align-items: center;
  background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
  padding: 10px; transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
}
.mini-card:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glow); border-color: var(--primary); background: var(--card-hover); }
.mini-thumb { position: relative; width: 88px; height: 60px; border-radius: 9px; overflow: hidden; background: var(--hero-grad); flex-shrink: 0; }
.mini-thumb::after {
  content: 'INFOLD'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 800; letter-spacing: .25em; text-indent: .25em;
  color: rgba(255, 255, 255, .35); z-index: 2;
}
.mini-thumb img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 3; }
.mini-thumb img.img-fail { opacity: 0; }
.mini-body { min-width: 0; flex: 1; }
.mini-body h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 700; line-height: 1.5; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini-body time { font-size: 11.5px; color: var(--faint); font-weight: 600; }

/* category chips */
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  font-size: 13.5px; font-weight: 700;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
}
.chip:hover { transform: translateY(-2px); box-shadow: var(--glow); border-color: var(--primary); color: var(--primary); }
.chip .cnt { color: var(--faint); font-size: 12px; font-weight: 600; }
.chip.chip-active { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.chip.chip-active .cnt { color: inherit; opacity: .8; }

/* ============ page layout (articles / search) ============ */
.page { padding: 30px 0 60px; }
.page-head { margin-bottom: 26px; }
.page-title { margin: 0 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.page-sub { margin: 0; color: var(--muted); font-size: 14.5px; }
.filter-pills { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
.filter-pill {
  padding: 8px 15px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-size: 13px; font-weight: 700;
  transition: all var(--transition);
}
.filter-pill:hover { color: var(--primary); border-color: var(--primary); }
.filter-pill.active { background: var(--primary); color: var(--on-primary); border-color: transparent; }

/* load more */
.load-more-wrap { display: flex; justify-content: center; margin-top: 34px; }

/* ============ article detail ============ */
.article-page { padding: 30px 0 60px; }
.article-head { width: 100%; max-width: var(--content-maxw); margin: 30px auto 26px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 700; margin-bottom: 18px; transition: color var(--transition); }
.back-link:hover { color: var(--primary); }
.article-head .badges { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.article-head h1 { margin: 0 0 14px; font-size: clamp(24px, 3.4vw, 38px); line-height: 1.4; font-weight: 800; letter-spacing: -.015em; }
.article-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; color: var(--faint); font-size: 13.5px; font-weight: 600; }
.article-head .meta .sep { width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.article-hero {
  width: 100%; max-width: var(--content-maxw); margin: 0 auto 0; border-radius: 18px; overflow: hidden;
  border: 1px solid var(--glass-border); background: var(--hero-grad);
  aspect-ratio: 21 / 9; position: relative;
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 40px var(--primary-soft);
}
.article-hero::after {
  content: 'INFOLD'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; letter-spacing: .5em; text-indent: .5em;
  color: rgba(255, 255, 255, .4); z-index: 2;
}
.article-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 3; }
.article-hero img.img-fail { opacity: 0; }
.prose { width: 100%; max-width: var(--content-maxw); margin: 0 auto; font-size: 17px; line-height: 2.1; color: var(--text); }
.prose p { margin: 0 0 1.5em; }
.prose h2 { font-size: 24px; font-weight: 800; margin: 1.8em 0 .8em; letter-spacing: -.01em; line-height: 1.5; padding-bottom: .35em; border-bottom: 1px solid var(--border); }
.prose ul, .prose ol { margin: 0 0 1.5em; padding-left: 1.4em; }
.prose li { margin-bottom: .4em; }
.prose strong { font-weight: 700; }
.prose a {
  color: var(--primary); font-weight: 600; text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: var(--primary-soft);
  transition: color var(--transition), text-decoration-color var(--transition);
}
.prose a:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* in-article ad (忍者ADMAX) */
.admax-slot, .ad-in-article {
  display: flex; justify-content: center; align-items: center;
  margin: 2.4em 0; min-height: 60px; max-width: 100%; overflow: hidden;
}
/* 広告ブロッカーでADMAXが表示されないときのフォールバック広告
   (端末に応じて横幅を 320 / 468 / 728 に変更) */
.admax-fallback {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  width: 320px; max-width: 100%; height: 100px;
  padding: 10px 18px;
  background: linear-gradient(135deg, var(--primary-soft), var(--glass));
  border: 1px solid var(--glass-border); border-radius: 12px;
  color: var(--text); text-decoration: none; text-align: center;
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 8px rgba(16, 24, 40, .06);
  transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
}
html[data-device="tablet"] .admax-fallback { width: 468px; }
html[data-device="desktop"] .admax-fallback { width: 728px; }
.admax-fallback:hover { border-color: var(--primary); box-shadow: var(--glow); transform: translateY(-1px); }
.admax-fallback .af-title { font-size: clamp(14px, 2.4vw, 18px); font-weight: 800; letter-spacing: .01em; line-height: 1.35; }
.admax-fallback .af-desc { font-size: clamp(11px, 1.5vw, 13px); color: var(--muted); font-weight: 600; line-height: 1.45; }
.admax-fallback .af-cta { font-size: clamp(11px, 1.5vw, 13px); font-weight: 700; color: var(--primary); }

/* 広告なしモード（ポイント特典）: 広告・プロモーション枠を親コンテナごと非表示 */
html[data-adfree="1"] .admax-slot,
html[data-adfree="1"] .ad-in-article,
html[data-adfree="1"] .admax-fallback { display: none !important; }

/* ============ points / account (Liquid Glass) ============ */
.pts-wrap { width: 100%; max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; padding: 26px 0 60px; }
.pts-hero { position: relative; overflow: hidden; border-radius: 22px; padding: 30px 32px; background: linear-gradient(135deg, var(--primary-soft), var(--glass)); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.pts-hero::after { content: 'PT'; position: absolute; right: -18px; bottom: -34px; font-family: var(--mono); font-size: 120px; font-weight: 800; color: var(--primary); opacity: .08; pointer-events: none; }
.pts-balance-label { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.pts-balance { font-size: clamp(38px, 6vw, 54px); font-weight: 900; letter-spacing: -.02em; color: var(--text); line-height: 1.1; }
.pts-balance small { font-size: 16px; font-weight: 800; color: var(--primary); margin-left: 6px; }
.pts-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 13.5px; font-weight: 800; color: var(--muted); }
.pts-status .pts-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 800; }
.pts-chip.on { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(10, 158, 109, .25); }
.pts-chip.off { background: var(--glass); color: var(--faint); border: 1px solid var(--glass-border); }
.pts-remaining { font-size: 13px; font-weight: 700; color: var(--muted); }
.pts-card { background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 22px 24px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); }
.pts-card h2 { font-size: 17px; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.pts-card p { margin: 0 0 8px; font-size: 14px; color: var(--muted); line-height: 1.8; }
.pts-card p:last-child { margin-bottom: 0; }
.pts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 720px) { .pts-grid { grid-template-columns: 1fr; } }
.pts-plan { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition); }
.pts-plan:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glow); }
.pts-plan .pp-name { font-weight: 800; font-size: 14.5px; color: var(--text); }
.pts-plan .pp-points { font-size: clamp(24px, 4vw, 30px); font-weight: 900; letter-spacing: -.01em; color: var(--primary); }
.pts-plan .pp-points small { font-size: 13px; font-weight: 800; color: var(--muted); }
.pts-plan .pp-dur { font-size: 13px; color: var(--muted); font-weight: 600; }
.pts-plan .btn { margin-top: auto; }
.pts-history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pts-history li { display: flex; align-items: center; gap: 14px; padding: 13px 2px; border-bottom: 1px solid var(--border); }
.pts-history li:last-child { border-bottom: none; }
.ph-amount { min-width: 118px; font-weight: 900; font-size: 14.5px; }
.ph-amount.pos { color: var(--ok); }
.ph-amount.neg { color: var(--danger); }
.ph-reason { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
.ph-date { font-size: 12.5px; color: var(--faint); font-weight: 600; white-space: nowrap; }
.pts-empty { text-align: center; color: var(--faint); font-size: 13.5px; padding: 26px 0; }
.pts-login { text-align: center; padding: 70px 20px; }
.pts-login .btn { margin: 6px; }
.acc-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.acc-tabs button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--muted); font-weight: 800; font-size: 14px; cursor: pointer; transition: all var(--transition); }
.acc-tabs button.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
.modal-message { white-space: pre-line; }
.read-notice { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px); z-index: 300; display: flex; align-items: center; gap: 9px; padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--text); background: var(--card); border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
.read-notice.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.read-notice .rn-plus { color: var(--ok); font-weight: 900; }

/* OGP link card inside article body */
.link-card {
  margin: 0 0 1.5em; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--glass-border); background: var(--card);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 6px rgba(16, 24, 40, .05);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
}
.link-card:hover { transform: translateY(-3px); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glow); border-color: var(--primary); background: var(--card-hover); }
.link-card a { display: flex; text-decoration: none; color: inherit; min-height: 118px; }
.link-card-thumb {
  flex-shrink: 0; width: 200px; background: var(--hero-grad); background-size: cover; background-position: center;
  position: relative; display: flex; align-items: center; justify-content: center;
}
.link-card-thumb::before {
  content: 'LINK'; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .3em;
  color: rgba(255,255,255,.45);
}
.link-card.has-img .link-card-thumb::before { content: ''; }
.link-card-body { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.link-card-host {
  font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--primary);
}
.link-card-title { font-size: 15px; font-weight: 800; line-height: 1.5; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.link-card-desc { font-size: 13px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 640px) {
  .link-card a { flex-direction: column; }
  .link-card-thumb { width: 100%; aspect-ratio: 21 / 9; }
}
.source-box {
  width: 100%; max-width: var(--content-maxw); margin: 34px auto 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius);
  padding: 16px 20px;
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
}
.source-box .src-label { font-size: 12.5px; color: var(--faint); font-weight: 700; letter-spacing: .05em; }
.source-box .src-name { font-weight: 700; color: var(--text); font-size: 14.5px; }
.source-box .src-link { margin-left: auto; }
.related { margin-top: 54px; }

/* ============ search ============ */
.search-page .search-form { max-width: 640px; margin-bottom: 8px; }
.result-count { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
.result-count strong { color: var(--text); }

/* ============ state boxes ============ */
.state-box {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: 60px 20px; text-align: center; color: var(--muted);
}
.state-icon { font-size: 42px; line-height: 1; }
.state-box h3 { margin: 0; font-size: 17px; color: var(--text); font-weight: 800; }
.state-box p { margin: 0; font-size: 14px; }

/* ============ skeletons ============ */
.skeleton {
  position: relative; overflow: hidden; background: var(--skeleton-from); border-radius: 12px;
}
.skeleton::after {
  content: ''; position: absolute; inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--skeleton-to), transparent);
  animation: shimmer 1.5s infinite;
}
.sk-hero { height: 380px; border-radius: 20px; }
.sk-side { height: 150px; border-radius: 14px; }
.sk-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); overflow: hidden; }
.sk-card .sk-thumb { aspect-ratio: 21/9; border-radius: 0; }
.sk-card .sk-lines { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sk-line { height: 14px; border-radius: 7px; }
.sk-line.w60 { width: 60%; }
.sk-line.w80 { width: 80%; }
.sk-line.w40 { width: 40%; }
.sk-line.w90 { width: 90%; }
.sk-row { display: flex; flex-direction: column; gap: 16px; }

/* ============ forms (admin) ============ */
.form-card {
  background: var(--card); border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 26px; box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
}
.form-grid { display: grid; grid-template-columns: 1fr 340px; gap: 26px; }
.form-main, .form-side { display: flex; flex-direction: column; gap: 18px; }
label.field { display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; font-weight: 700; }
.field .req { color: var(--danger); }
.input, textarea.input, select.input {
  padding: 11px 14px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); background: var(--card); }
textarea.input { resize: vertical; line-height: 1.7; min-height: 120px; }
.hint { font-size: 12px; color: var(--faint); font-weight: 500; }
.label-text { font-size: 13.5px; font-weight: 700; }
.radio-pills { display: flex; gap: 8px; }
.radio-pills label { flex: 1; cursor: pointer; }
.radio-pills input { display: none; }
.radio-pills span {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--bg); font-size: 13.5px; font-weight: 700; color: var(--muted);
  transition: all var(--transition);
}
.radio-pills input:checked + span { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
.dt-row { display: flex; gap: 8px; }
.dt-row .input { flex: 1; }
.switch-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; font-weight: 700; }
.switch-row input { display: none; }
.switch-ui {
  width: 42px; height: 24px; border-radius: 999px; background: var(--border); position: relative;
  transition: background var(--transition); flex-shrink: 0;
}
.switch-ui::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  transition: transform var(--transition);
}
.switch-row input:checked + .switch-ui { background: var(--primary); }
.switch-row input:checked + .switch-ui::after { transform: translateX(18px); }
.thumb-box {
  width: 100%; aspect-ratio: 21/9; border-radius: 12px; overflow: hidden;
  border: 1px dashed var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.thumb-box img { width: 100%; height: 100%; object-fit: cover; }
.thumb-box .thumb-ph { font-size: 14px; font-weight: 800; letter-spacing: .3em; color: var(--faint); }
.drop-zone {
  border: 2px dashed var(--border); border-radius: 12px; padding: 18px; text-align: center;
  font-size: 13px; color: var(--muted); font-weight: 600; cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
}
.drop-zone:hover, .drop-zone.drag { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
details.source-details { border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px; background: var(--bg); }
details.source-details summary { cursor: pointer; font-weight: 700; font-size: 13.5px; padding: 10px 0; color: var(--muted); }
details.source-details .hint { display: block; margin-top: 8px; }
details.source-details label.field { margin-bottom: 12px; }
.form-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

/* ============ admin layout ============ */
.admin-layout { display: grid; grid-template-columns: 250px 1fr; gap: 26px; align-items: start; padding: 30px 0 60px; }
.admin-side {
  position: sticky; top: calc(var(--header-h) + 20px);
  background: var(--card); border: 1px solid var(--glass-border); border-radius: 18px;
  padding: 16px; display: flex; flex-direction: column; gap: 4px;
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
}
.admin-side .side-user { padding: 6px 10px 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.admin-side .side-user b { display: block; font-size: 14.5px; }
.admin-side .side-user span { font-size: 12.5px; color: var(--faint); word-break: break-all; }
.admin-nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px;
  color: var(--muted); font-weight: 700; font-size: 14px; border: none; background: none; width: 100%; text-align: left;
  transition: background var(--transition), color var(--transition);
}
.admin-nav-item:hover { background: var(--primary-soft); color: var(--primary); }
.admin-nav-item.active { background: var(--primary-soft); color: var(--primary); }
.admin-nav-item svg { flex-shrink: 0; }
.admin-nav-item .side-spacer { flex: 1; }
.admin-content { min-width: 0; }
.admin-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.admin-head h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.admin-head .spacer { flex: 1; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px;
  position: relative; overflow: hidden; transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--glow); border-color: var(--primary); }
.stat-card .stat-icon { position: absolute; right: -8px; top: -8px; font-size: 64px; opacity: .06; font-weight: 800; }
.stat-card .stat-num { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.stat-card .stat-label { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }

.panel {
  background: var(--card); border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); margin-top: 20px;
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
}
.panel h2 { margin: 0 0 16px; font-size: 16.5px; font-weight: 800; }

.table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); }
table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
.data-table th {
  text-align: left; padding: 12px 14px; background: var(--bg-soft);
  color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .04em; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr { transition: background var(--transition); }
.data-table tbody tr:hover { background: var(--bg-soft); }
.td-title { font-weight: 700; color: var(--text); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-thumb { width: 62px; height: 38px; border-radius: 7px; overflow: hidden; background: var(--hero-grad); position: relative; flex-shrink: 0; }
.td-thumb img { width: 100%; height: 100%; object-fit: cover; }
.td-thumb img.img-fail { opacity: 0; }
.row-actions { display: flex; gap: 7px; justify-content: flex-end; }

/* status chip */
.status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.status-chip .sdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status-success { background: var(--ok-soft); color: var(--ok); }
.status-running { background: var(--primary-soft); color: var(--primary); }
.status-retrying { background: var(--warn-soft); color: var(--warn); }
.status-failed { background: var(--danger-soft); color: var(--danger); }
.status-pending, .status-draft { background: var(--bg-soft); color: var(--muted); }
.status-published { background: var(--ok-soft); color: var(--ok); }
.status-running .sdot { animation: pulse 1.2s infinite; }

/* automation settings */
.info-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
.info-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.info-item .k { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; color: var(--faint); }
.info-item .v { font-size: 16px; font-weight: 800; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.info-item .v .small { font-size: 12px; font-weight: 600; color: var(--muted); }
.automation-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 18px;
}
.automation-banner .msg { font-size: 13px; color: var(--muted); flex: 1; min-width: 200px; }
.automation-banner .msg code { background: var(--card); border: 1px solid var(--border); padding: 1px 7px; border-radius: 6px; font-size: 12px; }

/* login */
.login-wrap { min-height: calc(100vh - var(--header-h)); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.login-card {
  width: 100%; max-width: 400px;
  background: linear-gradient(145deg, var(--glass-hi), transparent 55%), var(--glass);
  border: 1px solid var(--glass-border); border-radius: 22px;
  padding: 34px 30px; box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-lg);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
}
.login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
.login-card h1 { text-align: center; font-size: 22px; margin: 10px 0 4px; font-weight: 800; }
.login-card .login-sub { text-align: center; color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
.form-error {
  display: none; background: var(--danger-soft); color: var(--danger);
  border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px;
}
.form-error.show { display: block; animation: fadeDown .2s ease; }
.form-footer { text-align: center; margin-top: 18px; font-size: 13px; }

/* ============ footer ============ */
.site-footer { margin-top: auto; background: var(--footer-bg); color: var(--footer-text); border-top: 1px solid var(--border); }
.site-footer { box-shadow: 0 -20px 60px rgba(0,0,0,.2); }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px; padding: 52px 0 36px; }
.footer-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.footer-brand .brand-name { color: #fff; }
.footer-about { font-size: 13.5px; line-height: 1.8; color: var(--footer-text); max-width: 340px; margin: 0; }
.footer-col h4 { color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .08em; margin: 0 0 14px; }
.footer-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.footer-col a { color: var(--footer-text); font-size: 13.5px; transition: color var(--transition); }
.footer-col a:hover { color: var(--primary-2); }
.footer-bottom {
  border-top: 1px solid rgba(255,255,255,.08); padding: 18px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-size: 12.5px; color: rgba(255,255,255,.5);
}
.footer-bottom .foot-links { display: flex; gap: 16px; align-items: center; }
.footer-bottom a { color: rgba(255,255,255,.6); }
.footer-bottom a:hover { color: #fff; }

/* ============ modal & toast ============ */
.modal-root { position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-root.open { display: flex; }
.modal-backdrop {
  position: absolute; inset: 0; background: rgba(10, 12, 20, .55);
  backdrop-filter: blur(4px); animation: fadeIn .2s ease;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  position: relative; width: 100%; max-width: 420px;
  background: linear-gradient(145deg, var(--glass-hi), transparent 55%), var(--glass);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 26px; box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-lg);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  animation: pop .24s cubic-bezier(.34,1.56,.64,1);
}
.modal-title { margin: 0 0 10px; font-size: 18px; font-weight: 800; }
.modal-message { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

.toast-root { position: fixed; top: 76px; right: 18px; z-index: 400; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  pointer-events: auto; min-width: 240px; max-width: 360px;
  background: linear-gradient(145deg, var(--glass-hi), transparent 55%), var(--glass);
  border: 1px solid var(--glass-border); border-radius: 14px;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-lg); padding: 13px 18px; font-size: 13.5px; font-weight: 600;
  color: var(--text); display: flex; gap: 10px; align-items: center;
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  opacity: 0; transform: translateX(24px);
  transition: opacity .3s ease, transform .3s ease;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.toast-success::before { background: var(--ok); }
.toast-error::before { background: var(--danger); }
.toast-warn::before { background: var(--warn); }

/* ============ AIChat (WebLLM) ============ */
.aichat-fab {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 350;
  width: 58px; height: 58px; border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: var(--on-primary);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 26px var(--primary-soft);
  transition: transform var(--transition), box-shadow var(--transition);
}
.aichat-fab:hover { transform: translateY(-3px) scale(1.05); box-shadow: var(--glow); }
.aichat-fab:active { transform: scale(.94); }

.aichat-root {
  position: fixed; inset: 0; z-index: 340;
  display: none; align-items: flex-end; justify-content: flex-end;
  padding: 16px; pointer-events: none;
}
.aichat-root.open { display: flex; }
.aichat-backdrop {
  position: absolute; inset: 0; pointer-events: auto;
  background: rgba(10, 12, 20, .45); backdrop-filter: blur(3px);
  animation: fadeIn .2s ease;
}
.aichat-panel {
  position: relative; pointer-events: auto;
  width: 420px; max-width: 100%;
  height: min(640px, calc(100vh - 32px));
  display: flex; flex-direction: column;
  background: linear-gradient(145deg, var(--glass-hi), transparent 55%), var(--glass);
  border: 1px solid var(--glass-border); border-radius: 20px;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-lg);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  animation: pop .24s cubic-bezier(.34,1.56,.64,1);
  overflow: hidden;
}
@supports (height: 100dvh) {
  .aichat-panel { height: min(640px, calc(100dvh - 32px)); }
}
.aichat-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--glass-border);
  background: linear-gradient(180deg, var(--glass-hi), transparent);
}
.aichat-logo {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex; align-items: center; justify-content: center; font-size: 19px;
  box-shadow: 0 4px 12px var(--primary-soft);
}
.aichat-title { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.aichat-title strong { font-size: 16px; font-weight: 800; }
.aichat-status { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aichat-status.is-ready { color: var(--ok); }
.aichat-close {
  flex-shrink: 0;
  width: 36px; height: 36px; border-radius: 11px;
  border: 1px solid var(--glass-border); background: var(--card);
  color: var(--muted); font-size: 14px;
  transition: border-color var(--transition), color var(--transition), transform var(--transition);
}
.aichat-close:hover { border-color: var(--primary); color: var(--primary); transform: rotate(90deg); }
.aichat-model-sel {
  margin-left: auto; flex-shrink: 0;
  padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--glass-border); background: var(--card); color: var(--text);
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: border-color var(--transition), color var(--transition);
}
.aichat-model-sel:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.aichat-model-sel:disabled { opacity: .55; cursor: not-allowed; }
.aichat-model-pills label small {
  display: block; margin-top: 2px;
  font-size: 10.5px; font-weight: 600; color: inherit; opacity: .78;
}
.aichat-progress { display: none; height: 3px; background: var(--border); }
.aichat-progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width .3s ease;
}
.aichat-body { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.aichat-msgs {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 16px; display: flex; flex-direction: column; gap: 12px;
}
.aichat-msg { display: flex; }
.aichat-msg.is-user { justify-content: flex-end; }
.aichat-msg.is-ai { justify-content: flex-start; }
.aichat-bubble {
  max-width: 84%; padding: 10px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.75; word-break: break-word;
  animation: rise .3s cubic-bezier(.2,.7,.2,1) both;
}
.aichat-msg.is-user .aichat-bubble {
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: var(--on-primary); border-bottom-right-radius: 6px;
}
.aichat-msg.is-ai .aichat-bubble {
  background: var(--card); border: 1px solid var(--glass-border);
  border-bottom-left-radius: 6px; box-shadow: inset 0 1px 0 var(--glass-hi);
}
.aichat-bubble pre {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; overflow-x: auto; font-family: var(--mono);
  font-size: 12.5px; line-height: 1.6; margin: 6px 0; white-space: pre-wrap;
}
.aichat-bubble code { font-family: var(--mono); background: var(--bg-soft); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; }
.aichat-bubble ul { margin: 4px 0; padding-left: 1.3em; }
.dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: pulse 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }

/* 初回モデルダウンロード確認 */
.aichat-dl {
  position: absolute; inset: 0; z-index: 5;
  display: none; align-items: center; justify-content: center;
  padding: 20px; background: var(--bg);
}
.aichat-dl.show { display: flex; animation: fadeIn .2s ease; }
.aichat-dl-card {
  display: flex; flex-direction: column; gap: 12px;
  max-width: 340px; text-align: center;
  background: var(--card); border: 1px solid var(--glass-border); border-radius: 18px;
  padding: 24px 22px; box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-lg);
}
.aichat-dl-icon { font-size: 34px; line-height: 1; }
.aichat-dl-card h3 { margin: 0; font-size: 17px; font-weight: 800; }
.aichat-dl-card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
.aichat-dl-card p strong { color: var(--text); }

/* 入力エリア */
.aichat-foot {
  border-top: 1px solid var(--glass-border);
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px;
}
.aichat-form { display: flex; align-items: flex-end; gap: 10px; }
.aichat-form textarea {
  flex: 1; resize: none; min-height: 42px; max-height: 140px;
  padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 14.5px; line-height: 1.6;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.aichat-form textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.aichat-form textarea:disabled { opacity: .6; cursor: not-allowed; }
.aichat-send {
  width: 42px; height: 42px; border-radius: 12px; border: none; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: var(--on-primary); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px var(--primary-soft);
  transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
}
.aichat-send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--glow); }
.aichat-send:disabled { opacity: .5; cursor: not-allowed; }
.aichat-note { margin: 0; font-size: 11px; color: var(--faint); text-align: center; line-height: 1.6; }

/* AIChat: スマホでは全画面表示 */
@media (max-width: 768px) {
  .aichat-root { padding: 0; align-items: stretch; }
  .aichat-panel { width: 100%; height: 100vh; border-radius: 0; border: none; }
  @supports (height: 100dvh) {
    .aichat-panel { height: 100dvh; }
  }
  .aichat-fab { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); }
}

/* ============ animations ============ */
@keyframes shimmer { 100% { transform: translateX(100%); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.page-enter { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
.auto-grid > *, .grid > * { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
.auto-grid > *:nth-child(2), .grid > *:nth-child(2) { animation-delay: .05s; }
.auto-grid > *:nth-child(3), .grid > *:nth-child(3) { animation-delay: .1s; }
.auto-grid > *:nth-child(4), .grid > *:nth-child(4) { animation-delay: .15s; }
.auto-grid > *:nth-child(5), .grid > *:nth-child(5) { animation-delay: .2s; }
.auto-grid > *:nth-child(6), .grid > *:nth-child(6) { animation-delay: .25s; }

/* ============ responsive ============ */
@media (max-width: 1080px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-side { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .hero-side-title { grid-column: 1 / -1; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
}
@media (max-width: 920px) {
  .main-nav { display: none; }
  .hamburger { display: inline-flex; }
  .grid-3, .grid-4, .auto-grid { grid-template-columns: repeat(2, 1fr); }
  .admin-layout { grid-template-columns: 1fr; }
  .admin-side { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .admin-side .side-user { display: none; }
  .admin-nav-item { width: auto; }
  .admin-nav-item .side-spacer { display: none; }
  .footer-grid { grid-template-columns: 1fr; gap: 28px; }
}
/* ============ smartphone layout (≤640px) ============
   Distinct from the PC layout: simplified header, compact 2-column
   article cards, edge-to-edge horizontal-scroll chips & filter pills,
   tighter typography. */
@media (max-width: 640px) {
  /* ---- base ----
     Side gutter is widened to 28px+ on every phone by the ≤768px block
     below; this block keeps notched-phone safe-area insets. */
  .container {
    padding-left: var(--gutter);
    padding-right: var(--gutter);
    padding-left: calc(var(--gutter) + env(safe-area-inset-left));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right));
  }
  body { font-size: 15px; min-height: 100dvh; }
  /* prevent iOS zoom-on-focus (also via html[data-device="phone"]) */
  input, textarea, select { font-size: 16px; }

  /* ---- header: keep only brand + hamburger in the bar ---- */
  .header-inner { gap: 10px; height: 56px; }
  .brand-name { font-size: 16px; letter-spacing: .14em; }
  .header-actions { gap: 4px; }
  .header-actions .icon-btn:not(.hamburger),
  .header-actions .lang-switch { display: none; }
  .icon-btn { width: 40px; height: 40px; } /* larger tap target */

  /* ---- mobile menu ---- */
  .mobile-menu { padding: 12px var(--gutter) 22px; padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  .mobile-menu .nav-link { padding: 11px 16px; font-size: 15px; }
  .mm-search { margin-bottom: 6px; }
  .mm-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mm-cats .nav-link {
    width: auto; padding: 8px 15px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 999px;
  }
  .mm-section { gap: 8px; }

  /* ---- home: compact hero ---- */
  .hero { margin-top: 20px; }
  .hero-card { min-height: 320px; border-radius: 16px; }
  .hero-body { padding: 22px 24px 24px; gap: 10px; }
  .hero-card h2 { font-size: 20px; line-height: 1.45; }
  .hero-card p { font-size: 13.5px; }
  .hero-meta { font-size: 12px; }
  .hero-side { grid-template-columns: 1fr; gap: 12px; }
  .hero-side-title { font-size: 14px; }
  .mini-card { padding: 12px; gap: 12px; }
  .mini-thumb { width: 76px; height: 52px; }
  .mini-body h4 { font-size: 13.5px; }

  /* ---- category chips: edge-to-edge horizontal scroll ---- */
  .chip-row {
    flex-wrap: nowrap; overflow-x: auto;
    margin: 22px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter) 10px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 9px 16px; }

  /* ---- article grids: single-column roomy cards ---- */
  .grid-2, .grid-3, .grid-4, .auto-grid { grid-template-columns: 1fr; gap: 18px; }
  .article-card { border-radius: 14px; }
  .article-card:active { transform: scale(.98); } /* tactile press feedback */
  .card-body { padding: 16px 18px 18px; gap: 9px; }
  .card-title { font-size: 16px; line-height: 1.55; -webkit-line-clamp: 3; }
  .card-desc { display: -webkit-box; }
  .card-badges .badge { display: inline-flex; }
  .card-meta { font-size: 12px; gap: 7px; padding-top: 4px; }
  .sk-hero { height: 320px; }

  /* ---- section spacing ---- */
  .section { margin-top: 40px; }
  .section-head { margin-bottom: 16px; }
  .section-title { font-size: 18px; }

  /* ---- list / search pages ---- */
  .page { padding: 24px 0 56px; }
  .page-title { font-size: 24px; }
  .page-sub { font-size: 13.5px; }
  .filter-pills {
    flex-wrap: nowrap; overflow-x: auto;
    margin: 16px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter) 10px;
    scrollbar-width: none;
  }
  .filter-pills::-webkit-scrollbar { display: none; }
  .filter-pill { flex-shrink: 0; padding: 8px 15px; }

  /* ---- article detail ---- */
  .article-page { padding: 18px 0 56px; }
  .article-head { margin: 22px auto 22px; }
  .article-head h1 { font-size: 21px; line-height: 1.45; }
  .article-hero { aspect-ratio: 16 / 10; border-radius: 14px; }
  .prose { font-size: 16px; line-height: 1.95; }
  .prose h2 { font-size: 18px; }
  .source-box { padding: 16px 18px; }
  .source-box .src-link { margin-left: 0; width: 100%; }
  .related { margin-top: 46px; }

  /* ---- admin ---- */
  .admin-layout { padding: 22px 0 56px; }
  .admin-side {
    flex-wrap: nowrap; overflow-x: auto; padding: 8px; gap: 6px;
    scrollbar-width: none;
  }
  .admin-side::-webkit-scrollbar { display: none; }
  .admin-nav-item {
    flex-shrink: 0; width: auto; padding: 9px 14px;
    font-size: 13px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card);
  }
  .admin-nav-item svg { width: 15px; height: 15px; }
  .admin-head { gap: 10px; margin-bottom: 18px; }
  .admin-head h1 { font-size: 20px; }
  .stat-grid { gap: 12px; }
  .stat-card { padding: 16px; border-radius: 14px; }
  .stat-card .stat-num { font-size: 24px; }
  .stat-card .stat-label { font-size: 11.5px; }
  .panel { padding: 18px; border-radius: 14px; }
  .form-card { padding: 18px; border-radius: 14px; }
  .form-grid { gap: 22px; }
  .table-wrap { -webkit-overflow-scrolling: touch; }
  .data-table { min-width: 540px; font-size: 13px; }

  /* ---- misc ---- */
  .toast-root {
    left: var(--gutter);
    right: var(--gutter);
    left: calc(var(--gutter) + env(safe-area-inset-left));
    right: calc(var(--gutter) + env(safe-area-inset-right));
  }
  .toast { max-width: none; }
  .modal { padding: 22px; }
  .footer-grid { padding: 46px 0 30px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); gap: 28px; }
  .footer-bottom { padding-bottom: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }

/* ============ tablet portrait / large phones (641–920px) ============
   Hamburger nav + 2-col cards, but with roomier paddings than the
   smartphone layout. */
@media (min-width: 641px) and (max-width: 920px) {
  .article-card { border-radius: 14px; }
  .card-body { padding: 18px 20px 20px; gap: 10px; }
  .card-title { font-size: 16px; line-height: 1.55; }
  .hero-card { min-height: 360px; }
  .section { margin-top: 44px; }
}

/* ============ extra-small phones (≤380px) ============
   iPhone SE / small Androids: keep the 24px gutter but compact the hero
   and headlines so nothing gets cramped. */
@media (max-width: 380px) {
  .hero-card { min-height: 280px; border-radius: 14px; }
  .hero-card h2 { font-size: 18px; line-height: 1.4; }
  .hero-body { padding: 18px 20px 20px; }
  .mini-thumb { width: 68px; height: 46px; }
  .section-title { font-size: 17px; }
  .article-head h1 { font-size: 19px; }
}

/* ============ smartphone Liquid Glass + article-page spacing (≤768px) ============
   The PC layout above is untouched — everything in this block only refines
   phones and small tablets. */
@media (max-width: 768px) {
  /* ---- richer glass backdrop: INFOLD brand glows behind the glass ---- */
  body {
    background-image:
      radial-gradient(820px 460px at 10% -6%, rgba(13, 139, 255, .16), transparent 62%),
      radial-gradient(760px 460px at 92% 8%, rgba(106, 77, 255, .16), transparent 60%),
      radial-gradient(560px 420px at 50% 112%, rgba(255, 61, 154, .10), transparent 60%);
  }
  html[data-theme="light"] body {
    background-image:
      radial-gradient(820px 460px at 10% -6%, rgba(13, 139, 255, .12), transparent 62%),
      radial-gradient(760px 460px at 92% 8%, rgba(106, 77, 255, .12), transparent 60%),
      radial-gradient(560px 420px at 50% 112%, rgba(255, 61, 154, .07), transparent 60%);
  }

  /* ---- header: deeper see-through glass, natural while scrolling ---- */
  .site-header {
    backdrop-filter: blur(32px) saturate(170%);
    -webkit-backdrop-filter: blur(32px) saturate(170%);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 28px rgba(0, 0, 0, .14);
  }

  /* ---- hamburger: circular liquid-glass button ---- */
  .hamburger {
    border-radius: 50%;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(170%);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 10px rgba(0, 0, 0, .10);
  }
  .hamburger:hover { transform: translateY(-1px) scale(1.05); border-color: var(--primary); }
  .hamburger:active { transform: scale(.88); }

  /* ---- glass cards: stronger blur on touch screens ---- */
  .article-card, .mini-card, .link-card, .source-box, .panel, .form-card {
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
  }
  .article-card { box-shadow: inset 0 1px 0 var(--glass-hi), 0 4px 20px rgba(0, 0, 0, .10); }

  /* ---- glass pills: badges & category chips ---- */
  .badge {
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
  }
  .chip {
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow: inset 0 1px 0 var(--glass-hi);
  }

  /* ---- universal side margins: EVERY page, not just articles ----
     --gutter is widened on phones so all containers (article, lists, home,
     admin, search) open up consistently; the login page (no .container)
     tracks the same gutter, and safe-area insets are preserved. */
  :root, html[data-theme="light"], html[data-theme="dark"] {
    --gutter: clamp(28px, 4vw, 36px);
  }
  .container,
  .login-wrap {
    padding-left: calc(var(--gutter) + env(safe-area-inset-left));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right));
  }

  /* ---- long titles & text must wrap, never bleed ---- */
  .article-head h1, .article-head .meta, .prose,
  .card-title, .mini-body h4 { overflow-wrap: anywhere; }

  /* ---- media & tables inside the article: never overflow the screen ---- */
  .prose img, .prose video { max-width: 100%; height: auto; }
  .prose pre { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .prose table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---- belt-and-braces: no horizontal page scroll (clip keeps the sticky header working) ---- */
  @supports (overflow: clip) {
    body { overflow-x: clip; }
  }
}

/* device-aware: phones always keep 16px form controls (iOS focus zoom guard)
   and get the smartphone-safe bottom inset, regardless of orientation. */
html[data-device="phone"] input,
html[data-device="phone"] textarea,
html[data-device="phone"] select { font-size: 16px; }
html[data-device="phone"] .site-footer { padding-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  html { scroll-behavior: auto; }
}
/* ---- liquid glass fallback: solid surfaces when backdrop-filter is unsupported ---- */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html[data-theme="light"] {
    --card: #ffffff; --card-hover: #ffffff;
    --glass: rgba(255, 255, 255, .97); --glass-border: rgba(255, 255, 255, .9);
    --glass-hi: rgba(255, 255, 255, .5);
  }
  html[data-theme="dark"] {
    --card: rgba(15, 21, 40, .98); --card-hover: rgba(20, 28, 52, .98);
    --glass: rgba(12, 17, 34, .97); --glass-border: rgba(255, 255, 255, .1);
    --glass-hi: rgba(255, 255, 255, .05);
  }
}

function t(key, vars) {
  let s = (I18N[state.lang] && I18N[state.lang][key]) || I18N.ja[key] || key;
  if (vars) for (const k of Object.keys(vars)) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

/* ---------------- theme ---------------- */
function setTheme(mode, persist) {
  state.theme = mode;
  document.documentElement.setAttribute('data-theme', mode);
  if (persist) localStorage.setItem('infold_theme', mode);
  const btn = $('#theme-btn');
  if (btn) {
    const next = mode === 'dark' ? 'light' : 'dark';
    btn.innerHTML = next === 'dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    btn.setAttribute('aria-label', t(next === 'dark' ? 'common.switchToDark' : 'common.switchToLight'));
    btn.title = t(next === 'dark' ? 'common.switchToDark' : 'common.switchToLight');
  }
}
function initTheme() {
  const saved = localStorage.getItem('infold_theme');
  if (saved === 'light' || saved === 'dark') return setTheme(saved, false);
  // Near-future look: default to the dark theme.
  setTheme('dark', false);
}

/* ---------------- api ---------------- */
const api = {
  async request(method, path, body) {
    let res;
    try {
      const opts = { method, headers: { 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'include' };
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      res = await fetch(path, opts);
    } catch (err) {
      state.backendDown = true;
      updateOfflineBanner();
      const e = new Error('network');
      e.isNetwork = true;
      throw e;
    }
    if (!res) throw new Error('no response');
    let data = null;
    try { data = await res.json(); } catch (_) { /* ignore */ }
    if (!res.ok) {
      const e = new Error((data && data.error) || 'HTTP ' + res.status);
      e.status = res.status;
      e.data = data || {};
      throw e;
    }
    state.backendDown = false;
    updateOfflineBanner();
    return data;
  },
  get: (p) => api.request('GET', p),
  post: (p, b) => api.request('POST', p, b),
  put: (p, b) => api.request('PUT', p, b),
  del: (p) => api.request('DELETE', p),
  async upload(file) {
    const data = await fileToBase64(file);
    return api.post('/api/admin/upload', { fileName: file.name, contentType: file.type || 'application/octet-stream', data });
  },
};
function updateOfflineBanner() {
  const el = $('#offline-banner');
  if (!el) return;
  el.classList.toggle('show', state.backendDown);
  $('#offline-msg').textContent = t('common.offline');
}

/* ---------------- navigation ---------------- */
let useHash = location.protocol === 'file:';
function currentPath() {
  if (useHash) return location.hash.replace(/^#/, '') || '/';
  const p = location.pathname;
  return p.startsWith('/') ? p : '/' + p;
}
function navigate(path) {
  if (useHash) {
    location.hash = '#' + path;
  } else {
    if (location.pathname + location.search === path || (location.pathname === path && !location.search)) {
      render();
    } else {
      history.pushState({}, '', path);
      render();
    }
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function parsePath() {
  const full = currentPath();
  const qi = full.indexOf('?');
  const path = qi === -1 ? full : full.slice(0, qi);
  const query = new URLSearchParams(qi === -1 ? '' : full.slice(qi + 1));
  return { path: path === '' ? '/' : path, query };
}
