/* ---------------- content renderer (sanitized) ---------------- */
const URL_RE = /(https?:\/\/[^\s<>"']+)/gi;
function inlineFormat(s) {
  let out = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // NOTE: input is already HTML-escaped (renderContent escapes first), and
  // URL_RE excludes quotes/<>/whitespace, so inserting the matched URL
  // directly into href is safe and avoids double-escaping (& -> &amp;amp;).
  out = out.replace(URL_RE, (m, url) => {
    const safeUrl2 = safeUrl(url);
    if (!safeUrl2) return m;
    const trimmed = safeUrl2.replace(/[.,;:!?。、）)]+$/, '');
    const tail = safeUrl2.slice(trimmed.length);
    return '<a href="' + trimmed + '" target="_blank" rel="noopener noreferrer">' + trimmed + '</a>' + tail;
  });
  return out;
}
function renderContent(text) {
  const safe = esc(text || '');
  const lines = safe.split(/\n/);
  const blocks = [];
  let cur = [];
  for (const line of lines) {
    if (line.trim() === '') {
      if (cur.length) { blocks.push(cur); cur = []; }
      continue;
    }
    cur.push(line);
  }
  if (cur.length) blocks.push(cur);
  const parts = blocks.map((block) => {
    const first = block[0];
    if (first.startsWith('## ')) {
      return '<h2>' + inlineFormat(first.slice(3)) + '</h2>' + block.slice(1).map((p) => '<p>' + inlineFormat(p) + '</p>').join('');
    }
    if (block.every((l) => l.startsWith('- ') || l.startsWith('* '))) {
      return '<ul>' + block.map((l) => '<li>' + inlineFormat(l.replace(/^[-*] /, '')) + '</li>').join('') + '</ul>';
    }
    // A single line that is just a URL -> OGP link card
    if (block.length === 1 && /^https?:\/\/\S+$/i.test(first.trim())) {
      return linkCard(first.trim());
    }
    return '<p>' + block.map(inlineFormat).join('<br>') + '</p>';
  });
  return withAdSlots(parts);
}

/* ---------------- in-article ads (忍者ADMAX) ---------------- */
const ADMAX_SRC = 'https://adm.shinobi.jp/s/3361ef4376fbb4547dd372b6dece042c';
/* ADMAXが広告ブロッカーでブロックされたときに表示する自サイト宣伝バナー */
const FALLBACK_AD_URL = 'https://aichat.xn--9ckkn.top/';
/* 端末別の広告横幅 (phone / tablet / desktop) */
const AD_WIDTHS = { phone: 320, tablet: 468, desktop: 728 };

/* placeholder div (実際の広告タグは injectAdmax() で差し込む) */
function adSlotHtml() {
  return '<div class="admax-slot"></div>';
}

/* 本文のブロック(段落・見出し)の間に広告を 1〜2 回配置する。
   6ブロック以上: 1/3 と 2/3 の位置に2回 / 2〜5ブロック: 中央に1回 / 1ブロック以下: 広告なし */
function withAdSlots(parts) {
  const n = parts.length;
  if (!n) return '';
  const at = [];
  if (n >= 6) at.push(Math.floor(n / 3), Math.floor((2 * n) / 3));
  else if (n >= 2) at.push(Math.floor((n - 1) / 2));
  if (!at.length) return parts.join('');
  let html = '';
  parts.forEach((part, i) => {
    html += part;
    if (at.indexOf(i) !== -1) html += adSlotHtml();
  });
  return html;
}

/* innerHTML で挿入した <script> は実行されないため、
   プレースホルダを実際の広告タグ(script要素)に置き換えて読み込む */
function injectAdmax(root) {
  // 広告なしモード中は広告枠ごと挿入しない（空きスペースも残さない）
  if (document.documentElement.dataset.adfree === '1') return;
  $$('.admax-slot', root).forEach((slot) => {
    const wrap = document.createElement('div');
    wrap.className = 'ad-in-article';
    const s = document.createElement('script');
    s.src = ADMAX_SRC;
    s.async = true;
    wrap.append(document.createComment(' admax '), s, document.createComment(' admax '));
    slot.replaceWith(wrap);

    // 端末に応じてADMAXの広告(iframe)を横幅に合わせて拡大/縮小する
    const fitAdmax = () => {
      const ifr = wrap.querySelector('iframe');
      if (!ifr) return;
      const dev = document.documentElement.dataset.device || 'phone';
      const target = Math.min(AD_WIDTHS[dev] || 320, wrap.parentElement ? wrap.parentElement.clientWidth : 320);
      const nw = parseFloat(ifr.getAttribute('width')) || ifr.offsetWidth || 0;
      const nh = parseFloat(ifr.getAttribute('height')) || ifr.offsetHeight || 0;
      if (!nw || !nh || !target) return;
      const scale = target / nw;
      ifr.style.transform = 'scale(' + scale + ')';
      ifr.style.transformOrigin = 'center';
      wrap.style.width = Math.round(nw * scale) + 'px';
      wrap.style.height = Math.round(nh * scale) + 'px';
      clearInterval(fitTimer);
    };
    const fitTimer = setInterval(fitAdmax, 500);
    setTimeout(() => clearInterval(fitTimer), 15000);

    // 広告ブロッカー等でADMAXの広告が表示されない場合のフォールバック広告
    const showFallback = () => {
      if (wrap.querySelector('iframe') || wrap.querySelector('.admax-fallback')) return;
      const fb = document.createElement('a');
      fb.className = 'admax-fallback';
      fb.href = FALLBACK_AD_URL;
      fb.target = '_blank';
      fb.rel = 'noopener noreferrer';
      const title = document.createElement('span');
      title.className = 'af-title';
      title.textContent = '無料で使えるAIチャット AIChat';
      const desc = document.createElement('span');
      desc.className = 'af-desc';
      desc.textContent = '質問・相談・アイデア出し、なんでもAIに聞ける';
      const cta = document.createElement('span');
      cta.className = 'af-cta';
      cta.textContent = FALLBACK_AD_URL + ' ｜ 無料ではじめる →';
      fb.append(title, desc, cta);
      wrap.appendChild(fb);
    };
    s.onerror = showFallback; // スクリプト自体がブロックされた場合
    setTimeout(showFallback, 3500); // 読み込めてもiframeが表示されない場合の保険
  });
}
function linkCard(url) {
  // url is already HTML-escaped here (renderContent escapes the whole text),
  // so insert it directly into attributes/display to avoid double-escaping.
  const clean = url.replace(/[.,;:!?。、）)]+$/, '');
  return `<div class="link-card" data-ogp-url="${clean}">
    <a href="${safeUrl(clean)}" target="_blank" rel="noopener noreferrer">
      <span class="link-card-thumb"></span>
      <span class="link-card-body">
        <span class="link-card-host">${hostName(clean)}</span>

        <span class="link-card-desc">${esc(t('article.linkLoading'))}</span>
      </span>
    </a>

}
async function hydrateLinkCards(root) {
  const cards = Array.from((root || document).querySelectorAll('.link-card[data-ogp-url]'));
  for (const card of cards) {
    const url = card.getAttribute('data-ogp-url');
    if (!url) continue;
    try {
      const res = await api.get('/api/ogp?url=' + encodeURIComponent(url));
      const img = res.image && safeUrl(res.image) ? res.image : '';
      card.querySelector('.link-card-title').textContent = res.title || url;
      card.querySelector('.link-card-desc').textContent = res.description || '';
      if (img) {
        const cssSafe = img.replace(/["\\()]/g, ''); // CSS url() context — strip dangerous chars
        card.querySelector('.link-card-thumb').style.backgroundImage = 'url("' + cssSafe + '")';
        card.classList.add('has-img');
      }
      card.querySelector('a').href = safeUrl(url);
    } catch (_) {
      card.querySelector('.link-card-desc').textContent = '';
    }
  }
}

function setDocMeta(title, desc, image, canonicalPath) {
  document.title = title;
  const setMeta = (name, content) => {
    let el = document.querySelector('meta[name="' + name + '"]') || document.querySelector('meta[property="' + name + '"]');
    if (!el) { el = document.createElement('meta'); document.head.appendChild(el); }
    el.setAttribute(content && content.startsWith('og:') ? 'property' : 'name', name);
    el.setAttribute('content', content || '');
  };
  setMeta('description', desc || '');
  setMeta('og:title', title);
  setMeta('og:description', desc || '');
  setMeta('og:type', canonicalPath && canonicalPath.startsWith('/article/') ? 'article' : 'website');
  const img = thumbSrc(image);
  // og:image は絶対URL(https/http)のみ。data URI のプレースホルダは設定しない
  setMeta('og:image', /^https?:/i.test(img) ? absUrl(img) : '');
  if (location.protocol !== 'file:') {
    const url = absUrl(canonicalPath || '/');
    let link = document.querySelector('link[rel="canonical"]');
    if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }

    setMeta('og:url', url);
  }
}

async function loadMoreArticles() {
  const st = state.articleList;
  if (!st || st.loading || st.end) return;
  st.loading = true;
  const grid = $('#list-grid');
  const wrap = $('#load-more-wrap');
  const params = new URLSearchParams({ page: st.page, limit: 9 });
  if (st.category) params.set('category', st.category);
  try {
    const res = await api.get('/api/articles?' + params.toString());
    const articles = res.articles || [];
    st.total = res.total || 0;
    if (st.page === 1) {
      if (!articles.length) { grid.innerHTML = emptyBox(); wrap.innerHTML = ''; st.end = true; return; }
      grid.innerHTML = '<div class="grid auto-grid">' + articles.map((a) => articleCard(a)).join('') + '</div>';
    } else {
      grid.insertAdjacentHTML('beforeend', '<div class="grid auto-grid" style="margin-top:22px">' + articles.map((a) => articleCard(a)).join('') + '</div>');
    }
    st.page += 1;
    const loaded = (st.page - 1) * 9;
    st.end = loaded >= st.total;
    wrap.innerHTML = st.end
      ? '<span class="hint">' + esc(t('common.endOfList')) + '</span>'
      : '<button class="btn btn-ghost" data-action="load-more">' + esc(t('common.loadMore')) + '</button>';
  } catch (err) {
    if (st.page === 1) grid.innerHTML = errorBox(err);
    wrap.innerHTML = '';
  } finally {
    st.loading = false;
  }
}

/* Auto-translate the article body when the UI language is English. */
async function maybeTranslateArticle(app, a) {
  if (state.lang !== 'en' || !a || !a.content) return;
  const key = 'infold_tr_' + a.id + '_en';
  const cached = sessionStorage.getItem(key);
  let translated = cached;
  if (!translated) {
    const prose = $('.prose', app);
    if (!prose) return;
    const original = prose.innerHTML;
    prose.innerHTML = '<p style="opacity:.6">Translating…</p>';
    try {
      const res = await api.post('/api/translate', { text: a.content, target: 'en' });
      translated = res && res.translated ? res.translated : null;
      if (translated) sessionStorage.setItem(key, translated);
    } catch (_) {
      translated = null;
    }
    if (!translated) { prose.innerHTML = original; return; }
  }
  const prose = $('.prose', app);
  if (prose) prose.innerHTML = renderContent(translated);
  // Re-hydrate any OGP link cards created by the translated text.
  hydrateLinkCards(app);
  injectAdmax(app);
  // Keep the original Japanese reachable via a small toggle (per article view).
  const head = $('.article-head', app);
  if (head && !head.querySelector('.tr-toggle')) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-ghost btn-sm tr-toggle';
    btn.style.marginTop = '14px';
    btn.textContent = '日本語の原文を表示';
    btn.onclick = () => {
      const p = $('.prose', app);
      if (p) p.innerHTML = renderContent(a.content);
      injectAdmax(p);
      btn.remove();
    };
    head.appendChild(btn);
  }
}

/* ---------------- points / reader account (points feature) ---------------- */
let adFreeTimer = null;
function setAdFree(active) {
  state.adFree = !!active;
  if (active) document.documentElement.setAttribute('data-adfree', '1');
  else document.documentElement.removeAttribute('data-adfree');
}
async function refreshAdFree() {
  if (!state.reader) { setAdFree(false); return; }
  try {
    const res = await api.get('/api/points/ad-free');
    setAdFree(!!(res && res.active));
    if (res && res.active && res.expiresAt) scheduleAdFreeRefresh(res.expiresAt);
  } catch (_) { setAdFree(false); }
}
function scheduleAdFreeRefresh(expiresAt) {
  clearTimeout(adFreeTimer);
  const wait = new Date(expiresAt).getTime() - Date.now() + 1000;
  adFreeTimer = setTimeout(() => { refreshAdFree(); }, Math.max(0, Math.min(wait, 2147483647)));
}
async function refreshReaderState() {
  try {
    const res = await api.get('/api/auth/me');
    state.reader = res.user || null;
  } catch (_) {
    state.reader = null;
  }
  await refreshAdFree();
  renderHeader(); renderFooter();
}
function fmtRemaining(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return t('points.remainingFmt', { h, m });
}
const PTS_DUR_KEYS = { '6h': 'points.dur6h', '24h': 'points.dur24h', '7d': 'points.dur7d' };
const PTS_HIST_ADFREE = { 10: 'points.historyAdFree6h', 30: 'points.historyAdFree24h', 70: 'points.historyAdFree7d' };

  setDocMeta(t('account.title') + ' | INFOLD', '', '', '/account');

  if (state.reader) { navigate('/points'); return; }
  let tab = 'login';

      </div>

      b.onclick = () => { tab = b.dataset.accTab; draw(); };
    });
    $('#acc-form', app).addEventListener('submit', async (e) => {
      e.preventDefault();

      if (tab === 'register' && password.length < 8) { errEl.textContent = t('account.passwordShort'); errEl.classList.add('show'); return; }

      btn.disabled = true; btn.classList.add('loading');

      try {
        const res = await api.post(tab === 'login' ? '/api/auth/login' : '/api/auth/register', { email, password, name });
        state.reader = res.user || null;
        toast(tab === 'login' ? t('toast.loggedInReader') : t('toast.registered'), 'success');
        await refreshAdFree();
        renderHeader(); renderFooter();
        navigate('/points');
      } catch (err) {
        btn.disabled = false; btn.classList.remove('loading');
        btn.innerHTML = esc(tab === 'login' ? t('account.signIn') : t('account.register'));
        if (err.isNetwork) errEl.textContent = t('toast.network');
        else if (err.status === 401) errEl.textContent = t('err.invalidCredentials');
        else if (err.status === 409) errEl.textContent = t('account.emailTaken');
        else if (err.data && err.data.error === 'password_too_short') errEl.textContent = t('account.passwordShort');
        else errEl.textContent = t('toast.error');
        errEl.classList.add('show');
      }
    });
  };
  draw();
}

async function useAdFreePlan(planPoints, currentBalance) {
  const durKey = { 10: 'points.dur6h', 30: 'points.dur24h', 70: 'points.dur7d' }[planPoints];
  if (!durKey) return;
  const ok = await confirmDialog({
    title: t('points.confirmTitle', { duration: t(durKey) }),
    message: t('points.confirmPoints', { points: Number(planPoints).toLocaleString() }) + '\n' + t('points.confirmBalance', { points: Number(currentBalance).toLocaleString() }),
    confirmText: t('points.confirmOk'),
    danger: false,
  });
  if (!ok) return;
  try {
    const res = await api.post('/api/points/ad-free', { plan: planPoints });
    toast(t('points.used'), 'success');
    setAdFree(true);
    if (res.expiresAt) scheduleAdFreeRefresh(res.expiresAt);
    renderPoints($('#app'));
  } catch (err) {
    if (err.status === 409 || (err.data && err.data.error === 'insufficient_points')) toast(t('points.insufficient'), 'error');
    else toast(t('toast.error'), 'error');
  }
}

/* 記事読了 +1 POINT 通知（控えめな表示） */
let readNoticeTimer = null;
function showReadNotice(earned, nextAt) {
  let el = $('#read-notice');
  if (!el) { el = document.createElement('div'); el.id = 'read-notice'; el.className = 'read-notice'; document.body.appendChild(el); }
  let msg;
  if (earned) {
    msg = '<span>✓</span><span>' + esc(t('points.readToast')) + '</span><span class="rn-plus">+1 POINT</span>';
  } else if (nextAt) {
    const h = Math.max(1, Math.ceil((new Date(nextAt).getTime() - Date.now()) / 3600000));
    msg = '<span>🕒</span><span>' + esc(t('points.reclaimIn', { time: h })) + '</span>';
  } else {
    msg = '<span>🕒</span><span>' + esc(t('points.alreadyEarned')) + '</span>';
  }
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(readNoticeTimer);
  readNoticeTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

/* 記事読了検知: 30秒経過 + 本文80%スクロール → サーバーに読了を報告 */
const reading = { articleId: null, startedAt: 0, submitted: false };
function startReadingTracking(id) {
  reading.articleId = id;
  reading.startedAt = Date.now();
  reading.submitted = false;
}
function checkReading() {
  if (!reading.articleId || reading.submitted || !state.reader) return;
  if (Date.now() - reading.startedAt < 30000) return;
  const prose = $('.prose');
  if (!prose || !document.body.contains(prose)) return;
  const rect = prose.getBoundingClientRect();
  const readPx = window.scrollY + window.innerHeight - rect.top;
  if (readPx / Math.max(1, rect.height) < 0.8) return;
  reading.submitted = true;
  api.post('/api/articles/' + reading.articleId + '/complete')
    .then((res) => {
      if (res && res.awarded) showReadNotice(true);
      else if (res && res.nextAvailableAt) showReadNotice(false, res.nextAvailableAt);
      else reading.submitted = false;
    })
    .catch(() => { reading.submitted = false; });
}
setInterval(checkReading, 1000);

function bindArticleForm(id, isEdit) {
  const form = $('#article-form');
  // upload
  const zone = $('#drop-zone');
  const fileInput = $('#thumb-file');
  const thumbInput = form.querySelector('input[name=thumbnail]');
  const thumbBox = $('#thumb-box');
  const setThumb = (url) => {
    thumbInput.value = url;
    thumbBox.innerHTML = url ? '<img src="' + esc(url) + '" alt="" onerror="this.classList.add(\'img-fail\')">' : '<div class="thumb-ph">INFOLD</div>';
  };
  zone.addEventListener('click', () => fileInput.click());
  zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('drag'); if (e.dataTransfer.files.length) uploadThumb(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadThumb(fileInput.files[0]); fileInput.value = ''; });
  thumbInput.addEventListener('input', () => {
    thumbBox.innerHTML = thumbInput.value ? '<img src="' + esc(thumbInput.value) + '" alt="" onerror="this.classList.add(\'img-fail\')">' : '<div class="thumb-ph">INFOLD</div>';
  });
  async function uploadThumb(file) {
    if (!file.type.startsWith('image/')) { toast(t('toast.uploadFailed'), 'error'); return; }
    if (file.size > 5 * 1024 * 1024) { toast(t('toast.uploadFailed') + ' (5MB)', 'error'); return; }
    zone.textContent = t('admin.articleForm.uploading') + '…';
    try {
      const res = await api.upload(file);
      setThumb(res.url);
      toast(t('toast.uploaded'), 'success');
    } catch (err) {
      toast(t('toast.uploadFailed'), 'error');
    } finally {
      zone.textContent = t('admin.articleForm.dragDrop');
    }
  }
  // submit
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = {
      title: String(fd.get('title') || '').trim(),
      description: String(fd.get('description') || '').trim(),
      content: String(fd.get('content') || ''),
      category: String(fd.get('category') || 'other'),
      status: fd.get('status') === 'published' ? 'published' : 'draft',
      featured: fd.get('featured') === 'on',
      thumbnail: String(fd.get('thumbnail') || '').trim(),
      publishedAt: String(fd.get('publishedAt') || '') ? new Date(String(fd.get('publishedAt'))).toISOString() : null,
      sourceUrl: String(fd.get('sourceUrl') || '').trim() || null,

    case 'set-lang-en': setLang('en'); break;
    case 'toggle-menu': $('#mobile-menu').classList.toggle('open'); break;
    case 'cat-toggle': {
      const dd = $('#cat-dropdown');

/* ---------------- device detection ----------------
   Classify the device (phone / tablet / desktop) from the user agent and
   the actual viewport width, then expose it as data attributes so CSS can
   deliver width-appropriate sizing on every model. */
function detectDevice() {
  const d = document.documentElement;
  const w = innerWidth;
  const ua = navigator.userAgent;
  const isPhoneUA = /iPhone|Android.*Mobile|Windows Phone|Mobile\b|webOS|IEMobile/i.test(ua);
  const isTabletUA = /iPad|Android(?!.*Mobile)|Tablet/i.test(ua) || (isPhoneUA && w >= 700);
  let device = 'desktop';
  if (w <= 480 || (isPhoneUA && w <= 920)) device = 'phone';
  else if (w <= 920 || isTabletUA) device = 'tablet';
  d.dataset.device = device;
}
detectDevice();
window.addEventListener('resize', () => { detectDevice(); });
window.addEventListener('orientationchange', () => setTimeout(detectDevice, 200));

/* ============================================================
   AIChat (WebLLM) — ブラウザ内で動くAIチャット
   ============================================================ */
const AICHAT_CDN = 'https://esm.run/@mlc-ai/web-llm@0.2.84';
const AICHAT_DL_KEY = 'infold_aichat_ready';
const AICHAT_MODELS = {
  '1.5b': { id: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', label: '標準版 1.5B' },
  '0.5b': { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: '軽量版 0.5B' },
};
const AICHAT_DEFAULT_MODEL = '1.5b';
const aichat = {
  webllm: null,
  engine: null,
  modelKey: AICHAT_DEFAULT_MODEL,
  ready: false,
  busy: false,
  loading: false,
  msgs: [{ role: 'system', content: 'あなたはニュースメディア「INFOLD」のAIアシスタント「AIChat」です。質問には日本語で簡潔かつ丁寧に答えてください。' }],
};
function aichatUI() {
  return {
    root: $('#aichat-root'), fab: $('#aichat-fab'), close: $('#aichat-close'),
    msgs: $('#aichat-msgs'), dl: $('#aichat-dl'),
    status: $('#aichat-status'), progWrap: $('#aichat-progress'), progBar: $('#aichat-progress-bar'),
    form: $('#aichat-form'), input: $('#aichat-input'), send: $('#aichat-send'),
    dlYes: $('#aichat-dl-yes'), dlNo: $('#aichat-dl-no'),

function aichatStatus(label, pct) {
  const ui = aichatUI();
  if (label) {
    ui.status.textContent = label;
    ui.status.classList.toggle('is-ready', /完了|準備完了/.test(label));
  }
  if (pct == null) ui.progWrap.style.display = 'none';
  else { ui.progWrap.style.display = 'block'; ui.progBar.style.width = Math.max(2, Math.min(100, pct)) + '%'; }
}
/* 軽量マークダウン風レンダリング（モデル出力を安全に表示） */
function chatMd(text) {
  let s = esc(text || '');
  s = s.replace(/```([\s\S]*?)```/g, (m, code) => '<pre>' + esc(code).replace(/\n/g, '<br>') + '</pre>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const lines = s.split('\n');
  let out = '', inList = false;
  for (const ln of lines) {
    const t = ln.trim();
    if (!t) continue;
    if (/^[-*•]\s+/.test(t)) {
      if (!inList) { out += '<ul>'; inList = true; }
      out += '<li>' + t.replace(/^[-*•]\s+/, '') + '</li>';
      continue;
    }
    if (inList) { out += '</ul>'; inList = false; }
    out += (out ? '<br>' : '') + ln;
  }
  if (inList) out += '</ul>';
  return out;
}
function aichatAppend(role, html) {
  const ui = aichatUI();
  const wrap = document.createElement('div');
  wrap.className = 'aichat-msg ' + (role === 'user' ? 'is-user' : 'is-ai');
  const bub = document.createElement('div');
  bub.className = 'aichat-bubble';
  bub.innerHTML = html;
  wrap.appendChild(bub);
  ui.msgs.appendChild(wrap);
  ui.msgs.scrollTop = ui.msgs.scrollHeight;
  return bub;
}
function aichatTyping(on) {
  const ui = aichatUI();
  let el = ui.msgs.querySelector('.aichat-typing');
  if (on && !el) {
    el = document.createElement('div');
    el.className = 'aichat-msg is-ai aichat-typing';
    el.innerHTML = '<div class="aichat-bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    ui.msgs.appendChild(el);
    ui.msgs.scrollTop = ui.msgs.scrollHeight;
  } else if (!on && el) el.remove();
}
function aichatSetInput(dis) {
  const ui = aichatUI();
  ui.input.disabled = dis;
  ui.send.disabled = dis;
}
function aichatOpen() {
  const ui = aichatUI();
  if (ui.root.classList.contains('open')) return;
  ui.root.classList.add('open');
  ui.root.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  if (!ui.msgs.children.length) aichatAppend('ai', chatMd('こんにちは！AIChatです 🤖\nテクノロジーやニュースのこと、その他なんでも気軽に質問してください。'));
  if (!aichat.ready && !aichat.engine) {
    // どれかのモデルをダウンロード済みなら直接読み込み、未ダウンロードなら確認を表示
    const saved = Object.keys(AICHAT_MODELS).find((k) => localStorage.getItem(AICHAT_DL_KEY + '_' + k) === '1');
    if (saved) aichatLoadModel(AICHAT_MODELS[saved].id);
    else ui.dl.classList.add('show');
  } else if (aichat.ready) {
    aichatStatus('準備完了 ✓（' + AICHAT_MODELS[aichat.modelKey].label + '）');
    aichatSetInput(false);
  }
}
function aichatClose() {
  const ui = aichatUI();
  if (!ui.root.classList.contains('open')) return;
  ui.root.classList.remove('open');
  ui.root.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
async function aichatLoadModel(modelId) {
  const ui = aichatUI();
  ui.dl.classList.remove('show');
  if (aichat.loading) return;
  if (!navigator.gpu) {
    aichatStatus('WebGPU非対応のブラウザです');
    aichatAppend('ai', chatMd('お使いのブラウザは **WebGPU** に対応していないため、ブラウザ内AIを利用できません。\n最新の **Google Chrome**（PC / Android）や **Safari** などWebGPU対応ブラウザをご利用ください。'));
    return;
  }
  aichat.loading = true;
  aichatStatus('モデルを準備中…', 2);
  aichatSetInput(true);
  ui.modelSel.disabled = true;
  try {
    const webllm = aichat.webllm || (aichat.webllm = await import(AICHAT_CDN));
    if (!aichat.engine) {
      aichat.engine = new webllm.MLCEngine({
        useWebWorker: false,
        initProgressCallback: (p) => {
          const frac = (p && typeof p.progress === 'number') ? p.progress : 0;
          if (frac >= 1) aichatStatus('モデル読み込み完了', 100);
          else if (frac > 0) aichatStatus('モデルをダウンロード中 ' + Math.floor(frac * 100) + '%', Math.floor(frac * 100));
          else aichatStatus('モデルを準備中…', 2);
        },
      });
    }
    await aichat.engine.reload(modelId);
    aichat.modelKey = Object.keys(AICHAT_MODELS).find((k) => AICHAT_MODELS[k].id === modelId) || AICHAT_DEFAULT_MODEL;
    aichat.ready = true;
    try { localStorage.setItem(AICHAT_DL_KEY + '_' + aichat.modelKey, '1'); } catch (_) {}
    aichatStatus('準備完了 ✓（' + AICHAT_MODELS[aichat.modelKey].label + '）');
    aichatSetInput(false);
    ui.modelSel.value = aichat.modelKey;
    ui.modelSel.disabled = false;
    aichatAppend('ai', chatMd('✅ モデルの準備ができました！\n何でも質問してください。'));
  } catch (err) {
    console.error('AIChat load failed:', err);
    aichat.ready = false;
    aichatStatus('モデルの読み込みに失敗しました');
    aichatAppend('ai', chatMd('モデルの読み込みに失敗しました。\n通信環境を確認してもう一度お試しください（ダウンロードは再開できます）。'));
    aichatSetInput(true);
    ui.modelSel.disabled = false;
  }
  aichat.loading = false;
}
async function aichatSend(raw) {
  const text = (raw || '').trim();
  if (!text || aichat.busy || aichat.loading || !aichat.ready || !aichat.engine) return;
  aichat.busy = true;
  aichatSetInput(true);
  aichatAppend('user', chatMd(text));
  aichat.msgs.push({ role: 'user', content: text });
  aichatTyping(true);
  let bub = null;
  try {
    const chunks = await aichat.engine.chat.completions.create({
      messages: aichat.msgs,
      temperature: 0.7,
      stream: true,
    });
    let reply = '';
    for await (const chunk of chunks) {
      const delta = chunk.choices && chunk.choices[0] ? chunk.choices[0].delta : null;
      if (delta && delta.content) reply += delta.content;
      if (!bub) { aichatTyping(false); bub = aichatAppend('ai', ''); }
      bub.innerHTML = chatMd(reply);
      aichatUI().msgs.scrollTop = aichatUI().msgs.scrollHeight;
    }
    if (!bub) { aichatTyping(false); bub = aichatAppend('ai', chatMd('（返信がありませんでした）')); }
    aichat.msgs.push({ role: 'assistant', content: reply });
    if (aichat.msgs.length > 30) aichat.msgs.splice(1, aichat.msgs.length - 30); // 会話履歴を直近に制限
  } catch (err) {
    console.error('AIChat send failed:', err);
    aichatTyping(false);
    if (!bub) bub = aichatAppend('ai', '');
    bub.innerHTML = chatMd('エラーが発生しました。もう一度お試しください。');
  }
  aichat.busy = false;
  aichatSetInput(!aichat.ready);
}
function initAIChat() {
  const ui = aichatUI();
  ui.fab.addEventListener('click', () => {
    if (ui.root.classList.contains('open')) aichatClose();
    else aichatOpen();
  });
  ui.close.addEventListener('click', aichatClose);
  ui.root.querySelector('.aichat-backdrop').addEventListener('click', aichatClose);
  ui.dlYes.addEventListener('click', () => {
    const checked = ui.root.querySelector('#aichat-model-pills input:checked');
    if (checked) aichat.modelKey = checked.value;
    aichatLoadModel(AICHAT_MODELS[aichat.modelKey].id);
  });
  ui.dlNo.addEventListener('click', () => {
    ui.dl.classList.remove('show');
    aichatStatus('モデル未ダウンロード');
  });
  // モデル切替（読み込み後・ヘッダーのセレクト）
  ui.modelSel.addEventListener('change', () => {
    if (aichat.loading || ui.modelSel.value === aichat.modelKey) return;
    aichatAppend('ai', chatMd('モデルを **' + AICHAT_MODELS[ui.modelSel.value].label + '** に切り替えています…'));
    aichatLoadModel(AICHAT_MODELS[ui.modelSel.value].id);
  });
  ui.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = ui.input.value;
    ui.input.value = '';
    ui.input.style.height = 'auto';
    aichatSend(v);
  });
  ui.input.addEventListener('input', () => {
    ui.input.style.height = 'auto';
    ui.input.style.height = Math.min(ui.input.scrollHeight, 140) + 'px';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ui.root.classList.contains('open')) aichatClose();
  });
}
initAIChat();
