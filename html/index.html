  padding: 16px 0; border-bottom: 1px solid var(--border); color: var(--text);
}
.latest-item:last-child { border-bottom: 0; }
.latest-item h3 { margin: 0 0 7px; font-size: 14px; line-height: 1.5; }
.latest-item time { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.latest-item .thumb { aspect-ratio: 1 / 1; }
.latest-item:hover h3 { color: var(--primary); }

/* ---- category sections ---- */
.category-block { padding: 64px 0; border-top: 1px solid var(--border); }
.category-block.alt { background: var(--bg-soft); }
.category-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; margin-bottom: 30px;
}
.category-kicker { color: var(--primary); font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px; }
.category-title { margin: 0; font-size: clamp(30px, 4vw, 54px); line-height: 1.02; font-weight: 800; }
.category-desc { margin: 10px 0 0; color: var(--muted); max-width: 660px; font-size: 14px; line-height: 1.7; }
.category-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .85fr); gap: 32px; }
.category-main .article-card { border: 0; }
.category-main .card-body { padding-left: 0; padding-right: 0; }
.category-main .card-title { font-size: clamp(22px, 2.3vw, 30px); }
.category-side { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.category-side .latest-item { grid-template-columns: minmax(0, 1fr) 84px; }
.category-empty { color: var(--muted); padding: 22px 0; font-size: 13.5px; }

/* ---- about ---- */
.about-infolf { margin-top: 82px; background: #17191D; color: #F5F5F5; padding: clamp(52px, 7vw, 92px) 0; }
.about-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(28px, 6vw, 90px); align-items: start; }
.about-title { margin: 0; font-size: clamp(32px, 4.5vw, 58px); line-height: 1.04; font-weight: 800; }
.about-title span { color: #83C441; }
.about-body { color: #B9BDB5; font-size: 15px; line-height: 1.9; }
.about-body p { margin: 0 0 18px; }
.about-points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #34373D; margin-top: 30px; }
.about-point { background: #202329; padding: 20px; }
.about-point b { display: block; color: #83C441; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
.about-point span { color: #D8DBD4; font-size: 13px; line-height: 1.55; }

/* ---- article detail ---- */
.article-page { padding-top: 26px; padding-bottom: 40px; }
.article-page > article { max-width: 1120px; margin: 0 auto; }
.article-hero {
  aspect-ratio: 16 / 8; max-height: 620px; overflow: hidden;
  border: 1px solid var(--border); background: var(--bg-soft); border-radius: 0;
}
.article-hero img { width: 100%; height: 100%; object-fit: cover; }
.article-head { max-width: 840px; margin: 42px auto 0; }
.back-link { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.back-link:hover { color: var(--primary); }
.article-head .badges { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.article-head h1 {
  margin: 18px 0 0; font-size: clamp(30px, 4.5vw, 62px);
  line-height: 1.12; font-weight: 800; letter-spacing: -.035em;
}
.article-head .meta { margin-top: 20px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.article-head .meta strong { color: var(--text); font-weight: 600; }
.article-head .sep { width: 1px; height: 12px; background: var(--border); }
.prose {
  max-width: 780px; margin: 52px auto 0; color: var(--text);
  font-size: 17px; line-height: 1.95; letter-spacing: .005em;
}
.prose p { margin: 0 0 1.55em; }
.prose h2 {
  margin: 52px 0 18px; padding-left: 16px; border-left: 4px solid var(--primary);
  font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3; font-weight: 800;
}
.prose h3 { margin: 38px 0 14px; font-size: 22px; line-height: 1.4; }
.prose ul, .prose ol { margin: 0 0 1.5em; padding-left: 1.4em; }
.prose li { margin: 0 0 .5em; }
.prose blockquote { margin: 30px 0; padding: 20px 24px; border-left: 3px solid var(--primary); background: var(--bg-soft); color: var(--muted); }
.prose a { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
.prose img { margin: 30px auto; border: 1px solid var(--border); }
.prose code { background: var(--bg-soft); border: 1px solid var(--border); padding: 2px 5px; font-family: var(--mono); font-size: .9em; }
.prose pre { background: var(--bg-soft); border: 1px solid var(--border); padding: 18px; overflow-x: auto; }
.source-box {
  max-width: 780px; margin: 42px auto 0; padding: 18px 20px;
  background: var(--bg-soft); border-left: 3px solid var(--primary);
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
}
.source-box .src-label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; }
.source-box .src-name { font-weight: 700; }
.source-box .src-link { margin-left: auto; }
.points-note {
  max-width: 780px; margin: 26px auto 0; padding: 18px 20px;
  border: 1px solid var(--border); background: var(--card);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.points-note strong { color: var(--primary); }
.points-note .pn-text { flex: 1; min-width: 220px; color: var(--muted); font-size: 13px; }
.related { max-width: 1120px; margin: 82px auto 0; }
.related .section-head { margin-bottom: 24px; }

/* ---- page heads / search / login / points / admin ---- */
.page-head { padding: 56px 0 0; }
.page-sub { margin-top: 14px; }
.filter-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 26px; }
.search-page .search-form { margin-top: 28px; max-width: 760px; }
.search-page .search-input { height: 54px; font-size: 17px; }
.search-page .search-form .btn { padding: 0 28px; }
.result-count { color: var(--muted); font-size: 13px; }
.login-wrap { padding: 56px var(--gutter); }
.login-card { max-width: 460px; margin: 0 auto; padding: 34px; }
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.login-card h1 { margin: 0; font-size: 30px; }
.login-sub { color: var(--muted); font-size: 13.5px; }
.acc-tabs { display: flex; border-bottom: 1px solid var(--border); margin: 24px 0; }
.acc-tabs button { flex: 1; border: 0; background: none; color: var(--muted); padding: 12px; font-weight: 700; border-bottom: 2px solid transparent; }
.acc-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
.field { display: block; margin-bottom: 16px; color: var(--muted); font-size: 12px; font-weight: 700; }
.field .input, .field input, .field textarea, .field select { display: block; width: 100%; margin-top: 6px; padding: 11px 13px; }
.form-card { padding: 22px; }
.form-error { display: none; color: var(--danger); font-size: 13px; margin-bottom: 12px; }
.form-error.show { display: block; }
.form-footer { margin-top: 18px; font-size: 12px; }
.pts-wrap { padding: 52px 0; max-width: 1120px; margin: 0 auto; }
.pts-hero { background: #17191D; color: #F5F5F5; padding: 34px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-left: 4px solid var(--primary); }
.pts-balance { font-size: clamp(42px, 6vw, 72px); font-weight: 800; line-height: 1; color: #83C441; }
.pts-balance small { font-size: 12px; color: #A5A8AE; letter-spacing: .12em; margin-left: 8px; }
.pts-balance-label { color: #A5A8AE; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.pts-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.pts-plan { border: 1px solid var(--border); background: var(--card); padding: 20px; }
.pp-points { font-size: 30px; font-weight: 800; color: var(--primary); }
.pp-points small { font-size: 10px; color: var(--muted); }
.pts-history { list-style: none; margin: 0; padding: 0; }
.pts-history li { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.pts-history .pos { color: var(--primary); font-weight: 700; }
.pts-history .neg { color: var(--danger); font-weight: 700; }
.pts-history .ph-date { color: var(--faint); font-size: 11.5px; }
.admin-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 36px; padding-top: 36px; padding-bottom: 60px; }
.admin-side { border-right: 1px solid var(--border); padding-right: 18px; }
.side-user { padding: 0 8px 18px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.side-user b { display: block; font-size: 14px; }
.side-user span { display: block; color: var(--muted); font-size: 11.5px; word-break: break-all; }
.admin-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 9px; border-radius: 1px; color: var(--muted); font-size: 13px; font-weight: 600; border: 0; background: none; width: 100%; text-align: left; }
.admin-nav-item:hover { background: var(--bg-soft); color: var(--text); }
.admin-nav-item.active { background: var(--primary-soft); color: var(--primary); border-left: 2px solid var(--primary); }
.admin-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.admin-head h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); font-weight: 800; }
.admin-head .spacer { flex: 1; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { padding: 20px; }
.stat-icon { font-size: 20px; margin-bottom: 8px; }
.stat-num { font-size: 30px; font-weight: 800; line-height: 1; }
.stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.panel { padding: 24px; margin-bottom: 20px; }
.panel h2 { margin: 0 0 16px; font-size: 20px; font-weight: 800; }
.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 11px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:hover td { background: var(--bg-soft); }
.td-title { font-weight: 600; min-width: 220px; }
.td-thumb { width: 64px; height: 42px; overflow: hidden; background: var(--bg-soft); }
.td-thumb img { width: 100%; height: 100%; object-fit: cover; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 4px 8px; border: 1px solid var(--border); }
.status-chip .sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-published, .status-success { color: var(--primary); }
.status-draft, .status-pending, .status-retrying { color: var(--warn); }
.status-failed { color: var(--danger); }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.info-list { border-top: 1px solid var(--border); margin-top: 18px; }
.info-item { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.info-item .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.automation-banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px; background: var(--bg-soft); border: 1px solid var(--border); }
.switch-row { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch-row input { width: 18px; height: 18px; accent-color: var(--primary); }
.switch-ui { display: none; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; }
.form-side { min-width: 0; }
.radio-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.radio-pills label { border: 1px solid var(--border); padding: 8px 12px; font-size: 12px; cursor: pointer; }
.radio-pills label:has(input:checked) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.drop-zone { border: 1px dashed var(--border); padding: 18px; color: var(--muted); font-size: 12.5px; text-align: center; cursor: pointer; }
.drop-zone:hover { border-color: var(--primary); color: var(--primary); }

/* ---- notifications ---- */
.notice-page { max-width: 980px; margin: 0 auto; padding: 56px 0 40px; }
.notice-hero { background: #17191D; color: #F5F5F5; padding: 34px; border-left: 4px solid var(--primary); margin-bottom: 22px; }
.notice-hero h1 { margin: 0 0 10px; font-size: clamp(30px, 4vw, 48px); }
.notice-hero p { color: #B9BDB5; margin: 0; font-size: 14px; }
.notice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.notice-card { border: 1px solid var(--border); background: var(--card); padding: 24px; }
.notice-card h2 { margin: 0 0 12px; font-size: 18px; }
.notice-state { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 16px; }
.notice-state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.notice-state.on .dot { background: var(--primary); }
.notice-list { list-style: none; margin: 0; padding: 0; }
.notice-list li { padding: 12px 0; border-bottom: 1px solid var(--border); }
.notice-list a { color: var(--text); font-weight: 600; font-size: 13.5px; }
.notice-list a:hover { color: var(--primary); }
.notice-list time { display: block; color: var(--faint); font-size: 10.5px; margin-top: 4px; text-transform: uppercase; }

/* ---- AI workspace ---- */
.ai-config-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ai-config-grid .field { margin: 0; }
.ai-config-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.ai-test-result { font-size: 12.5px; padding: 8px 10px; border: 1px solid var(--border); background: var(--bg-soft); }
.ai-test-result.ok { color: var(--primary); border-color: var(--primary); }
.ai-test-result.err { color: var(--danger); border-color: var(--danger); }
.ai-workspace { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 20px; }
.ai-news-list { border: 1px solid var(--border); max-height: 560px; overflow: auto; }
.ai-news-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.ai-news-item:last-child { border-bottom: 0; }
.ai-news-item:hover { background: var(--bg-soft); }
.ai-news-item.is-selected { background: var(--primary-soft); }
.ai-news-item .status-chip { font-size: 9.5px; padding: 3px 7px; }
.ai-news-actions .btn { white-space: nowrap; }
.notice-card .ai-note + .notice-state { margin-top: 12px; }
.notice-card .ai-config-actions { margin-top: 14px; }
.ai-news-item h3 { margin: 0 0 6px; font-size: 13.5px; line-height: 1.5; }
.ai-news-meta { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 8px; flex-wrap: wrap; }
.ai-news-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ai-preview { border: 1px solid var(--border); background: var(--bg-soft); padding: 22px; min-height: 300px; }
.ai-preview h2 { margin: 0 0 10px; font-size: 20px; line-height: 1.35; }
.ai-preview .lead { color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.ai-preview .preview-body { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; font-size: 13px; line-height: 1.8; }
.ai-preview .preview-body h3 { font-size: 15px; margin: 16px 0 8px; }
.ai-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
.ai-empty { color: var(--muted); text-align: center; padding: 50px 20px; font-size: 13px; }
.ai-history { max-height: 520px; overflow: auto; }

/* ---- footer ---- */
.site-footer { background: var(--footer-bg); color: var(--footer-text); margin-top: 84px; padding: 54px 0 24px; border-top: 1px solid #34373D; }
.footer-brand { display: flex; align-items: center; gap: 10px; color: #F5F5F5; margin-bottom: 16px; }
.footer-brand .brand-name { color: #F5F5F5; -webkit-text-fill-color: currentColor; }
.footer-about { color: #A5A8AE; font-size: 13px; max-width: 420px; line-height: 1.7; }
.footer-grid { display: grid; grid-template-columns: 1.4fr .7fr .7fr; gap: 40px; }
.footer-col h4 { margin: 0 0 14px; color: #F5F5F5; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.footer-col ul { list-style: none; margin: 0; padding: 0; }
.footer-col li { margin-bottom: 9px; }
.footer-col a { color: #A5A8AE; font-size: 13px; }
.footer-col a:hover { color: #83C441; }
.footer-bottom { margin-top: 40px; padding-top: 18px; border-top: 1px solid #34373D; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: #7C8188; }
.foot-links { display: flex; gap: 16px; }
.foot-links a { color: #A5A8AE; }

/* ---- responsive ---- */
@media (max-width: 1240px) {
  .main-nav .nav-link { padding: 0 9px; font-size: 11px; letter-spacing: .03em; }
  .header-inner { gap: 16px; }
}
@media (max-width: 1080px) {
  .main-nav { display: none; }
  .hamburger { display: inline-flex; }
  .lang-switch { display: none; }
  .header-actions { gap: 2px; }
  .hero-main { grid-template-columns: 1fr; }
  .hero-main-card { min-height: 460px; }
  .category-layout { grid-template-columns: 1fr; }
  .latest-layout { grid-template-columns: 1fr; }
  .about-grid { grid-template-columns: 1fr; }
  .admin-layout { grid-template-columns: 1fr; }
  .admin-side { border-right: 0; border-bottom: 1px solid var(--border); padding: 0 0 14px; display: flex; flex-wrap: wrap; gap: 4px; }
  .admin-side .side-user { width: 100%; }
  .side-user { padding-bottom: 10px; }
  .admin-nav-item { width: auto; }
}
@media (max-width: 820px) {
  .home-hero { padding-top: 26px; }
  .hero-main-card { min-height: 400px; }
  .hero-main-body { padding: 28px 24px; }
  .hero-main-body h1 { font-size: clamp(28px, 7vw, 42px); }
  .hero-side-2 { padding: 20px; }
  .latest-list { padding: 16px 20px; }
  .category-head { display: block; }
  .category-head .view-all { display: inline-block; margin-top: 14px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pts-grid { grid-template-columns: 1fr; }
  .notice-grid { grid-template-columns: 1fr; }
  .ai-workspace { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .ai-config-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  :root, html[data-theme="light"], html[data-theme="dark"] { --gutter: 18px; }
  body { font-size: 15.5px; }
  .brand-name { font-size: 18px; }
  .header-inner { height: 64px; }
  .hero-main-card { min-height: 360px; }
  .hero-main-body h1 { font-size: 28px; }
  .hero-main-body p { font-size: 14px; }
  .hero-side-item { grid-template-columns: 84px minmax(0, 1fr); }
  .latest-item { grid-template-columns: minmax(0, 1fr) 78px; }
  .latest-lead .card-body { padding: 20px; }
  .about-points { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; gap: 26px; }
  .article-head h1 { font-size: 28px; }
  .prose { font-size: 16px; line-height: 1.9; }
  .article-hero { aspect-ratio: 4 / 3; }
  .pts-history li { grid-template-columns: 1fr auto; }
  .pts-history .ph-date { grid-column: 1 / -1; }
  .stat-grid { grid-template-columns: 1fr; }
  .admin-side { display: block; }
  .admin-nav-item { width: 100%; }
  .notice-hero { padding: 24px; }
}

/* ============================================================
   INFOLD UI 3.0 — NVIDIA-style enterprise news system
   Square geometry, 1px hairline grid, opaque surfaces, no glow,
   no gradients on chrome, green reserved for accent/labels/CTAs.
   Appended last so it wins over the legacy layer at equal specificity.
   ============================================================ */
html[data-theme="dark"] {
  --bg: #101114; --bg-soft: #17191D; --card: #202329; --card-hover: #24272E;
  --text: #F5F5F5; --muted: #A5A8AE; --faint: #7C8188; --border: #34373D;
  --primary: #83C441; --primary-2: #6EAA35; --on-primary: #0C0D0F;
  --primary-soft: rgba(131, 196, 65, .12);
  --header-bg: #101114; --footer-bg: #0B0C0E; --footer-text: #A5A8AE;
  --shadow: none; --shadow-lg: 0 28px 70px rgba(0, 0, 0, .6); --glow: none;
  --hero-grad: #17191D; --skeleton-from: #1B1E23; --skeleton-to: #24272E;
}
html[data-theme="light"] {
  --bg: #FFFFFF; --bg-soft: #F4F5F2; --card: #FFFFFF; --card-hover: #FAFBF8;
  --text: #17191B; --muted: #666B70; --faint: #8A9089; --border: #E1E4DF;
  --primary: #6EAA35; --primary-2: #4F7D24; --on-primary: #FFFFFF;
  --primary-soft: rgba(110, 170, 53, .12);
  --header-bg: #FFFFFF; --footer-bg: #101114; --footer-text: #A5A8AE;
  --shadow: none; --shadow-lg: 0 28px 70px rgba(23, 25, 27, .16); --glow: none;
  --hero-grad: #17191D; --skeleton-from: #EFF1EC; --skeleton-to: #E4E7E1;
}
:root {
  --header-h: 106px;
  --radius: 0px; --radius-sm: 0px;
  --maxw: 1560px;
  --gutter: clamp(20px, 3.2vw, 52px);
  --content-maxw: calc(var(--maxw) - 2 * var(--gutter));
}
*, *::before, *::after { border-radius: 0; }
body { background: var(--bg); background-image: none; color: var(--text); font-size: 16px; line-height: 1.6; }
h1, h2, h3, h4 { letter-spacing: -.025em; color: var(--text); }
section { margin: 0; }
.container { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- header: utility strip + solid enterprise bar ---------- */
.site-header { background: var(--header-bg) !important; border-bottom: 1px solid var(--border); box-shadow: none !important; }
.site-header::after { display: none; }
.util-bar { border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.util-inner { display: flex; align-items: center; gap: 12px; height: 34px; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.util-mark { width: 6px; height: 6px; background: var(--primary); flex-shrink: 0; }
.util-links { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.util-links a { color: var(--faint); text-transform: uppercase; letter-spacing: .14em; font-size: 10px; font-weight: 800; }
.util-links a:hover { color: var(--primary); }
.header-inner { display: flex; align-items: center; gap: 28px; height: calc(var(--header-h) - 34px); }
.brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); flex-shrink: 0; }
.brand svg { filter: none; }
.brand-name { font-size: 22px; font-weight: 800; letter-spacing: .18em; color: var(--text); background: none; -webkit-text-fill-color: currentColor; }
.main-nav { display: flex; align-items: stretch; align-self: stretch; gap: 0; margin-left: 4px; }
.main-nav .nav-link { display: inline-flex; align-items: center; height: 100%; padding: 0 14px; border: 0; border-radius: 0; background: none; box-shadow: inset 0 -2px 0 transparent; color: var(--muted); font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.main-nav .nav-link:hover { background: var(--bg-soft); color: var(--text); box-shadow: inset 0 -2px 0 var(--primary); }
.main-nav .nav-link.active { color: var(--primary); box-shadow: inset 0 -2px 0 var(--primary); }
.header-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.icon-btn { width: 40px; height: 40px; border: 1px solid transparent; border-radius: 0; background: transparent; color: var(--muted); box-shadow: none; font-size: 15px; }
.icon-btn:hover { background: var(--bg-soft); border-color: var(--border); color: var(--primary); transform: none; box-shadow: none; }
.icon-btn:active { transform: none; }
.lang-switch { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: 0; padding: 0; background: transparent; }
.lang-switch button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: 7px 9px; font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.lang-switch button.active { background: var(--primary); color: var(--on-primary); }
.lang-switch .sep { display: none; }
.dropdown-menu { background: var(--card); border: 1px solid var(--border); border-radius: 0; box-shadow: var(--shadow-lg); padding: 0; min-width: 260px; }
.dropdown-menu a { border-radius: 0; border-bottom: 1px solid var(--border); padding: 11px 16px; font-size: 13px; font-weight: 700; color: var(--text); }
.dropdown-menu a:last-child { border-bottom: 0; }
.dropdown-menu a:hover { background: var(--bg-soft); color: var(--primary); }
.dropdown-menu a .cnt { color: var(--faint); font-size: 10.5px; letter-spacing: .06em; }
.search-bar { background: var(--header-bg); border-top: 1px solid var(--border); padding: 16px 0 20px; }
.search-bar .search-form { display: flex; gap: 8px; }
.mobile-menu { background: var(--header-bg); border-top: 1px solid var(--border); padding: 14px var(--gutter) 22px; }
.mobile-menu .nav-link { border-radius: 0; text-transform: none; letter-spacing: 0; font-size: 14px; }
.mm-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mm-cats .nav-link { width: auto; border: 1px solid var(--border); padding: 8px 13px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- buttons / badges / chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border: 1px solid transparent; border-radius: 0; box-shadow: none; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; line-height: 1.2; text-transform: uppercase; transition: background .15s ease, color .15s ease, border-color .15s ease; }
.btn:hover { transform: none; box-shadow: none; }
.btn:active { transform: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-2); box-shadow: none; }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); box-shadow: none; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 8px 13px; font-size: 10.5px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--border); background: var(--bg-soft) !important; color: var(--muted) !important; font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.badge-primary, .badge-ok { background: var(--primary) !important; border-color: var(--primary) !important; color: var(--on-primary) !important; }
.badge-neutral { background: var(--bg-soft) !important; color: var(--faint) !important; }
.badge-it, .badge-ai, .badge-windows, .badge-android, .badge-apple, .badge-web, .badge-programming, .badge-other { background: var(--primary-soft) !important; border-color: color-mix(in srgb, var(--primary) 40%, var(--border)) !important; color: var(--primary) !important; }
.chip-row { display: flex; flex-wrap: wrap; gap: 0; margin: 0; border: 1px solid var(--border); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-right: 1px solid var(--border); border-radius: 0; background: var(--card); color: var(--muted); box-shadow: none; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.chip:last-child { border-right: 0; }
.chip:hover { background: var(--bg-soft); color: var(--primary); transform: none; box-shadow: none; }
.chip .cnt { color: var(--faint); font-size: 10px; }
.filter-pills { display: flex; flex-wrap: wrap; gap: 0; margin-top: 22px; border: 1px solid var(--border); }
.filter-pill { padding: 10px 16px; border: 0; border-right: 1px solid var(--border); border-radius: 0; background: var(--card); color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.filter-pill:last-child { border-right: 0; }
.filter-pill:hover { background: var(--bg-soft); color: var(--primary); border-color: var(--border); }
.filter-pill.active { background: var(--primary); color: var(--on-primary); }

/* ---------- home hero: full-bleed, image-forward ---------- */
.home-hero { padding: 0; margin: 0; border-bottom: 1px solid var(--border); }
.home-hero > .container { max-width: none; padding: 0; }
.hero-main { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(340px, 1fr); gap: 1px; background: var(--border); border: 0; }
.hero-main-card { position: relative; display: flex; align-items: flex-end; min-height: 600px; overflow: hidden; background: #121417; color: #fff; }
.hero-main-card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.hero-main-card:hover > img { transform: scale(1.03); }
.hero-main-card:hover { transform: none; box-shadow: none; border-color: transparent; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 11, 13, .12) 0%, rgba(10, 11, 13, .55) 45%, rgba(10, 11, 13, .95) 100%); pointer-events: none; }
.hero-main-body { position: relative; z-index: 2; padding: clamp(28px, 4.4vw, 72px); max-width: 920px; }
.hero-kicker { margin-bottom: 18px; color: var(--primary); font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.hero-main-body h1 { margin: 0 0 18px; color: #fff; font-size: clamp(30px, 4vw, 60px); font-weight: 800; line-height: 1.05; letter-spacing: -.03em; }
.hero-main-body p { margin: 0 0 22px; max-width: 700px; color: #C9CDC6; font-size: 15px; line-height: 1.75; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #A9AEA6; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.hero-actions .btn { pointer-events: none; }
.hero-side-2 { display: flex; flex-direction: column; background: var(--bg-soft); padding: 0; }
.hero-side-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.hero-side-head a { color: var(--primary); }
.hero-side-list { display: flex; flex-direction: column; flex: 1; }
.hero-side-item { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--border); color: var(--text); }
.hero-side-item:last-child { border-bottom: 0; }
.hero-side-thumb { aspect-ratio: 16 / 10; overflow: hidden; background: var(--card); border: 1px solid var(--border); }
.hero-side-thumb img { width: 100%; height: 100%; object-fit: cover; }
.hero-side-item h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; line-height: 1.5; }
.hero-side-item time { color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.hero-side-item:hover { background: var(--card); }
.hero-side-item:hover h3 { color: var(--primary); }

/* ---------- section rhythm ---------- */
.section { margin: 0; padding: 64px 0; border-bottom: 1px solid var(--border); }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 0 0 28px; padding: 0; border: 0; }
.section-title { display: block; margin: 0; font-size: clamp(26px, 3vw, 42px); font-weight: 800; line-height: 1.04; letter-spacing: -.03em; }
.section-title::before { display: none; }
.view-all { color: var(--primary); font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.view-all:hover { color: var(--primary-2); }
.category-kicker { margin-bottom: 10px; color: var(--primary); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }

/* ---------- hairline grid + cards ---------- */
.grid { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4, .auto-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.article-card { display: flex; flex-direction: column; background: var(--card); border: 0; overflow: hidden; color: var(--text); box-shadow: none; text-decoration: none; transition: background .15s ease; }
.article-card:hover { background: var(--card-hover); border-color: transparent; box-shadow: none; transform: none; }
.article-card::before { display: none; }
.thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg-soft); border-bottom: 1px solid var(--border); }
.thumb img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
.thumb img.img-fail { opacity: 0; }
.thumb::before { display: none; }
.thumb::after { content: 'INFOLD'; position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 10.5px; font-weight: 800; letter-spacing: .42em; text-indent: .42em; }
.card-body { display: flex; flex-direction: column; gap: 10px; flex: 1; padding: 20px 22px 24px; }
.card-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.45; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-desc { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.article-card:hover .card-title { color: var(--primary); }

/* ---------- latest news ---------- */
.latest-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, .85fr); gap: 1px; border: 1px solid var(--border); background: var(--border); }
.latest-lead { display: flex; flex-direction: column; background: var(--card); }
.latest-lead .thumb { aspect-ratio: 16 / 8; }
.latest-lead .card-body { padding: 26px 28px 30px; gap: 12px; }
.latest-lead .card-title { font-size: clamp(22px, 2.3vw, 32px); line-height: 1.2; }
.latest-list { display: flex; flex-direction: column; flex: 1; background: var(--bg-soft); padding: 0; }
.latest-item { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border); color: var(--text); }
.latest-item:last-child { border-bottom: 0; }
.latest-item h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; line-height: 1.5; }
.latest-item time { color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.latest-item .thumb { aspect-ratio: 1 / 1; border-bottom: 0; }
.latest-item:hover { background: var(--card); }
.latest-item:hover h3 { color: var(--primary); }

/* ---------- category rail + category sections ---------- */
.cat-rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.cat-tile { position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 132px; padding: 22px 24px; background: var(--card); color: var(--text); text-decoration: none; }
.cat-tile-name { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.cat-tile-count { color: var(--faint); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.cat-tile-arrow { position: absolute; right: 22px; bottom: 18px; color: var(--primary); font-size: 18px; line-height: 1; }
.cat-tile:hover { background: var(--bg-soft); }
.cat-tile:hover .cat-tile-name { color: var(--primary); }
.category-block { padding: 64px 0; border-top: 0; border-bottom: 1px solid var(--border); background: var(--bg); }
.category-block.alt { background: var(--bg-soft); }
.category-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin: 0 0 28px; }
.category-title { margin: 0; font-size: clamp(30px, 3.6vw, 52px); font-weight: 800; line-height: 1; letter-spacing: -.035em; }
.category-desc { margin: 10px 0 0; max-width: 620px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.category-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .9fr); gap: 1px; border: 1px solid var(--border); background: var(--border); }
.category-main { background: var(--card); }
.category-main .article-card { border: 0; }
.category-main .card-title { font-size: clamp(20px, 2.2vw, 28px); }
.category-side { display: flex; flex-direction: column; flex: 1; background: var(--bg-soft); }
.category-side .latest-item { grid-template-columns: minmax(0, 1fr) 84px; }
.category-empty { padding: 24px; color: var(--muted); font-size: 13px; }

/* ---------- about: dark band ---------- */
.about-infolf { margin: 0; padding: clamp(56px, 7vw, 96px) 0; background: #0B0C0E; color: #F5F5F5; border-top: 1px solid #34373D; }
.about-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(30px, 6vw, 88px); align-items: start; }
.about-title { margin: 0; font-size: clamp(30px, 4vw, 52px); font-weight: 800; line-height: 1.04; letter-spacing: -.03em; color: #F5F5F5; }
.about-title span { color: #83C441; }
.about-body { color: #B9BDB5; font-size: 14.5px; line-height: 1.9; }
.about-body p { margin: 0 0 18px; }
.about-points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-top: 28px; border: 1px solid #34373D; background: #34373D; }
.about-point { padding: 20px; background: #17191D; }
.about-point b { display: block; margin-bottom: 8px; color: #83C441; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.about-point span { color: #D5D8D0; font-size: 12.5px; line-height: 1.6; }

/* ---------- article detail ---------- */
.article-page { padding: 0 0 64px; border-bottom: 1px solid var(--border); }
.article-page > article { max-width: 1240px; margin: 0 auto; }
.article-hero { position: relative; width: 100%; max-width: none; max-height: 640px; aspect-ratio: 21 / 9; margin: 0; overflow: hidden; background: var(--bg-soft); border: 0; border-bottom: 1px solid var(--border); box-shadow: none; }
.article-hero img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
.article-hero::after { content: 'INFOLD'; position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px; font-weight: 800; letter-spacing: .5em; text-indent: .5em; }
.article-head { max-width: 820px; margin: 44px auto 0; }
.back-link { display: inline-block; margin-bottom: 20px; color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.back-link:hover { color: var(--primary); }
.article-head .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.article-head h1 { margin: 0 0 18px; font-size: clamp(28px, 3.6vw, 50px); font-weight: 800; line-height: 1.14; letter-spacing: -.03em; }
.article-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.article-head .meta strong { color: var(--text); font-weight: 700; letter-spacing: 0; text-transform: none; }
.article-head .meta .sep { width: 1px; height: 12px; background: var(--border); border: 0; }
.prose { max-width: 760px; margin: 44px auto 0; color: var(--text); font-size: 17.5px; line-height: 1.95; letter-spacing: .002em; }
.prose p { margin: 0 0 1.6em; }
.prose h2 { margin: 2.2em 0 .7em; padding: 0 0 0 16px; border-left: 3px solid var(--primary); border-bottom: 0; font-size: clamp(21px, 2.3vw, 27px); font-weight: 800; line-height: 1.4; }
.prose h3 { margin: 2em 0 .6em; font-size: 20px; line-height: 1.45; }
.prose ul, .prose ol { margin: 0 0 1.6em; padding-left: 1.3em; }
.prose li { margin: 0 0 .5em; }
.prose blockquote { margin: 2em 0; padding: 20px 24px; border-left: 3px solid var(--primary); background: var(--bg-soft); color: var(--muted); }
.prose a { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
.prose img { margin: 2em auto; border: 1px solid var(--border); }
.prose code { padding: 2px 5px; border: 1px solid var(--border); background: var(--bg-soft); font-family: var(--mono); font-size: .9em; }
.prose pre { padding: 18px; border: 1px solid var(--border); background: var(--bg-soft); overflow-x: auto; }
.source-box { max-width: 760px; margin: 40px auto 0; padding: 16px 20px; background: var(--bg-soft); border: 1px solid var(--border); border-left: 3px solid var(--primary); box-shadow: none; }
.source-box .src-label { color: var(--faint); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.source-box .src-name { color: var(--text); font-weight: 700; font-size: 14px; }
.source-box .src-link { margin-left: auto; }
.points-note { max-width: 760px; margin: 22px auto 0; padding: 16px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid var(--border); background: var(--card); }
.points-note strong { color: var(--primary); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
.points-note .pn-text { flex: 1; min-width: 220px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.related { max-width: 1240px; margin: 64px auto 0; }
.link-card { margin: 0 0 1.6em; overflow: hidden; border: 1px solid var(--border); background: var(--card); box-shadow: none; }
.link-card:hover { border-color: var(--primary); box-shadow: none; transform: none; }
.link-card a { display: flex; color: inherit; text-decoration: none; }
.link-card-thumb { width: 190px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); background: var(--bg-soft); background-size: cover; background-position: center; }
.link-card-body { flex: 1; min-width: 0; padding: 16px 20px; }
.link-card-host { color: var(--primary); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.link-card-title { margin: 4px 0 6px; color: var(--text); font-size: 15px; font-weight: 700; line-height: 1.5; }
.link-card-desc { color: var(--muted); font-size: 12.5px; line-height: 1.6; }

/* ---------- list / search pages ---------- */
.page { padding: 0 0 64px; }
.page-head { margin: 0 0 28px; padding: 56px 0 24px; border-bottom: 1px solid var(--border); }
.page-title { margin: 0; font-size: clamp(32px, 5vw, 64px); font-weight: 800; line-height: 1; letter-spacing: -.035em; }
.page-sub { margin: 14px 0 0; max-width: 720px; color: var(--muted); font-size: 13.5px; }
.load-more-wrap { display: flex; justify-content: center; margin-top: 32px; }
.search-page .search-form { display: flex; gap: 0; max-width: 760px; margin: 26px 0 0; border: 1px solid var(--border); }
.search-page .search-input, .search-page .search-form .input { height: 56px; border: 0; background: var(--card); padding: 0 18px; font-size: 16px; }
.search-page .search-form .btn { height: 56px; border-radius: 0; padding: 0 30px; }
.search-page .search-head { display: flex; flex-direction: column; gap: 4px; }
.result-count { margin: 26px 0 18px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.result-count strong { color: var(--text); }

/* ---------- forms ---------- */
.search-input, .input, textarea.input, select.input { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 11px 14px; font-size: 14px; box-shadow: none; }
.search-input:focus, .input:focus { outline: none; border-color: var(--primary); box-shadow: none; background: var(--card); }
.field { display: block; margin-bottom: 16px; color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.field .input, .field input, .field textarea, .field select { display: block; width: 100%; margin-top: 6px; color: var(--text); font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.field .req { color: var(--danger); }
.hint { color: var(--faint); font-size: 11.5px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.form-card { padding: 0; border: 0; background: transparent; box-shadow: none; }
.form-error { display: none; margin-bottom: 14px; padding: 10px 14px; border-left: 3px solid var(--danger); background: var(--danger-soft); color: var(--danger); font-size: 12.5px; font-weight: 700; }
.form-error.show { display: block; }
.form-footer { margin-top: 18px; text-align: center; font-size: 12px; }
.radio-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.radio-pills label { padding: 8px 12px; border: 1px solid var(--border); font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.radio-pills label:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.switch-row { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; cursor: pointer; }
.switch-row input { width: 16px; height: 16px; accent-color: var(--primary); }
.switch-ui { display: none; }
.drop-zone { padding: 20px; border: 1px dashed var(--border); color: var(--muted); font-size: 12px; text-align: center; cursor: pointer; }
.drop-zone:hover, .drop-zone.drag { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.thumb-box { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 21 / 9; overflow: hidden; border: 1px dashed var(--border); background: var(--bg-soft); }
.thumb-box img { width: 100%; height: 100%; object-fit: cover; }
.thumb-ph { color: var(--faint); font-size: 11px; font-weight: 800; letter-spacing: .3em; }
.source-details { padding: 4px 14px; border: 1px solid var(--border); background: var(--bg-soft); }
.source-details summary { padding: 10px 0; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.form-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; }
.form-main, .form-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.dt-row { display: flex; gap: 8px; }

/* ---------- login / account / points ---------- */
.login-wrap { display: flex; align-items: center; justify-content: center; padding: 64px var(--gutter); min-height: calc(100vh - var(--header-h)); }
.login-card { width: 100%; max-width: 460px; margin: 0 auto; padding: 36px; border: 1px solid var(--border); background: var(--card); box-shadow: none; }
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.login-card h1 { margin: 0; font-size: 26px; font-weight: 800; }
.login-sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.acc-tabs { display: flex; margin: 22px 0; border: 1px solid var(--border); }
.acc-tabs button { flex: 1; padding: 12px; border: 0; border-right: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.acc-tabs button:last-child { border-right: 0; }
.acc-tabs button.active { background: var(--primary); color: var(--on-primary); border-bottom: 0; }
.pts-wrap { display: flex; flex-direction: column; gap: 1px; max-width: 1180px; margin: 0 auto; padding: 56px 0 64px; background: var(--border); }
.pts-hero { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 34px 36px; border: 0; border-left: 4px solid var(--primary); background: #17191D; color: #F5F5F5; box-shadow: none; }
.pts-hero::after { display: none; }
.pts-balance-label { color: #A5A8AE; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.pts-balance { color: #83C441; font-size: clamp(40px, 6vw, 68px); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.pts-balance small { margin-left: 8px; color: #A5A8AE; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.pts-status { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; color: #C9CDC6; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.pts-status .pts-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
.pts-chip.on { border: 1px solid rgba(131, 196, 65, .45); background: rgba(131, 196, 65, .16); color: #83C441; }
.pts-chip.off { border: 1px solid #34373D; background: transparent; color: #A5A8AE; }
.pts-remaining { color: #A5A8AE; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: none; }
.pts-card { padding: 28px 32px; border: 0; background: var(--card); box-shadow: none; }
.pts-card h2 { margin: 0 0 14px; font-size: 17px; font-weight: 800; }
.pts-card p { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.pts-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-top: 18px; border: 1px solid var(--border); background: var(--border); }
.pts-plan { display: flex; flex-direction: column; gap: 10px; padding: 22px; border: 0; background: var(--card); box-shadow: none; }
.pts-plan:hover { background: var(--bg-soft); border-color: transparent; box-shadow: none; transform: none; }
.pp-name { color: var(--text); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.pp-points { color: var(--primary); font-size: 30px; font-weight: 800; line-height: 1; }
.pp-points small { color: var(--muted); font-size: 10px; letter-spacing: .1em; }
.pp-dur { color: var(--muted); font-size: 12px; }
.pts-history { list-style: none; margin: 0; padding: 0; }
.pts-history li { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.pts-history li:last-child { border-bottom: 0; }
.ph-amount.pos { color: var(--primary); font-weight: 800; }
.ph-amount.neg { color: var(--danger); font-weight: 800; }
.ph-reason { color: var(--text); font-weight: 600; }
.ph-date { color: var(--faint); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.pts-empty { padding: 26px 0; color: var(--faint); font-size: 12.5px; text-align: center; }
.pts-login { padding: 64px 20px; text-align: center; }
.read-notice { border: 1px solid var(--border); border-left: 3px solid var(--primary); background: var(--card); box-shadow: var(--shadow-lg); color: var(--text); font-size: 12.5px; font-weight: 700; }
.read-notice .rn-plus { color: var(--primary); font-weight: 800; }

/* ---------- notifications ---------- */
.notice-page { max-width: 1180px; margin: 0 auto; padding: 56px 0 64px; }
.notice-hero { margin-bottom: 1px; padding: 36px; border-left: 4px solid var(--primary); background: #17191D; color: #F5F5F5; }
.notice-hero h1 { margin: 0 0 10px; font-size: clamp(30px, 4vw, 48px); font-weight: 800; letter-spacing: -.03em; }
.notice-hero p { margin: 0; color: #B9BDB5; font-size: 13.5px; }
.notice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--border); background: var(--border); }
.notice-card { padding: 26px 28px; border: 1px solid var(--border); background: var(--card); }
.notice-grid .notice-card { border: 0; }
.notice-card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.notice-state { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
.notice-state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.notice-state.on { color: var(--text); }
.notice-state.on .dot { background: var(--primary); }
.notice-list { list-style: none; margin: 0; padding: 0; }
.notice-list li { padding: 12px 0; border-bottom: 1px solid var(--border); }
.notice-list li:last-child { border-bottom: 0; }
.notice-list a { color: var(--text); font-size: 13.5px; font-weight: 700; }
.notice-list a:hover { color: var(--primary); }
.notice-list time { display: block; margin-top: 5px; color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }

/* ---------- admin ---------- */
.admin-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 1px; align-items: stretch; padding: 0; border-top: 1px solid var(--border); background: var(--border); }
.admin-side { position: static; display: block; padding: 20px 0; border: 0; border-right: 1px solid var(--border); background: var(--bg-soft); box-shadow: none; }
.admin-side .side-user { margin: 0 0 12px; padding: 0 20px 18px; border-bottom: 1px solid var(--border); }
.admin-side .side-user b { display: block; color: var(--text); font-size: 13px; }
.admin-side .side-user span { display: block; color: var(--faint); font-size: 11px; word-break: break-all; }
.admin-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 20px; border: 0; border-left: 2px solid transparent; background: none; color: var(--muted); font-size: 12.5px; font-weight: 700; text-align: left; }
.admin-nav-item:hover { background: var(--card); color: var(--text); }
.admin-nav-item.active { background: var(--card); color: var(--primary); border-left-color: var(--primary); }
.admin-content { min-width: 0; padding: 36px var(--gutter) 64px; background: var(--bg); }
.admin-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 24px; }
.admin-head h1 { margin: 0; font-size: clamp(24px, 3vw, 38px); font-weight: 800; letter-spacing: -.03em; }
.admin-head .spacer { flex: 1; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-bottom: 24px; border: 1px solid var(--border); background: var(--border); }
.stat-card { position: relative; padding: 22px; border: 0; background: var(--card); box-shadow: none; }
.stat-card:hover { border-color: transparent; box-shadow: none; transform: none; }
.stat-card .stat-icon { position: static; margin-bottom: 10px; font-size: 16px; opacity: .8; }
.stat-card .stat-num { color: var(--text); font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.stat-card .stat-label { margin-top: 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.panel { margin: 0 0 1px; padding: 26px 28px; border: 1px solid var(--border); background: var(--card); box-shadow: none; }
.panel h2 { margin: 0 0 18px; font-size: 16px; font-weight: 800; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); }
.data-table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px; }
.data-table th { padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg-soft); color: var(--muted); font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; text-align: left; white-space: nowrap; }
.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: var(--bg-soft); }
.td-title { min-width: 220px; color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
.td-thumb { width: 64px; height: 42px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-soft); }
.td-thumb img { width: 100%; height: 100%; object-fit: cover; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--border); background: transparent; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.status-chip .sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-published, .status-success { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
.status-draft, .status-pending, .status-retrying { color: var(--warn); }
.status-failed { color: var(--danger); }
.info-list { margin-top: 18px; border-top: 1px solid var(--border); }
.info-item { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.info-item .k { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.info-item .v { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text); font-weight: 700; }
.info-item .v .small { color: var(--muted); font-size: 11px; font-weight: 600; }
.automation-banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px; border: 1px solid var(--border); background: var(--bg-soft); }
.automation-banner .msg { flex: 1; min-width: 200px; color: var(--muted); font-size: 12.5px; }

/* ---------- AI studio ---------- */
.ai-config-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.ai-config-grid .field { margin: 0; }
.ai-config-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.ai-test-result { padding: 8px 10px; border: 1px solid var(--border); background: var(--bg-soft); color: var(--muted); font-size: 11.5px; }
.ai-test-result.ok { border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); color: var(--primary); }
.ai-test-result.err { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); color: var(--danger); }
.ai-workspace { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .85fr); gap: 1px; border: 1px solid var(--border); background: var(--border); }
.ai-news-list { max-height: 600px; overflow: auto; border: 0; background: var(--card); }
.ai-news-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.ai-news-item:last-child { border-bottom: 0; }
.ai-news-item:hover { background: var(--bg-soft); }
.ai-news-item.is-selected { background: var(--primary-soft); }
.ai-news-item h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; line-height: 1.5; }
.ai-news-meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--faint); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.ai-news-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ai-preview { min-height: 300px; padding: 26px; border: 0; background: var(--bg-soft); }
.ai-preview h2 { margin: 0 0 10px; font-size: 21px; font-weight: 800; line-height: 1.3; }
.ai-preview .lead { color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.ai-preview .preview-body { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.8; }
.ai-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
.ai-empty { padding: 50px 20px; color: var(--muted); font-size: 13px; text-align: center; }
.ai-history { max-height: 540px; overflow: auto; }

/* ---------- footer ---------- */
.site-footer { margin-top: auto; padding: 56px 0 24px; border-top: 1px solid #34373D; background: #0B0C0E; color: #A5A8AE; box-shadow: none; }
.footer-grid { display: grid; grid-template-columns: 1.5fr .8fr .8fr; gap: 44px; padding: 0 0 36px; }
.footer-brand { margin-bottom: 16px; color: #F5F5F5; }
.footer-brand .brand-name { color: #F5F5F5; -webkit-text-fill-color: currentColor; font-size: 20px; letter-spacing: .18em; }
.footer-about { margin: 0; max-width: 420px; color: #A5A8AE; font-size: 13px; line-height: 1.75; }
.footer-col h4 { margin: 0 0 14px; color: #F5F5F5; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.footer-col ul { list-style: none; margin: 0; padding: 0; }
.footer-col li { margin-bottom: 9px; }
.footer-col a { color: #A5A8AE; font-size: 13px; }
.footer-col a:hover { color: #83C441; }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 0; padding-top: 18px; border-top: 1px solid #262A2E; color: #7C8188; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.foot-links { display: flex; gap: 16px; }
.foot-links a { color: #A5A8AE; }
.foot-links a:hover { color: #F5F5F5; }

/* ---------- modal / toast / states / skeletons ---------- */
.modal-backdrop { background: rgba(8, 9, 11, .74); }
.modal { width: 100%; max-width: 440px; padding: 28px; border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-lg); }
.modal-title { margin: 0 0 10px; font-size: 18px; font-weight: 800; }
.modal-message { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
.toast-root { top: 84px; right: 18px; }
.toast { max-width: 360px; min-width: 240px; padding: 13px 16px; border: 1px solid var(--border); border-left: 3px solid var(--primary); background: var(--card); box-shadow: var(--shadow-lg); color: var(--text); font-size: 12.5px; font-weight: 600; }
.toast::before { display: none; }
.toast-success { border-left-color: var(--ok); }
.toast-error { border-left-color: var(--danger); }
.toast-warn { border-left-color: var(--warn); }
.state-box { padding: 72px 20px; color: var(--muted); }
.state-icon { font-size: 30px; }
.state-box h3 { color: var(--text); font-size: 16px; font-weight: 800; }
.state-box p { font-size: 13px; }
.sk-card { border: 1px solid var(--border); background: var(--card); }
.skeleton { border-radius: 0; background: var(--skeleton-from); }
.sk-hero, .sk-side { border: 1px solid var(--border); }
.offline-banner { border-bottom: 1px solid var(--border); background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 700; letter-spacing: .02em; }

/* ---------- AIChat panel: solid, square ---------- */
.aichat-fab { border: 1px solid var(--primary); border-radius: 0; background: var(--primary); color: var(--on-primary); box-shadow: none; }
.aichat-fab:hover { transform: none; box-shadow: none; background: var(--primary-2); }
.aichat-backdrop { background: rgba(8, 9, 11, .6); }
.aichat-panel { border: 1px solid var(--border); border-radius: 0; background: var(--card); box-shadow: var(--shadow-lg); }
.aichat-head { border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.aichat-logo { border-radius: 0; background: var(--primary); color: var(--on-primary); box-shadow: none; }
.aichat-close, .aichat-model-sel { border: 1px solid var(--border); border-radius: 0; background: var(--card); color: var(--muted); }
.aichat-close:hover, .aichat-model-sel:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); transform: none; }
.aichat-progress { border-bottom: 1px solid var(--border); }
.aichat-progress-bar { background: var(--primary); }
.aichat-msg.is-ai .aichat-bubble { border: 1px solid var(--border); border-radius: 0; background: var(--bg-soft); }
.aichat-msg.is-user .aichat-bubble { border-radius: 0; background: var(--primary); color: var(--on-primary); }
.aichat-form textarea { border: 1px solid var(--border); border-radius: 0; background: var(--bg); }
.aichat-send { border-radius: 0; background: var(--primary); color: var(--on-primary); box-shadow: none; }
.aichat-send:hover:not(:disabled) { transform: none; box-shadow: none; background: var(--primary-2); }
.aichat-dl-card { border: 1px solid var(--border); border-radius: 0; background: var(--card); box-shadow: var(--shadow-lg); }
.aichat-foot { border-top: 1px solid var(--border); }

/* ---------- responsive: dedicated layouts, not a shrunken desktop ---------- */
@media (max-width: 1240px) {
  .main-nav .nav-link { padding: 0 10px; font-size: 10.5px; letter-spacing: .06em; }
  .header-inner { gap: 18px; }
  .grid-4, .auto-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cat-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1080px) {
  :root { --header-h: 96px; }
  .main-nav { display: none; }
  .hamburger { display: inline-flex; }
  .hero-main { grid-template-columns: 1fr; }
  .hero-main-card { min-height: 460px; }
  .latest-layout, .category-layout, .notice-grid { grid-template-columns: 1fr; }
  .about-grid { grid-template-columns: 1fr; }
  .admin-layout { grid-template-columns: 1fr; }
  .admin-side { display: flex; flex-wrap: wrap; padding: 12px; border-right: 0; border-bottom: 1px solid var(--border); }
  .admin-side .side-user { width: 100%; padding: 0 8px 10px; margin-bottom: 8px; }
  .admin-nav-item { width: auto; padding: 8px 12px; border-left: 0; border-bottom: 2px solid transparent; font-size: 11px; }
  .admin-nav-item.active { border-bottom-color: var(--primary); }
  .admin-content { padding: 28px var(--gutter) 56px; }
  .grid-2, .grid-3, .grid-4, .auto-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cat-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ai-workspace, .ai-config-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  :root { --header-h: 72px; --gutter: 18px; }
  html { scroll-padding-top: 72px; }
  .util-bar { display: none; }
  .header-inner { height: 72px; gap: 12px; }
  .brand-name { font-size: 18px; letter-spacing: .14em; }
  .header-actions { gap: 2px; }
  .header-actions .lang-switch { display: none; }
  .hero-main-card { min-height: 380px; }
  .hero-main-body { padding: 24px; }
  .hero-main-body h1 { font-size: clamp(24px, 7vw, 34px); }
  .hero-main-body p { font-size: 14px; -webkit-line-clamp: 4; }
  .hero-side-item { grid-template-columns: 92px minmax(0, 1fr); padding: 14px 18px; }
  .section, .category-block { padding: 44px 0; }
  .section-head { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
  .category-head { flex-direction: column; align-items: flex-start; gap: 10px; }
  .latest-item { grid-template-columns: minmax(0, 1fr) 80px; padding: 14px 16px; }
  .grid-2, .grid-3, .grid-4, .auto-grid, .cat-rail, .notice-grid, .pts-grid { grid-template-columns: 1fr; }
  .card-body { padding: 16px 18px 20px; }
  .card-title { font-size: 16px; }
  .article-hero { aspect-ratio: 16 / 10; }
  .article-head { margin-top: 26px; }
  .prose { margin-top: 28px; font-size: 16.5px; line-height: 1.9; }
  .source-box, .points-note { padding: 14px 16px; }
  .source-box .src-link { margin-left: 0; }
  .related { margin-top: 44px; }
  .page-head { padding: 32px 0 18px; }
  .pts-wrap { padding: 32px 0 48px; }
  .pts-hero { padding: 26px; }
  .pts-status { align-items: flex-start; }
  .pts-card { padding: 22px; }
  .notice-page { padding: 32px 0 48px; }
  .notice-hero { padding: 24px; }
  .info-item { grid-template-columns: 1fr; gap: 6px; }
  .filter-pills, .chip-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filter-pills::-webkit-scrollbar, .chip-row::-webkit-scrollbar { display: none; }
  .filter-pill, .chip { flex-shrink: 0; border-right: 1px solid var(--border); }
  .toast-root { left: var(--gutter); right: var(--gutter); }
  .toast { max-width: none; }
  .login-wrap { padding: 36px var(--gutter); min-height: 0; }
  .login-card { padding: 24px; }
  .ai-news-item { grid-template-columns: 1fr; }
  .ai-news-actions { justify-content: flex-start; }
  .related .grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 430px) {
  .hero-main-card { min-height: 320px; }
  .hero-kicker { font-size: 9.5px; }
  .section-title { font-size: 24px; }
  .page-title { font-size: 30px; }
  .category-title { font-size: 28px; }
  .article-head h1 { font-size: 25px; }
  .prose { font-size: 16px; }
  .footer-grid { grid-template-columns: 1fr; gap: 28px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .pts-history li { grid-template-columns: 1fr auto; }
  .pts-history .ph-date { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-main-card > img { transition: none; }
}

/* ============================================================
   INFOLD UI 4.0 — Editorial grid system (Netflix x NVIDIA)
   ------------------------------------------------------------
   ねらい: 「大きさがそろっていない」状態をなくす。
   - 余白は 8pt スケール 1本（--sp-1..--sp-9）
   - 文字は 7 段のスケール 1 本（display / h1 / h2 / h3 / body / sm / label）
   - カードは 1 種類（16:9 画像 + 20px 余白 + 2行見出し + 下端メタ）
   - セクションは同じリズム（上余白 / 見出し / 24px / コンテンツ）
   - 罫線はすべて 1px（--border）だけ。角丸なし。
   ============================================================ */
:root {
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 88px;
  --section-pad: var(--sp-8);
  --header-h: 108px;
  --maxw: 1360px;
  --gutter: clamp(18px, 3.2vw, 48px);
  --fs-display: clamp(38px, 4.2vw, 62px);
  --fs-h1: clamp(30px, 3.2vw, 46px);
  --fs-h2: clamp(24px, 2.2vw, 34px);
  --fs-h3: 17px;
  --fs-body: 15.5px;
  --fs-sm: 13.5px;
  --fs-label: 10.5px;
}
body { font-size: var(--fs-body); line-height: 1.75; }
.container { max-width: var(--maxw); padding: 0 var(--gutter); }

/* ---------- 4.0b 左右の端を一本のラインに揃える ---------- */
/* ヒーローだけ画面端まで伸びていて、セクションの左端とズレていたのを解消 */
.home-hero > .container { max-width: var(--maxw); padding: 0 var(--gutter); }
.hero-main { border: 1px solid var(--border); }
.hero-main-body { padding: clamp(20px, 2.6vw, 40px); }
.hero-side-head { padding: var(--sp-4) var(--sp-5); }
.hero-side-item { padding: var(--sp-4) var(--sp-5); }
.footer-inner, .footer-top, .footer-bottom { padding-left: 0; padding-right: 0; }

/* ---------- 1. 文字スケール ---------- */
.hero-main-body h1 { font-size: var(--fs-display); line-height: 1.02; letter-spacing: -.035em; }
.article-head h1, .page-title, .login-card h1 { font-size: var(--fs-h1); line-height: 1.1; letter-spacing: -.03em; }
.section-title, .category-title, .notice-hero h1, .about-title, .admin-head h1 { font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -.028em; }
.card-title, .latest-lead .card-title, .category-main .card-title { font-size: var(--fs-h3); line-height: 1.42; letter-spacing: -.01em; }
.latest-lead .card-title { font-size: clamp(21px, 1.9vw, 27px); line-height: 1.24; }
.hero-side-item h3, .latest-item h3, .ai-news-item h3, .notice-list a, .link-card-title { font-size: 14px; line-height: 1.45; letter-spacing: -.005em; }
.card-desc, .category-desc, .page-sub, .about-body, .ai-preview .lead { font-size: var(--fs-sm); line-height: 1.7; }
.card-meta, .hero-meta, .hero-kicker, .category-kicker, .view-all, .cat-tile-count,
.hero-side-item time, .latest-item time, .result-count, .footer-bottom, .data-table th {
  font-size: var(--fs-label); font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
}
.card-meta, .hero-meta { font-variant-numeric: tabular-nums; }

/* ---------- 2. 余白リズム ---------- */
.section, .category-block, .article-page, .page, .notice-page, .pts-wrap { padding: var(--section-pad) 0; }
.section-head, .category-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); margin: 0 0 var(--sp-5); }
.category-kicker { margin-bottom: var(--sp-2); }
.section-sub { margin-top: var(--sp-5); }
.related { margin-top: var(--sp-7); }
.about-infolf { padding: var(--sp-9) 0; }
.admin-content { padding: var(--sp-7) var(--gutter) var(--sp-8); }

/* ---------- 3. カードモジュール（1種類に統一） ---------- */
.grid { display: grid; gap: 1px; border: 1px solid var(--border); background: var(--border); }
.article-card { height: 100%; }
.thumb, .latest-lead .thumb { aspect-ratio: 16 / 9; }
.card-body { display: flex; flex-direction: column; gap: var(--sp-2); flex: 1; padding: var(--sp-4) var(--sp-4) 18px; }
.card-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.badge { height: 22px; padding: 0 8px; font-size: 9.5px; letter-spacing: .1em; line-height: 1; }
.card-title { min-height: 2.84em; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-desc { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { margin-top: auto; padding-top: var(--sp-3); gap: var(--sp-2); }
.card-meta > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 4. ヒーロー（Netflix 型の大判 + NVIDIA 型の罫線グリッド） ---------- */
.hero-main { grid-template-columns: minmax(0, 1.7fr) minmax(340px, 1fr); }
.hero-main-card { min-height: clamp(430px, 38vw, 540px); }
.hero-main-body { padding: clamp(26px, 3.4vw, 56px); }
.hero-main-body h1 { margin: 0 0 var(--sp-4); }
.hero-main-body p { margin: 0 0 var(--sp-4); font-size: var(--fs-sm); line-height: 1.7; -webkit-line-clamp: 2; }
.hero-kicker { margin-bottom: var(--sp-3); }
.hero-actions { margin-top: var(--sp-5); }
.hero-side-list { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); }
.hero-side-item { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); }
.hero-side-thumb { width: 96px; aspect-ratio: 16 / 10; }
.hero-side-item h3 { margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- 5. 最新ニュース（リード + 順位付きリスト） ---------- */
.latest-layout { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); }
.latest-lead .card-body { padding: var(--sp-5); gap: var(--sp-3); }
.latest-list { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); }
.latest-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) 96px; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); }
.latest-item .rank { color: var(--primary); font-size: 12.5px; font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.latest-item .thumb { width: 96px; aspect-ratio: 16 / 10; border-bottom: 0; }
.latest-item h3 { margin: 0 0 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.category-side .latest-item { grid-template-columns: minmax(0, 1fr) 84px; }

/* ---------- 6. 分野セクション（全分野で同一の 4 分割グリッド） ---------- */
.category-block { border-bottom: 1px solid var(--border); }
.category-block.alt { background: var(--bg-soft); }
.category-layout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; border: 1px solid var(--border); background: var(--border); }
.category-head .view-all { padding-bottom: 4px; }
.cat-rail { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cat-tile { min-height: 124px; padding: var(--sp-5); gap: var(--sp-2); justify-content: flex-start; }
.cat-tile-name { font-size: 18px; line-height: 1.2; }
.cat-tile-count { margin-top: auto; }
.cat-tile { min-height: 0; flex-direction: row; align-items: center; gap: var(--sp-3); padding: 18px var(--sp-5); }
.cat-tile-name { font-size: 16px; line-height: 1.2; }
.cat-tile-count { margin: 0 0 0 auto; }
.cat-tile-arrow { position: static; margin-left: var(--sp-3); right: auto; bottom: auto; font-size: 14px; }

/* 画像読込失敗時のヒーロー（プレースホルダ画像に差し替わる） */
.hero-main-card > img { background: #121417; }
.hero-main-card > img.img-fail { opacity: 0; }
@media (min-width: 769px) { .hero-main-card:has(img.img-fail) { min-height: 440px; } }
.article-hero:has(img.img-fail) { aspect-ratio: auto; height: 132px; max-height: 132px; }
.article-hero:has(img.img-fail)::after { font-size: 11px; }

/* ---------- 4.0c ヒーロー見出しの折り返しと余白 ---------- */
.home-hero { padding-top: var(--sp-6); }
.hero-main-body h1 { font-size: clamp(30px, 3.3vw, 50px); text-wrap: balance; }
@media (max-width: 1080px) { .home-hero { padding-top: var(--sp-5); } .hero-main-body h1 { font-size: clamp(26px, 4.4vw, 38px); } }

/* ---------- 4.0d 記事ページも同じ左右端に揃える / spec-sheet rail ---------- */
.article-page { padding-top: var(--sp-6); }

/* ---------- 4.0f ページ見出し・ポイント画面も同じ幅に ---------- */
.container.page, .container.search-page { padding-top: 0; }
.page-head { padding: var(--sp-7) 0 var(--sp-4); margin: 0 0 var(--sp-6); }
.pts-wrap { max-width: none; margin: 0; }
/* 4.0f */

/* ---------- 4.0g ポイント画面のガラス残りを面＋罫線に ---------- */
.pts-wrap, .pts-card, .pts-hero, .pts-login {
  background-image: none; box-shadow: none; border-radius: 0;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.pts-wrap { background: transparent; gap: 1px; padding-top: var(--sp-6); }
.pts-card, .pts-login { background-color: var(--card); border: 1px solid var(--border); }
.pts-login { padding: var(--sp-9) var(--sp-6); display: flex; flex-direction: column; align-items: center; text-align: center; }
/* 4.0g */
.article-page > article { max-width: none; margin: 0; }
.article-hero { aspect-ratio: 16 / 7; max-height: 480px; border: 1px solid var(--border); }
.article-head { max-width: none; margin: var(--sp-6) 0 0; }
.article-body { display: grid; grid-template-columns: minmax(0, 1fr) 288px; gap: var(--sp-8); align-items: start; margin-top: var(--sp-6); }
.article-main { min-width: 0; }
.article-rail { position: sticky; top: calc(var(--header-h) + var(--sp-5)); display: flex; flex-direction: column; gap: var(--sp-4); }
.spec { border: 1px solid var(--border); background: var(--card); }
.spec-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: var(--sp-3); align-items: baseline; padding: 13px var(--sp-4); border-bottom: 1px solid var(--border); }
.spec-row:last-child { border-bottom: 0; }
.spec-k { color: var(--faint); font-size: var(--fs-label); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.spec-v { color: var(--text); font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums; }
.article-main .prose { max-width: none; margin: 0; }
.prose { font-size: 16.5px; line-height: 1.95; }
.prose p { margin: 0 0 var(--sp-4); }
.prose h2 { margin: var(--sp-7) 0 var(--sp-3); padding-bottom: var(--sp-2); font-size: 21px; line-height: 1.35; letter-spacing: -.02em; }
.prose h3 { margin: var(--sp-5) 0 var(--sp-2); font-size: var(--fs-h3); line-height: 1.45; }
.prose img { max-width: 100%; border: 1px solid var(--border); }
.prose blockquote { margin: var(--sp-5) 0; padding: var(--sp-4) var(--sp-5); border-left: 3px solid var(--primary); background: var(--card); color: var(--muted); }
.article-page .source-box, .article-page .points-note { margin-top: var(--sp-5); }
@media (max-width: 980px) {
  .article-body { grid-template-columns: 1fr; gap: 0; margin-top: var(--sp-5); }
  .article-rail { display: none; }
  .article-hero { aspect-ratio: 16 / 9; }
}

/* ---------- 4.0e コンテナの左右ガターを必ず保持（padding 0 に潰されていた） ---------- */
